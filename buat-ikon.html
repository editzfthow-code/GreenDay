<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Ikon GreenDay</title>
<style>
body{font-family:"Sora",system-ui,sans-serif;background:#f4f6ef;color:#1e2a22;max-width:480px;margin:40px auto;padding:0 18px;line-height:1.6}
h1{font-size:22px}
.card{background:#fffdf8;border:1px solid #e0e4d5;border-radius:18px;padding:20px;box-shadow:0 10px 30px -18px rgba(28,42,33,.25)}
canvas{border-radius:22px;display:block}
.row{display:flex;gap:18px;align-items:center;margin:18px 0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:13px;padding:11px 16px;font:600 14px Sora,sans-serif;background:#2e6b4e;color:#f2f8f0;cursor:pointer}
.btn.alt{background:#edf0e5;color:#1e2a22}
code{background:#edf0e5;padding:1px 7px;border-radius:6px}
</style>
</head>
<body>
<h1>Generator Ikon PWA — GreenDay</h1>
<div class="card">
  <p>Klik kedua tombol, lalu simpan berkasnya <b>di folder yang sama dengan <code>index.html</code></b>. Nama file sudah otomatis benar.</p>
  <div class="row">
    <canvas id="c512" width="512" height="512" style="width:104px;height:104px"></canvas>
    <canvas id="c192" width="192" height="192" style="width:104px;height:104px"></canvas>
    <div>
      <button class="btn" onclick="dl('c192','icon-192.png')">Unduh icon-192.png</button><br><br>
      <button class="btn alt" onclick="dl('c512','icon-512.png')">Unduh icon-512.png</button>
    </div>
  </div>
  <p style="font-size:13px;color:#63736a">Setelah kedua file tersimpan, halaman ini boleh dihapus.</p>
</div>
<script>
function draw(cv){
  var x=cv.getContext("2d"), S=cv.width;
  x.fillStyle="#2e6b4e"; x.fillRect(0,0,S,S);
  x.strokeStyle="#eef6ee"; x.lineWidth=S*0.058; x.lineCap="round";
  x.beginPath(); x.moveTo(S*0.5,S*0.789); x.lineTo(S*0.5,S*0.559); x.stroke();
  x.fillStyle="#eef6ee";
  x.beginPath(); x.moveTo(S*0.5,S*0.559);
  x.bezierCurveTo(S*0.5,S*0.414,S*0.406,S*0.328,S*0.258,S*0.328);
  x.bezierCurveTo(S*0.258,S*0.48,S*0.406,S*0.559,S*0.5,S*0.559);
  x.fill();
  x.fillStyle="#9fd8b4";
  x.beginPath(); x.moveTo(S*0.5,S*0.48);
  x.bezierCurveTo(S*0.5,S*0.355,S*0.582,S*0.285,S*0.727,S*0.285);
  x.bezierCurveTo(S*0.727,S*0.426,S*0.582,S*0.48,S*0.5,S*0.48);
  x.fill();
}
function dl(id,name){
  var a=document.createElement("a");
  a.href=document.getElementById(id).toDataURL("image/png");
  a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
draw(document.getElementById("c192"));
draw(document.getElementById("c512"));
</script>
</body>
</html>
