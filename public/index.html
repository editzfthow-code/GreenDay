}
function ciciChatRender(msgs, keepTyping=false){
  const box=el("ccMsgs");
  if(box) box.innerHTML=ciciMsgsHTML(msgs);
  if(!keepTyping) ciciTypingRemove();
  ciciChatScroll();

function ciciTypingRemove(){ const t=el("ccTyping"); if(t) t.remove(); }

async function ciciChatSend(text){
  if(ciciBusy) return;
  const inp=el("ccInput");
  const val=(text||inp&&inp.value||"").trim().slice(0,500);
  if(!val) return;
  if(inp){ inp.value=""; uiState.ciciDraft=""; }
  const msgs=ciciChatLoad();
  msgs.push({role:"user", content:val, ts:Date.now()});
  ciciChatStore(msgs);
  ciciChatRender(msgs, true);
  ciciTypingShow();
  ciciBusy=true;
  const sendBtn=el("ccSendBtn"); if(sendBtn) sendBtn.disabled=true;
  try{
    const look=ciciLook();
    const res=await fetch("/api/cici", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        messages:msgs.slice(-14).map(m=>({role:m.role, content:m.content})),
        profile:{ userName:state.profile.name||"", ciciName:look.name||"Cici", tone:look.tone||"manja" }
      })
    });
    const data=await res.json().catch(()=>null);
    if(!res.ok || !data || !data.reply) throw new Error((data&&data.error)||("HTTP "+res.status));
    msgs.push({role:"assistant", content:String(data.reply).slice(0,2000), ts:Date.now()});
    ciciChatStore(msgs);
    ciciChatRender(msgs);
    /* Cici bahagia setelah balasan — kuping daunnya berdenyut senang */
    sfx("tap");
  }catch(err){
    msgs.push({role:"assistant",
      content:"Aduhh, maaf ya... (｡•́︿•̀｡) kepala aku lagi berat jadi nggak bisa mikir. Coba kirim lagi sebentar lagi ya, aku nungguin kok~ 🌱",
      ts:Date.now()});
    ciciChatStore(msgs);
    ciciChatRender(msgs);
  }finally{
    ciciBusy=false;
    ciciTypingRemove();
    if(sendBtn) sendBtn.disabled=false;
  }
}

  const ov=document.createElement("div");

  ov.addEventListener("click",e=>{ if(e.target===ov) e.preventDefault(); });

function tourShow(){
  const step=TOUR_STEPS[tourIdx];
  if(!step){ tourEnd(true); return; }
  const hole=el("tourHole"), card=el("tourCard");
  if(!hole||!card){ tourEnd(false); return; }
  if(step.page && uiState.page!==step.page){ navigate(step.page, true); }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const target=(step.sel && !step.center) ? ($(step.sel) || (step.alt?$(step.alt):null)) : null;
    tourCur=target;
    if(target){
      try{ target.scrollIntoView({block:"center", behavior:"smooth"}); }
      catch(e){ target.scrollIntoView({block:"center"}); }
      tourPosition(target);
      setTimeout(()=>tourPosition(target),150);
      setTimeout(()=>tourPosition(target),360);
      setTimeout(()=>tourPosition(target),640);
    }else{
      tourPosition(null);
    }
    const pct=Math.round((tourIdx+1)/TOUR_STEPS.length*100);
    card.innerHTML=`
      <div class="tour-head"><span class="tour-face">${ciciSVG(46,"excited")}</span>
        <div><b>${esc(step.title)}</b><span>Langkah ${tourIdx+1} dari ${TOUR_STEPS.length}</span></div></div>
      <p class="tour-msg">${esc(step.msg)}</p>
      <div class="tour-foot">
        <span class="tour-dots">${TOUR_STEPS.map((_,i)=>`<i class="${i===tourIdx?"on":""}"></i>`).join("")}</span>
        <button class="btn btn-ghost sm" data-tskip>Lewati</button>
        ${tourIdx>0?`<button class="btn btn-ghost sm" data-tprev>${ic("chevL",14)}</button>`:""}
        <button class="btn btn-primary sm" data-tnext>${tourIdx===TOUR_STEPS.length-1?"Selesai 🎉":"Lanjut"}</button>
      </div>`;
    const g=s=>card.querySelector(s);
    g("[data-tnext]").addEventListener("click",()=>{ sfx("tap"); tourIdx++; tourShow(); });
    const pv=g("[data-tprev]"); if(pv) pv.addEventListener("click",()=>{ sfx("tap"); tourIdx=Math.max(0,tourIdx-1); tourShow(); });
    g("[data-tskip]").addEventListener("click",()=>tourEnd(false));
    if(tourIdx===TOUR_STEPS.length-1) confettiBurst(null, 50);
  }));
}
let tourCur=null, tourRaf=0;
function tourReposition(){
  if(!uiState.tourActive || tourRaf) return;
  tourRaf=requestAnimationFrame(()=>{ tourRaf=0; if(uiState.tourActive) tourPosition(tourCur); });
}
function tourPosition(target){
  const hole=el("tourHole"), card=el("tourCard");
  if(!hole||!card) return;
  if(target && !target.isConnected){ target=null; }
  if(target){
    const r=target.getBoundingClientRect();
    const pad=10;
    hole.style.display="block";
    hole.style.left=(Math.max(6,r.left-pad))+"px";
    hole.style.top=(Math.max(6,r.top-pad))+"px";
    hole.style.width=(r.width+pad*2)+"px";
    hole.style.height=(r.height+pad*2)+"px";
    hole.style.borderRadius=Math.min(24, r.width/3)+"px";
    const cw=Math.min(340, innerWidth-32);
    const ch=Math.max(200, card.offsetHeight||235);
    let cx=Math.max(12, Math.min(innerWidth-cw-12, r.left+r.width/2-cw/2));
    let cy=r.bottom+16;
    if(cy+ch>innerHeight-10) cy=r.top-ch-18;
    cy=Math.max(10, Math.min(cy, innerHeight-ch-10));
    card.style.left=cx+"px";
    card.style.top=cy+"px";
  }else{
    hole.style.display="none";
    const cw=Math.min(340, innerWidth-32), ch=card.offsetHeight||210;
    card.style.left=(innerWidth/2-cw/2)+"px";
    card.style.top=Math.max(14, innerHeight/2-ch/2-20)+"px";
  }
}

/* ================================================================
   NOTIFIKASI LUAR WEB (PN) v5.2 — begitu lewat jam tugas, notifikasi
   langsung muncul di panel perangkat TANPA membuka web:
   - Tepat waktu (timer halaman; tab boleh di latar).
   - Saat aplikasi ditutup/disembunyikan: halaman membangunkan service
     worker (postMessage + Background Sync) -> SW langsung memeriksa.
   - PWA terpasang (Chrome/Android): Periodic Background Sync tetap
     mengecek walau aplikasi benar-benar ditutup.
   - Satu daftar "sudah dikirim" (IndexedDB) dipakai bersama halaman &
     SW -> tidak ada notifikasi dobel antar jalur.
   ================================================================ */
const PN = {
  _flags:null,
  flags(){
    if(!this._flags){
      try{ const v=JSON.parse(localStorage.getItem(STORE_PREFIX+"pnflags")); this._flags=isObj(v)?v:{}; }
      catch(e){ this._flags={}; }
    }
    return this._flags;
  },
  saveFlags(){ try{ localStorage.setItem(STORE_PREFIX+"pnflags", JSON.stringify(this._flags)); }catch(e){} },
  supported(){ return ("Notification" in window); },
  status(){ return this.supported() ? Notification.permission : "unsupported"; },
  granted(){ return this.supported() && Notification.permission==="granted"; },
  async ask(){
    if(!this.supported()){ toast("Browser ini tidak mendukung notifikasi perangkat.","error"); return; }
    if(Notification.permission!=="default"){ renderApp(); return; }
    try{
      await Notification.requestPermission();
    }catch(e){}
    if(this.granted()){
      toast("Notifikasi perangkat aktif! Tugas terlambat akan muncul di luar web.","success");
      this.test(false);
      this.onChange();
      this.registerPeriodic();
    }else if(this.status()==="denied"){
      toast("Izin ditolak. Buka ikon situs/kunci di address bar, set Notifikasi ke Izinkan, lalu muat ulang.","error");
    }
    renderApp();
  },
  async show(title, body, tag, page){
    if(!this.granted()) return false;
    try{
      const reg=await navigator.serviceWorker.ready;
      await reg.showNotification(String(title||"").slice(0,90), {
        body:String(body||"").slice(0,180),
        tag:tag||"greenday", icon:"icon-192.png", badge:"icon-192.png",
        data:{page:page||"tasks"}
      });
      return true;
    }catch(e){
      try{
        const n=new Notification(String(title||"").slice(0,90), {body:String(body||"").slice(0,180), tag:tag||"greenday"});
        n.onclick=()=>{ try{ window.focus(); }catch(_){ } n.close(); };
        return true;
      }catch(_){ return false; }
    }
  },
  /* v5.2: daftar "sudah dikirim" dipakai BERSAMA oleh halaman & service
     worker (IndexedDB "sent") — tidak ada notifikasi dobel, dan tetap
     terkirim apa pun jalurnya (timer halaman / wake SW). */
  _sent:null,_sentP:null,
  sentMap(){
    if(this._sent) return Promise.resolve(this._sent);
    if(this._sentP) return this._sentP;
    this._sentP=new Promise(res=>{
      const done=(v)=>{ this._sent=(v&&isObj(v))?v:{}; this._sentP=null; res(this._sent); };
      try{
        const req=indexedDB.open("greenday-push",1);
        req.onupgradeneeded=()=>{ try{ req.result.createObjectStore("kv"); }catch(e){} };
        req.onsuccess=()=>{
          try{
            const r=req.result.transaction("kv","readonly").objectStore("kv").get("sent");
            r.onsuccess=()=>done(r.result);
            r.onerror=()=>done({});
          }catch(e){ done({}); }
        };
        req.onerror=()=>done({});
      }catch(e){ done({}); }
    });
    return this._sentP;
  },
  saveSent(){
    const s=this._sent; if(!s) return;
    try{
      const req=indexedDB.open("greenday-push",1);
      req.onupgradeneeded=()=>{ try{ req.result.createObjectStore("kv"); }catch(e){} };
      req.onsuccess=()=>{ try{ req.result.transaction("kv","readwrite").objectStore("kv").put(s,"sent"); }catch(e){} };
    }catch(e){}
  },
  pushOverdue(t, kapan){
    if(!this.granted()) return;
    const key=t.id+"|"+t.date+"|"+(t.time||"");
    this.sentMap().then(sent=>{
      try{
        if(sent[key]) return;
        this.show("Tugas terlambat: "+t.title,
          `Dijadwalkan ${kapan} dan belum selesai. Ketuk untuk membuka GreenDay.`,
          "gd-overdue-"+t.id, "tasks").then(ok=>{ if(ok){ sent[key]=Date.now(); this.saveSent(); } });
      }catch(e){}
    }).catch(()=>{});
  },
  test(withToast){
    this.show("Notifikasi GreenDay aktif ✅",
      "Beginilah tugas terlambat muncul di luar web. Semangat ber-GreenDay ria!",
      "gd-test", "tasks").then(ok=>{
        if(withToast) toast(ok?"Notifikasi uji terkirim — lihat panel notifikasi perangkatmu.":"Izin belum aktif — tidak bisa mengirim uji.", ok?"success":"error");
      });
  },
  /* Timer tepat waktu (aplikasi berjalan, tab boleh di latar) */
  _timer:null,
  scheduleNext(){
    clearTimeout(this._timer);
    if(!this.granted()) return;
    const now=Date.now();
    let earliest=null;
    for(const t of state.tasks){
      if(t.done||!t.date||!t.time) continue;
      const due=parseISO(t.date);
      due.setHours(parseInt(String(t.time).slice(0,2),10)||0, parseInt(String(t.time).slice(3,5),10)||0, 0, 0);
      const ms=due.getTime()+60000-now;
      if(ms<=0 || ms>2147483000) continue;
      if(earliest===null || ms<earliest) earliest=ms;
    }
    if(earliest!==null){
      this._timer=setTimeout(()=>{ this._timer=null; try{ NC.check(); }catch(e){} this.scheduleNext(); }, earliest);
    }
  },
  /* Snapshot tugas ke IndexedDB untuk diperiksa service worker walau
     aplikasi ditutup. Sekaligus menyatukan daftar "sudah dikirim":
     tanda lama (pnflags) dipindah ke "sent" + kunci tugas yang sudah
     tidak ada dibuang — halaman & SW memakai satu daftar yang sama,
     sehingga notifikasi tidak pernah dobel antar jalur. */
  idbSnapshot(){
    try{
      const req=indexedDB.open("greenday-push",1);
      req.onupgradeneeded=()=>{ try{ req.result.createObjectStore("kv"); }catch(e){} };
      req.onsuccess=()=>{
        try{
          const db=req.result;
          const tx=db.transaction("kv","readwrite");
          const store=tx.objectStore("kv");
          const items=state.tasks.map(t=>({id:t.id, title:String(t.title||"").slice(0,90), date:t.date||"", time:t.time||"", done:!!t.done}));
          store.put({ts:Date.now(), items}, "tasks");
          const r=store.get("sent");
          r.onsuccess=()=>{
            try{
              let sent=(r.result&&isObj(r.result))?r.result:{};
              const f=this.flags();
              for(const k in f){
                if(k.slice(0,3)==="ov|"){ const nk=k.slice(3); if(!sent[nk]) sent[nk]=f[k]||Date.now(); }
              }
              const live=new Set(items.map(t=>t.id+"|"+t.date+"|"+(t.time||"")));
              for(const k in sent){ if(!live.has(k)) delete sent[k]; }
              store.put(sent,"sent");
              if(!this._sentP) this._sent=sent;
            }catch(e){}
          };
        }catch(e){}
      };
    }catch(e){}
  },
  /* Dipanggil saat data tugas berubah */
  onChange(){ this.scheduleNext(); this.idbSnapshot(); },
  async registerPeriodic(){
    try{
      if(!("serviceWorker" in navigator) || !navigator.permissions) return;
      const reg=await navigator.serviceWorker.ready;
      if(!reg.periodicSync) return;
      const st=await navigator.permissions.query({name:"periodic-background-sync"});
      if(st.state!=="granted") return;
      await reg.periodicSync.register("gd-overdue", {minInterval:3*3600*1000});
    }catch(e){}
  }
};

/* v5.4: jembatan persist() -> PN.onChange() dengan penundaan singkat agar
   perubahan tugas beruntun (tambah/edit/centang/hapus/impor) tidak

/* v5.2: bangunkan service worker saat aplikasi disembunyikan/ditutup —
   ia langsung memeriksa tugas terlambat & mengirim notifikasi
   tanpa menunggu aplikasi dibuka lagi. */
function swWake(){
  try{
    const send=(sw)=>{ try{ if(sw) sw.postMessage({type:"GD_SYNC"}); }catch(e){} };
    if(navigator.serviceWorker){
      if(navigator.serviceWorker.controller) send(navigator.serviceWorker.controller);
      navigator.serviceWorker.ready.then(reg=>{
        send(reg.active);
        /* Background Sync: satu jendela wake tambahan saat online */
        try{ if(reg.sync) reg.sync.register("gd-overdue-sync"); }catch(e){}
      }).catch(()=>{});
    }
  }catch(e){}
}

    if(!q){

    }else{
      const acts=quickActions.filter(a=>a.t.toLowerCase().includes(q));
      if(acts.length) groups.push(["Aksi", acts]);
      const pgs=pages.filter(([p,l])=>l.toLowerCase().includes(q)).map(([p,l])=>({icn:"chevR",t:l,d:"Buka halaman "+l,kind:"Halaman",fn:()=>{ closeModalP(); navigate(p); }}));
      if(pgs.length) groups.push(["Halaman", pgs]);

      if(tasks.length) groups.push(["Tugas", tasks]);
      const notes=state.notes.filter(n=>(n.title+" "+n.content).toLowerCase().includes(q)).slice(0,5)
        .map(n=>({icn:"note",t:n.title||"Catatan tanpa judul",d:snippet(n.content,60),kind:"Catatan",fn:()=>{ closeModalP(); openNoteModal(n); }}));
      if(notes.length) groups.push(["Catatan", notes]);
      const jrs=state.journals.filter(j=>(j.title+" "+j.content).toLowerCase().includes(q)).slice(0,5)
        .map(j=>({icn:"journal",t:j.title||"Jurnal "+shortDate(j.date),d:snippet(j.content,60)+" · "+shortDate(j.date),kind:"Jurnal",fn:()=>{ closeModalP(); openJournalModal(j); }}));

    const x=items[+b.dataset.pal]; if(x){ closeModalP(); x.fn(); }
  });
  renderList();
}

const catOf  = id=>CATS.find(c=>c.id===id)||CATS[5];

const journalByDate = ds=>state.journals.find(j=>j.date===ds);
const habitDoneToday = h=>h.dates.includes(isoDate());
function habitStreak(h){
  const set=new Set(h.dates); let n=0; const d=new Date();
  if(!set.has(isoDate(d))) d.setDate(d.getDate()-1);
  while(set.has(isoDate(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function habitConsistency(h,days=30){
  let n=0; lastNDates(days).forEach(ds=>{ if(h.dates.includes(ds)) n++; });
  return Math.round(n/days*100);
}
function tasksDoneOn(ds){
  return state.tasks.filter(t=>{
    if(!t.done) return false;
    if(t.completedAt) return isoDate(new Date(t.completedAt))===ds;
    return t.date===ds;
  }).length;
}
const habitDoneOn = ds=>state.habits.reduce((s,h)=>s+(h.dates.includes(ds)?1:0),0);
function goalPct(g){
  if(!g.steps.length) return 0;
  return Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100);
}
function computeStats(){
  const today=isoDate();
  const done=state.tasks.filter(t=>t.done).length;
  const open=state.tasks.filter(t=>!t.done).length;
  const tToday=state.tasks.filter(t=>t.date===today);
  return {
    done, open,
    completion: state.tasks.length?Math.round(done/state.tasks.length*100):0,
    todayPct: tToday.length?Math.round(tToday.filter(t=>t.done).length/tToday.length*100):0,
    journals: state.journals.length,
    habitDone: state.habits.filter(habitDoneToday).length,
    habitTotal: state.habits.length,
    bestStreak: state.habits.reduce((m,h)=>Math.max(m,habitStreak(h)),0),
    goalAvg: state.goals.length?Math.round(state.goals.reduce((s,g)=>s+goalPct(g),0)/state.goals.length):0
  };
}

function weeklyBuckets(n=12){
  const out=[];
  const now=new Date();
  const end=new Date(now); end.setDate(end.getDate()+ (7-end.getDay()));
  for(let w=n-1;w>=0;w--){
    const e=new Date(end); e.setDate(end.getDate()-w*7);
    const s=new Date(e); s.setDate(e.getDate()-7);
    const days=[];
    for(let d=new Date(s); d<e; d.setDate(d.getDate()+1)) days.push(isoDate(d));
    const val=days.reduce((acc,ds)=>acc+tasksDoneOn(ds)+habitDoneOn(ds),0);
    out.push({label:`${s.getDate()}/${s.getMonth()+1}`, value:val});
  }
  return out;
}

function filteredTasks(){
  const {q,filter,sort}=uiState.tasks;
  const lq=q.trim().toLowerCase();
  let list=state.tasks.filter(t=>!lq || (t.title+" "+(t.desc||"")).toLowerCase().includes(lq));
  const today=isoDate();
  if(filter==="hari-ini")      list=list.filter(t=>t.date===today);
  else if(filter==="mendatang") list=list.filter(t=>t.date && t.date>today);
  else if(filter==="terlambat") list=list.filter(t=>t.date && t.date<today && !t.done);
  else if(filter==="selesai")   list=list.filter(t=>t.done);
  const P={tinggi:0,sedang:1,rendah:2};
  const byDT=(a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||(a.time||"99:99").localeCompare(b.time||"99:99");
  if(sort==="waktu")        list=[...list].sort(byDT);
  else if(sort==="terbaru") list=[...list].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  else                      list=[...list].sort((a,b)=>P[a.priority]-P[b.priority]||byDT(a,b));
  return list;
}
function tabCounts(){
  const today=isoDate();
  const lq=uiState.tasks.q.trim().toLowerCase();
  const base=state.tasks.filter(t=>!lq || (t.title+" "+(t.desc||"")).toLowerCase().includes(lq));
  return {
    "semua":base.length,
    "hari-ini":base.filter(t=>t.date===today).length,
    "mendatang":base.filter(t=>t.date&&t.date>today).length,
    "terlambat":base.filter(t=>t.date&&t.date<today&&!t.done).length,
    "selesai":base.filter(t=>t.done).length
  };
}

  const list=filteredTasks();
  if(!list.length){
    if(uiState.tasks.q.trim()) return emptySm("search","Tidak ada hasil",`Tidak ada tugas yang cocok dengan pencarian "${uiState.tasks.q.trim()}".`);
    const msgs={
      "semua":["tasks","Belum ada tugas","Mulai dengan menambahkan tugas pertamamu."],
      "hari-ini":["sun","Tidak ada tugas hari ini","Nikmati harimu, atau rancang tugas baru."],
      "mendatang":["calendar","Tidak ada tugas mendatang","Semua tugasmu sudah tertangani."],
      "terlambat":["check","Tidak ada tugas terlambat","Kerja bagus, semua tepat waktu."],
      "selesai":["check","Belum ada tugas selesai","Centang tugas setelah kamu menyelesaikannya."]
    };
    const [i,t,d]=msgs[uiState.tasks.filter]||msgs["semua"];
    return emptySm(i,t,d);
  }
  return list.map(taskItemHTML).join("");
}

/* ---------------- Kalender ---------------- */
function monthLabel(y,m){ return `${MONTHS[m]} ${y}`; }
function calGridHTML(y,m,{sel=null,mini=false}={}){
  const first=new Date(y,m,1), startDow=first.getDay();
  const dim=new Date(y,m+1,0).getDate();
  const today=isoDate();
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(`<span class="cal-cell" aria-hidden="true"></span>`);
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`;
    const hasTask=state.tasks.some(t=>t.date===ds);
    const hasEv=state.events.some(e=>e.date===ds);
    const hasJr=!!journalByDate(ds);
    const dots=(hasTask?"<i></i>":"")+(hasEv?"<i class='ev'></i>":"")+(hasJr?"<i class='jr'></i>":"");
    const jrCls=mini&&hasJr?"hasjr":"";
    cells.push(`<button type="button" class="cal-cell ${ds===today?"today":""} ${ds===sel?"sel":""} ${jrCls}"
      data-action="${mini?"jcal-pick":"cal-pick"}" data-date="${ds}" aria-label="${ds}">${d}
      <span class="cal-dots">${dots}</span></button>`);
  }
  const rem=(7-(cells.length%7))%7;
  for(let i=0;i<rem;i++) cells.push(`<span class="cal-cell" aria-hidden="true"></span>`);
  return cells.join("");
}

function notesGridHTML(){
  const lq=uiState.notesQ.trim().toLowerCase();
  const list=state.notes
    .filter(n=>!lq || (n.title+" "+n.content).toLowerCase().includes(lq))
    .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||"")));
  if(!list.length){
    if(lq) return emptySm("search","Tidak ada hasil",`Tidak ada catatan yang cocok dengan "${uiState.notesQ.trim()}".`);
    return emptyState("note","Belum ada catatan","Simpan ide yang muncul tiba-tiba — catatan tersimpan otomatis saat kamu menulis.",
      `<button class="btn btn-primary" data-action="note-new">${ic("plus",16)} Buat Catatan</button>`);
  }
  return list.map(noteCardHTML).join("");
}

function afterSettings(){

  if(rt) rt.addEventListener("change",()=>{
    state.settings.reminderTime = rt.value || "07:00";
    persist("settings");
    toast("Jam pengingat harian disimpan: "+fmtTime(state.settings.reminderTime)+".","success");

/* ================= ROUTER ================= */
const PAGES = {
  home:     { render:renderHome },
  tasks:    { render:renderTasks,  after:afterTasks },
  calendar: { render:renderCalendar },
  journal:  { render:renderJournal, after:afterJournal },
  habits:   { render:renderHabits },
  notes:    { render:renderNotes,  after:afterNotes },
  goals:    { render:renderGoals },
  stats:    { render:renderStats },
  cici:     { render:renderCici,   after:afterCici  },
  profile:  { render:renderProfile, after:afterProfile },
  settings: { render:renderSettings, after:afterSettings }
};
const SUB_PAGES=["habits","notes","goals","stats","settings"];

function renderApp(){
  const page=PAGES[uiState.page]||PAGES.home;
  const view=el("view");
  view.classList.remove("page-enter");
  view.innerHTML=page.render();
  void view.offsetWidth;
  view.classList.add("page-enter");
  setActiveNav();
  if(page.after) page.after();
  animateVisuals();
  tickClock();
  if(uiState.lastDoneId){
    const r=$(`.task[data-id="${uiState.lastDoneId}"]`);
    if(r) r.classList.add("just-done");
    uiState.lastDoneId=null;
  }
  if(uiState.lastHabitId){
    const b=$(`.h-check[data-id="${uiState.lastHabitId}"]`);
    if(b) b.classList.add("just-check");
    uiState.lastHabitId=null;
  }
  /* Kartu pengumuman di Beranda */
  if(uiState.page==="home"){
    const html=annCardHTML();
    if(html) view.insertAdjacentHTML("beforeend", html);
  }
  /* v5.4.1: segarkan penanda fade pada strip aksi cepat yang baru dirender */
  if(window.markScrollables) window.markScrollables();
}
function navigate(p, replaceHistory=false){
  if(!PAGES[p]) p="home";
  const changed=p!==uiState.page;
  uiState.page=p;
  if(changed){
    /* v5.4: replaceHistory untuk tur - dulu 13 langkah tur menumpuk 13
       entri riwayat browser sehingga tombol Back perangkat melangkah
       mundur halaman demi halaman setelah tur selesai. */
    try{ if(replaceHistory) history.replaceState(null,"","#"+p); else history.pushState(null,"","#"+p); }catch(e){ location.hash=p; }
    window.scrollTo({top:0,behavior:"instant"});
    ciciOnNavigate(p);
  }
  renderApp();
}
function setActiveNav(){
  const p=uiState.page;
  $$(".bn-item").forEach(b=>{
    const target=(SUB_PAGES.includes(p)?"profile":p);
    b.classList.toggle("active", b.dataset.page===target);
  });
  $$(".sb-item").forEach(b=>b.classList.toggle("active", b.dataset.page===p));
}

  "task-new":()=>openTaskModal(),

  "task-toggle":(id)=>{
    const t=state.tasks.find(x=>x.id===id); if(!t) return;
    t.done=!t.done;
    t.completedAt=t.done?new Date().toISOString():null;
    let ulang=false;
    if(t.done && t.repeat && t.repeat!=="none"){
      const nd=nextRepeatDate(t.date,t.repeat);
      /* v5.4: jangan bikin salinan kedua yang identik bila batalkan-centang
         lalu centang ulang (dulu duplikat tugas berulang bermunculan). */
      if(nd && !state.tasks.some(x=>x.id!==t.id && !x.done && x.title===t.title && x.date===nd && x.repeat===t.repeat)){
        state.tasks.push({id:uid(), title:t.title, desc:t.desc||"", date:nd, time:t.time||"",
          priority:t.priority, category:t.category, repeat:t.repeat, assignee:t.assignee||null,
          subtasks:(t.subtasks||[]).map(s=>({id:uid(), text:s.text, done:false})),
          done:false, completedAt:null, createdAt:new Date().toISOString()});
        ulang=true;
        toast(`Tugas berulang dijadwalkan ulang ke ${shortDate(nd)}.`,"info");
      }
    }
    if(t.done){
      uiState.lastDoneId=id;
      const btnEl=$(`.t-check[data-id="${id}"]`);
      confettiFromElement(btnEl, 30);
      sfx("done");
      const subDone=(t.subtasks||[]).filter(s=>s.done).length;
      /* v5.4: XP hanya sekali per tugas — batalkan lalu centang lagi tidak
         lagi menambah XP dobel (pencabutan mengembalikan XP). */
      if(!t.xpDone){ xpGain(10+Math.min(5,subDone), "Tugas selesai: "+t.title); t.xpDone=true; }
      /* Cek "hari sempurna": semua tugas hari ini selesai (min 3) */
      const today=isoDate();
      const tt=state.tasks.filter(x=>x.date===today);
      if(tt.length>=3 && tt.every(x=>x.done)){
        setTimeout(()=>{
          confettiBurst(null,110); sfx("level");
          toast("Hari sempurna! Semua tugas hari ini selesai 🎉","success");
          ciciSay(`GOKIL ${esc(state.profile.name||"bestie")}! <b>Semua tugas hari ini kelar</b> semua! 🎉 Kamu tuh luar biasa sih, bangga aku! Waktunya rebahan, kamu deserve it~ ✨`, 8500, "excited");
        },450);
      }
    }else{
      sfx("tap");
      /* v5.4: batalkan selesai = XP dikembalikan (anti-farm XP) */
      if(t.xpDone){
        const subDone=(t.subtasks||[]).filter(s=>s.done).length;
        xpGain(-(10+Math.min(5,subDone)), "Batal tugas: "+t.title);
        t.xpDone=false;
        toast("Status selesai dibatalkan — XP dikembalikan.","info");
      }else{
        toast("Status selesai dibatalkan.","success");
      }
    }
    persist("tasks"); renderApp();
    if(t.done && !ulang) toast("Tugas ditandai selesai. +XP untukmu!","success");
  },
  "task-del":(id)=>removeItem("tasks",id,"Tugas"),
  "tasks-clear-done":async()=>{
    /* v5.4: bersihkan semua tugas selesai sekaligus (dengan konfirmasi & urungkan) */
    const done=state.tasks.filter(t=>t.done);
    if(!done.length){ toast("Tidak ada tugas selesai untuk dibersihkan.","info"); return; }
    const ok=await confirmDialog({title:"Bersihkan tugas selesai?",
      message:`${done.length} tugas selesai akan dihapus dari daftar. XP yang sudah kamu dapat tetap tersimpan.`});
    if(!ok) return;
    state.tasks=state.tasks.filter(t=>!t.done);
    persist("tasks"); renderApp(); sfx("tap");
    toast(`${done.length} tugas selesai dibersihkan.`,"success",{label:"Urungkan",fn:()=>{

/* ================= MODAL FORMULIR ================= */
function openTaskModal(task){
  const isNew=!task;
  const src=task||{title:"",desc:"",date:isoDate(),time:"",priority:"sedang",category:"pribadi",repeat:"none",assignee:null,subtasks:[]};
  let prio=src.priority, cat=src.category;
  let rep=(src.repeat && REPEATS.some(r=>r[0]===src.repeat)) ? src.repeat : "none";
  let subs=(src.subtasks||[]).filter(s=>s&&s.text).map(s=>({id:uid(),text:String(s.text),done:!!s.done}));
  const users=userRegistry();
  const ov=openModal(`
    <div class="modal-head"><h3>${ic("tasks",18)} ${isNew?"Tambah Tugas":"Edit Tugas"}</h3>
      <button class="icon-btn sm" data-close-x aria-label="Tutup">${ic("x",17)}</button></div>
    <form class="modal-body" id="taskForm" novalidate>
      <div class="field"><label class="lbl" for="tfTitle">Judul tugas</label>
        <input class="inp" id="tfTitle" maxlength="120" placeholder="Misal: Menyelesaikan laporan" value="${esc(src.title)}"></div>
      <div class="field"><label class="lbl" for="tfDesc">Deskripsi <span class="opt">(opsional)</span></label>
        <textarea class="inp" id="tfDesc" rows="2" maxlength="400" placeholder="Detail tambahan...">${esc(src.desc)}</textarea></div>
      <div class="row2">
        <div class="field"><label class="lbl" for="tfDate">Tanggal</label>
          <input type="date" class="inp" id="tfDate" value="${esc(src.date)}"></div>
        <div class="field"><label class="lbl" for="tfTime">Waktu</label>
          <input type="time" class="inp" id="tfTime" value="${esc(src.time)}"></div>
      </div>
      <div class="field"><span class="lbl">Prioritas</span>
        <div class="seg" id="tfPrio">${PRIOS.map(p=>`<button type="button" data-p="${p.id}" class="${p.id===prio?"sel":""}">${p.label}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Kategori</span>
        <div class="chips-pick" id="tfCat">${CATS.map(c=>`<button type="button" class="chip ${c.cls} ${c.id===cat?"sel":""}" data-c="${c.id}">${c.label}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Ulangi <span class="opt">(tugas rutin keluarga)</span></span>
        <div class="seg" id="tfRepeat">${REPEATS.map(([id,lab])=>`<button type="button" data-r="${id}" class="${id===rep?"sel":""}">${lab}</button>`).join("")}</div></div>
      ${users.length>1?`
      <div class="field"><label class="lbl" for="tfAsg">Penanggung jawab <span class="opt">(opsional — untuk dipakai bersama)</span></label>
        <select class="inp" id="tfAsg">
          <option value="">— Tanpa penanggung jawab —</option>
          ${users.map(u=>{const up=userProfileOf(u.id)||{};return `<option value="${u.id}" ${src.assignee===u.id?"selected":""}>${esc(up.name||"Anggota")} ${esc(up.avatar||"")}</option>`;}).join("")}
        </select></div>`:""}
      <div class="field"><span class="lbl">Langkah-langkah <span class="opt">(opsional — sub-tugas)</span></span>
        <div id="tfSubs"></div>
        <div class="step-row" style="margin-top:2px">
          <input class="inp" id="tfSubInp" maxlength="120" placeholder="Tambah langkah, lalu Enter">
          <button type="button" class="btn btn-ghost sm" id="tfSubAdd">${ic("plus",14)}</button>
        </div></div>
      <p class="form-err" id="tfErr"></p>
    </form>
    <div class="modal-foot">
      ${isNew?"":`<button type="button" class="btn btn-danger sm" id="tfDel">${ic("trash",15)} Hapus</button>`}
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" data-cancel>Batal</button>
      <button type="submit" form="taskForm" class="btn btn-primary">${isNew?"Tambah":"Simpan"}</button>
    </div>`);
  const g=s=>ov.querySelector(s);
  const paintSubs=()=>{
    g("#tfSubs").innerHTML = subs.length
      ? subs.map((s,i)=>`
        <div class="sub-row">
          <button type="button" class="cbx ${s.done?"on":""}" data-subdone="${i}" aria-label="Tandai langkah selesai">${ic("check",12)}</button>
          <span class="${s.done?"done-tx":""}">${esc(s.text)}</span>
          <button type="button" class="icon-btn sm" data-subdel="${i}" aria-label="Hapus langkah">${ic("trash",13)}</button>
        </div>`).join("")
      : `<p class="mut" style="font-size:12px;margin:2px 0 6px">Belum ada langkah — pecah tugas besar jadi langkah kecil agar lebih mudah dikerjakan.</p>`;
  };
  paintSubs();
  g("#tfSubs").addEventListener("click",e=>{
    const d=e.target.closest("[data-subdone]");
    if(d){ const s=subs[+d.dataset.subdone]; if(s){ s.done=!s.done; paintSubs(); } return; }
    const x=e.target.closest("[data-subdel]");
    if(x){ subs.splice(+x.dataset.subdel,1); paintSubs(); }
  });
  const addSub=()=>{
    const inp=g("#tfSubInp"), v=inp.value.trim();
    if(!v) return;
    if(subs.length>=15){ toast("Maksimal 15 langkah per tugas.","info"); return; }
    subs.push({id:uid(),text:v.slice(0,120),done:false});
    inp.value=""; paintSubs(); inp.focus();

function openNoteModal(n){
  let obj=n||null;
  let color=(n&&n.color)||"sage", pinned=(n&&n.pinned)||false, timer=null;
  const ov=openModal(`
    <div class="modal-head"><h3>${ic("note",18)} ${n?"Edit Catatan":"Catatan Baru"}</h3>
      <div class="mh-side">
        <button type="button" class="icon-btn sm" id="nfPin" title="Sematkan" aria-label="Sematkan catatan" style="${pinned?"color:var(--primary);border-color:var(--primary)":""}">${ic("pin",16)}</button>
        <button type="button" class="icon-btn sm" data-close-x aria-label="Tutup">${ic("x",17)}</button>
      </div></div>
    <div class="modal-body">
      <div class="field"><label class="lbl" for="nfTitle">Judul <span class="opt">(opsional)</span></label>
        <input class="inp" id="nfTitle" maxlength="80" placeholder="Judul catatan" value="${esc(n?n.title:"")}" autocomplete="off"></div>
      <div class="field"><label class="lbl" for="nfBody">Isi catatan</label>
        <textarea class="inp" id="nfBody" rows="7" maxlength="2000" placeholder="Tulis idemu di sini...">${esc(n?n.content:"")}</textarea></div>
      <div class="field"><span class="lbl">Warna</span>
        <div class="color-pick" id="nfColor">${NOTE_COLORS.map(c=>`<button type="button" class="cp cp-${c} ${c===color?"sel":""}" data-c="${c}" aria-label="Warna ${c}"></button>`).join("")}</div></div>
      <span class="save-ind" id="nfSave">Tersimpan otomatis saat menulis</span>
    </div>
    <div class="modal-foot">
      ${n?`<button type="button" class="btn btn-danger sm" id="nfDel">${ic("trash",15)} Hapus</button>`:""}
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" id="nfDone">Selesai</button>
    </div>`,{onClose:cleanupNote});
  const g=s=>ov.querySelector(s);
  function cleanupNote(){
    clearTimeout(timer);
    if(obj && !String(obj.title).trim() && !String(obj.content).trim()){
      const i=state.notes.indexOf(obj);
      if(i>=0){ state.notes.splice(i,1); persist("notes"); renderApp(); }
    }
  }
  function save(){
    const title=g("#nfTitle").value, content=g("#nfBody").value;
    if(!obj){
      if(!title.trim() && !content.trim()) return;
      obj={id:uid(),title:"",content:"",color,pinned,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
      state.notes.push(obj);
      xpGain(2,"Catatan baru");
    }
    obj.title=title; obj.content=content; obj.color=color; obj.pinned=pinned;
    obj.updatedAt=new Date().toISOString();
    persist("notes"); renderApp();
    const ind=g("#nfSave"); ind.textContent="Tersimpan ✓"; ind.classList.add("flash");
    setTimeout(()=>{ ind.textContent="Tersimpan otomatis saat menulis"; ind.classList.remove("flash"); },1400);
  }
  const queueSave=()=>{ clearTimeout(timer); timer=setTimeout(save,550); };
  g("#nfTitle").addEventListener("input",queueSave);
  g("#nfBody").addEventListener("input",queueSave);
  g("#nfColor").addEventListener("click",e=>{
    const b=e.target.closest("[data-c]"); if(!b) return;
    color=b.dataset.c;
    $$(".cp",g("#nfColor")).forEach(x=>x.classList.toggle("sel",x===b));
    if(obj) save();
  });
  g("#nfPin").addEventListener("click",()=>{
    pinned=!pinned;
    g("#nfPin").style.color=pinned?"var(--primary)":"";
    g("#nfPin").style.borderColor=pinned?"var(--primary)":"";
    if(obj) save(); else queueSave();
  });
  g("#nfDone").addEventListener("click",()=>{ clearTimeout(timer); save(); closeModal(); });
  if(n) g("#nfDel").addEventListener("click",async()=>{
    const ok=await confirmDialog({title:"Hapus catatan ini?",message:"Catatan ini akan dihapus permanen."});
    if(!ok) return;
    const i=state.notes.indexOf(obj);
    if(i>=0){ state.notes.splice(i,1); persist("notes"); }
    closeModal(); renderApp(); toast("Catatan dihapus.","success");
  });
  setTimeout(()=>g(n?"#nfBody":"#nfTitle").focus(),80);
}

/* ================= PENGATURAN: tema, ekspor, impor, reset ================= */
function applySettings(){
  const s=state.settings, root=document.documentElement;
  root.dataset.theme = s.theme==="dark"?"dark":"light";
  root.dataset.accent = s.accent||"forest";
  root.classList.toggle("no-anim", s.animations===false);
  /* v5.3.2: bilah status/navigasi browser ikut tema AKTIF.
     Dulu hanya satu meta theme-color — di Chrome Android warnanya bisa
     "terbalik" (mode gelap dapat bilah hijau terang) atau diganti abu-abu
     bawaan browser (mode terang saat HP dalam mode gelap). Kini KETIGA meta
     (tanpa-media, light, dark) disinkronkan ke warna tema aplikasi saat ini,
     lengkap dengan warna per aksen, sehingga skema warna apa pun yang
     dipakai sistem/HP, bilah browser selalu memakai warna GreenDay yang
     cocok dengan tema yang sedang aktif. */
  const BAR={forest:"#0d7148",sage:"#3d6e5b",moss:"#495a29",ocean:"#0d5c74",sunrise:"#8c5014"};
  const barColor = s.theme==="dark" ? "#0b120d" : (BAR[s.accent]||BAR.forest);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute("content",barColor));
}
function exportData(){
  try{
    const payload={meta:{app:"greenday",version:5,exportedAt:new Date().toISOString()},
      data:{profile:state.profile,settings:state.settings,tasks:state.tasks,journals:state.journals,
        habits:state.habits,events:state.events,notes:state.notes,goals:state.goals,focus:state.focus,notifs:state.notifs,xp:state.xp}};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`greenday-backup-${isoDate()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Berkas cadangan berhasil diunduh.","success");
  }catch(e){ toast("Gagal membuat berkas cadangan.","error"); }
}
function readBackup(obj){
  if(!isObj(obj)||!isObj(obj.meta)||obj.meta.app!=="greenday"||!isObj(obj.data)) return null;
  const d=obj.data, out={}, counts={};
  let any=false;
  ["tasks","journals","habits","events","notes","goals","focus","notifs"].forEach(k=>{
    if(Array.isArray(d[k])){
      out[k]=d[k].filter(isObj).map(x=>({...x,id:(typeof x.id==="string"&&x.id)?x.id:uid()}));
      counts[k]=out[k].length; any=true;
    }
  });
  if(!any) return null;
  out.profile=isObj(d.profile)?d.profile:null;
  out.settings=isObj(d.settings)?d.settings:null;
  out.xp=isObj(d.xp)?d.xp:null;
  return {out,counts};
}
function showImportPreview(parsed){
  const {out,counts}=parsed;
  const label={tasks:"Tugas",journals:"Jurnal",habits:"Kebiasaan",events:"Agenda",notes:"Catatan",goals:"Target",focus:"Sesi fokus",notifs:"Notifikasi"};
  const ov=openModal(`
    <div class="modal-head"><h3>${ic("upload",18)} Impor Cadangan</h3>
      <button class="icon-btn sm" data-close-x aria-label="Tutup">${ic("x",17)}</button></div>
    <div class="modal-body">
      <p class="confirm-msg">Berkas cadangan valid dan berisi data berikut:</p>
      <div class="stat-grid" style="margin-top:12px">
        ${Object.keys(counts).map(k=>`<div class="stat"><span class="st-ic">${ic("check",15)}</span>
          <div><b class="st-num">${counts[k]}</b><span class="st-lab">${label[k]}</span></div></div>`).join("")}
      </div>
      <p class="confirm-msg" style="margin-top:14px">Pilih <b>Gabungkan</b> untuk menambahkan item baru tanpa menghapus data lamamu, atau <b>Timpa Semua</b> untuk menggantikan seluruh data saat ini.</p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" data-cancel>Batal</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="impMerge">Gabungkan</button>
      <button type="button" class="btn btn-danger" id="impOverwrite">Timpa Semua</button>
    </div>`);
  ov.querySelector("#impMerge").addEventListener("click",()=>{
    ["tasks","journals","habits","events","notes","goals","focus","notifs"].forEach(k=>{
      if(!out[k]) return;
      const ids=new Set(state[k].map(i=>i.id));
      out[k].forEach(i=>{ if(!ids.has(i.id)) state[k].push(i); });
      persist(k);
    });
    if(out.xp && typeof out.xp.pts==="number"){
      state.xp.pts=Math.max(state.xp.pts, out.xp.pts);
      persist("xp");
    }
    closeModal(); renderApp();
    toast("Data cadangan berhasil digabungkan.","success");
  });
  ov.querySelector("#impOverwrite").addEventListener("click",()=>{
    ["tasks","journals","habits","events","notes","goals","focus","notifs"].forEach(k=>{
      if(out[k]){ state[k]=out[k]; persist(k); }
    });
    if(out.xp && isObj(out.xp)){
      state.xp={pts:(typeof out.xp.pts==="number")?out.xp.pts:0, log:Array.isArray(out.xp.log)?out.xp.log.slice(-40):[]};
      persist("xp");
    }
    if(out.profile){
      state.profile={...DEFAULTS.profile,...out.profile,onboarded:true};
      persist("profile");
    }
    if(out.settings){
      const s=out.settings, ns={};
      if(s.theme==="light"||s.theme==="dark") ns.theme=s.theme;
      if(["forest","sage","moss","ocean","sunrise"].includes(s.accent)) ns.accent=s.accent;
      if(["panjang","sedang","angka"].includes(s.dateFormat)) ns.dateFormat=s.dateFormat;
      if(typeof s.animations==="boolean") ns.animations=s.animations;
      if(typeof s.sound==="boolean") ns.sound=s.sound;
      state.settings={...state.settings,...ns};
      persist("settings"); applySettings();
    }
    closeModal(); renderApp();
    toast("Seluruh data berhasil ditimpa dari cadangan.","success");
  });
}

function bindGlobal(){
  document.body.addEventListener("click",e=>{
    const btn=e.target.closest("[data-action]");
    if(!btn) return;
    const fn=actions[btn.dataset.action];
    if(fn){ e.preventDefault(); fn(btn.dataset.id,btn,e); }
  });
  document.addEventListener("keydown",e=>{
    /* Ctrl+K / Cmd+K: command palette */
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){
      e.preventDefault();
      if(uiState.paletteOpen) palCloseIfOpen(); else palOpen();
      return;
    }
    if(uiState.tourActive && ["ArrowUp","ArrowDown","PageUp","PageDown"," ","Home","End"].includes(e.key)){
      e.preventDefault();
      return;
    }
    if(e.key!=="Escape") return;
    if(uiState.paletteOpen){ palCloseIfOpen(); return; }
    if(uiState.tourActive){ tourEnd(false); return; }
    const top=modalStack[modalStack.length-1];
    if(top && !top.dataset.locked) closeModal();
  });
  window.addEventListener("hashchange",()=>{
    const p=location.hash.replace("#","");
    if(PAGES[p] && p!==uiState.page){ uiState.page=p; renderApp(); window.scrollTo({top:0,behavior:"instant"}); ciciOnNavigate(p); }
  });
  /* ============ v5.4.1: elemen melayang yang sopan ============
     1) FAB (+ / Cici / pasang-app) menyingkir saat pengguna scroll ke bawah
        dan muncul lagi saat scroll ke atas / berhenti — tombol & kolom isi di
        halaman TIDAK PERNAH lagi tertutup tombol melayang saat dibutuhkan.
     2) Saat keyboard mobile terbuka (fokus di input), semua tombol melayang
        dan gelembung Cici sembunyi — layar tidak sempit lagi.
     3) Strip aksi cepat diberi "fade" tepi sebagai penanda bisa digeser. */
  const FLOAT_SEL=".add-fab,.cici-fab,.gd-fab";
  let lastY=window.scrollY, hideTimer=null, scrollRaf=false;
  function floatShow(){
    document.querySelectorAll(FLOAT_SEL).forEach(f=>f.classList.remove("float-hide"));
  }
  function floatHide(){
    document.querySelectorAll(FLOAT_SEL).forEach(f=>f.classList.add("float-hide"));
  }
  /* fade tepi untuk strip yang bisa digeser (aksi cepat di Beranda) */
  window.markScrollables=function(){
    document.querySelectorAll(".quick-acts").forEach(qa=>{
      const more=qa.scrollWidth>qa.clientWidth+4;
      qa.classList.toggle("has-more",more);
      qa.classList.toggle("scrolled",more && qa.scrollLeft>6);
    });
  };
  window.addEventListener("scroll",()=>{
    if(scrollRaf) return; scrollRaf=true;
    requestAnimationFrame(()=>{
      scrollRaf=false;
      const y=window.scrollY;
      const goingDown=y>lastY+6;
      const atTop=y<24, atBottom=y+window.innerHeight>=document.documentElement.scrollHeight-24;
      clearTimeout(hideTimer);
      if(atTop || atBottom){
        /* v5.4.1: di puncak/dasar halaman konten sudah bebas (padding bawah
           238px + hero ringkas) — FAB boleh tampil permanen. */
        floatShow();
      }else if(goingDown){
        floatHide();
      }else{
        floatShow();
        /* di tengah halaman: hanya tampil SEBENAR scroll ke atas bergerak;
           begitu berhenti, menyingkir lagi supaya tidak menutup tombol
           halaman (permintaan: tidak ada tombol yang posisinya tidak rapi). */
        hideTimer=setTimeout(()=>{ if(!(window.scrollY<24 || window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-24)) floatHide(); }, 700);
      }
      lastY=y;
      markScrollables();
    });
  },{passive:true});
  /* keyboard mobile terbuka/tertutup */
  document.addEventListener("focusin",e=>{
    const t=e.target;
    if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName=="SELECT") && !t.closest(".m-ov,.palette-ov,.onboarding-ov")){
      document.body.classList.add("kb-open");
    }
  });
  document.addEventListener("focusout",()=>{
    /* jeda 80ms: kalau fokus pindah ke input lain, kb-open jangan keburu dilepas
       (mencegah kedip saat berpindah antar kolom formulir) */
    setTimeout(()=>{
      const a=document.activeElement;
      if(!a || !(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")) document.body.classList.remove("kb-open");
    },80);
  });
  document.querySelectorAll(".quick-acts").forEach(qa=>{
    qa.addEventListener("scroll",window.markScrollables,{passive:true});
  });
  markScrollables();
  el("photoFile").addEventListener("change",e=>{
    const f=e.target.files[0]; e.target.value="";
    if(!f) return;
    processImageFile(f).then(dataUrl=>{
      state.profile.photo=dataUrl;
      persist("profile"); renderApp();
      toast("Foto profil berhasil diperbarui.","success");
    }).catch(err=>{
      toast(err.message||"Gagal memproses gambar.","error");
    });
  });
  el("importFile").addEventListener("change",e=>{
    const f=e.target.files[0]; e.target.value="";
    if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      let obj=null;
      try{ obj=JSON.parse(r.result); }catch(err){ obj=null; }
      const parsed=obj&&readBackup(obj);
      if(!parsed){ toast("Berkas tidak valid. Gunakan cadangan yang diunduh dari GreenDay.","error"); return; }
      showImportPreview(parsed);
    };
    r.onerror=()=>toast("Gagal membaca berkas.","error");
    r.readAsText(f);
  });
}

const ANN_KEY = "greenday.announcements";
let annItems = [];
try {
  const _cached = JSON.parse(localStorage.getItem(ANN_KEY));
  if (Array.isArray(_cached)) annItems = _cached.filter(isObj);
} catch (e) { annItems = []; }

function annCardHTML() {
  const list = annItems.filter(a => a.active !== false)
    .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  if (!list.length) return "";
  return `<section class="card pad ann-card h-sec" style="margin-top:15px">
    <div class="sec-head"><h3>${ic("megaphone",16)} Pengumuman</h3></div>
    ${list.map(a=>{
      const baru = a.date && daysUntil(a.date) >= -3;
      return `<div class="ann-item">
        <div class="ann-t"><span>${esc(a.title)}</span>${baru?`<span class="ann-new">BARU</span>`:""}</div>
        ${a.body?`<p class="ann-b">${esc(a.body)}</p>`:""}
        ${a.date?`<span class="ann-d">${esc(displayDate(a.date))}</span>`:""}
      </div>`;
    }).join("")}
  </section>`;
}
function annNotify(items){
  if(state.settings.notifAnn===false) return;
  const seenKey = STORE_PREFIX + "annSeen";
  let seen = null;
  try{ seen = JSON.parse(localStorage.getItem(seenKey)); }catch(e){ seen = null; }
  if(!Array.isArray(seen)){
    try{ localStorage.setItem(seenKey, JSON.stringify(items.filter(a=>a.active!==false).map(a=>a.id))); }catch(e){}
    return;
  }
  const fresh = items.filter(a=>a.active!==false && !seen.includes(a.id));
  if(!fresh.length) return;
  for(const a of fresh.slice(0,3)){
    const added = NC.add({ type:"ann", title:"Pengumuman baru: "+a.title,
      body: a.body ? snippet(a.body, 120) : "Buka GreenDay untuk membaca pengumuman lengkapnya.",
      icon:"sparkle", page:"home", dedupKey:"ann|"+a.id });
    if(added) seen.push(a.id);
  }
  try{ localStorage.setItem(seenKey, JSON.stringify(seen)); }catch(e){}
}
function annFetch() {
  fetch("pengumuman.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("tidak ada"); return r.json(); })
    .then(obj => {
      if (!isObj(obj) || !Array.isArray(obj.items)) return;
      const items = obj.items.filter(isObj).map(x => ({
        id: (typeof x.id === "string" && x.id) ? x.id : uid(),
        title: String(x.title || "").slice(0, 120),
        body: String(x.body || "").slice(0, 1000),
        date: (typeof x.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x.date)) ? x.date : "",
        active: x.active !== false
      }));
      if (JSON.stringify(items) !== JSON.stringify(annItems)) {
        annItems = items;
        try { localStorage.setItem(ANN_KEY, JSON.stringify(items)); } catch (e) {}
        annNotify(items);
        /* v5.4: render ulang hanya saat di Beranda — dulu renderApp() global
           bisa mencuri fokus ketikan pengguna di halaman lain. */
        if(uiState.page==="home") renderApp();
      }
    })
    .catch(() => { });
}

  <button id="gdInstallX" class="gd-fab-x" type="button" aria-label="Sembunyikan tombol instal">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>
</div>

<script>
/* ===== PWA: registrasi service worker & tombol instal ===== */
(function(){
  var wrap = document.getElementById("gdInstallFab");
  var btn = document.getElementById("gdInstallBtn");
  var closeBtn = document.getElementById("gdInstallX");
  var deferredPrompt = null;

  function pwaStandalone(){
    return (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: minimal-ui)").matches)) || window.navigator.standalone === true;
  }
  function dismissed(){
    /* kunci global (bukan per-profil): kelayakan instal adalah per
       perangkat, jadi penolakan juga berlaku untuk semua profil. */
    try{ return localStorage.getItem("greenday.hideInstallFab") === "1"; }catch(e){ return false; }
  }
  /* Muncul HANYA jika: belum terpasang di layar depan (browser
     memastikan lewat beforeinstallprompt) DAN belum pernah ditutup. */
  function syncFab(){
    if(!wrap) return;
    wrap.hidden = !(deferredPrompt && !pwaStandalone() && !dismissed());
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){
        console.log("Service worker tidak aktif — buka lewat HTTPS agar mode offline siap.");
      });
    });
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPrompt = e;
    syncFab();
  });

  window.addEventListener("appinstalled", function(){
    deferredPrompt = null;
    syncFab();
    try{ PN.registerPeriodic(); }catch(e){}
    try{ toast("GreenDay terpasang! Notifikasi tetap dicek walau aplikasi ditutup.","success"); }catch(e){}
  });

  if (btn) btn.addEventListener("click", function(){
    if (!deferredPrompt) return;
    btn.disabled = true;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){
      deferredPrompt = null;
      btn.disabled = false;
      syncFab();
    }).catch(function(){ btn.disabled = false; });
  });

  if (closeBtn) closeBtn.addEventListener("click", function(){
    try{ localStorage.setItem("greenday.hideInstallFab", "1"); }catch(e){}
    deferredPrompt = null;
    syncFab();
    try{ toast("Tombol instal disembunyikan. Kamu tetap bisa memasangnya dari menu browser kapan saja.","success"); }catch(e){}
  });

  syncFab();
})();
</script>
</body>
</html>
