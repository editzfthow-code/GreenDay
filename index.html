<!DOCTYPE html>
<html lang="id" data-theme="light" data-accent="forest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e6b4e">
<title>GreenDay — Daily List & Personal Productivity</title>
<meta name="description" content="GreenDay: tugas, jurnal, kebiasaan, kalender, catatan, dan target — produktivitas harian yang tenang.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GreenDay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GreenDay — Design Tokens
   ============================================================ */
:root{
  --bg:#f4f6ef; --surface:#fffdf8; --surface-2:#edf0e5; --line:#e0e4d5; --line-strong:#c9d1bd;
  --text:#1e2a22; --muted:#63736a; --faint:#8d9b91;
  --primary:#2e6b4e; --primary-strong:#255840; --primary-soft:#e2efe4; --on-primary:#f2f8f0;
  --hero:#1f4d38; --hero-ink:#eef6ee; --hero-accent:#9fd8b4;
  --amber:#a06a15; --amber-soft:#f6ecd6;
  --red:#ac4630; --red-soft:#f7e2db;
  --teal:#2f6f7a; --teal-soft:#dfeef0;
  --radius:18px;
  --shadow:0 1px 2px rgba(28,42,33,.05), 0 14px 34px -20px rgba(28,42,33,.22);
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#131a15; --surface:#1a231d; --surface-2:#222d26; --line:#2b372f; --line-strong:#3c4a40;
  --text:#e7ede5; --muted:#9db0a2; --faint:#75877b;
  --primary:#5fae83; --primary-strong:#7cc29c; --primary-soft:#20362a; --on-primary:#0f1a13;
  --hero:#1d3b2c; --hero-ink:#e8f2e8; --hero-accent:#8ed3a9;
  --amber:#d7a45a; --amber-soft:#3a2f1a;
  --red:#dd8168; --red-soft:#3d231c;
  --teal:#6fb3bd; --teal-soft:#1c3236;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 16px 36px -20px rgba(0,0,0,.5);
}
[data-accent="sage"]{ --primary:#5d8a78; --primary-strong:#4c7361; --primary-soft:#e4ede8; --hero:#33544a; --hero-accent:#b3dcc9; }
[data-theme="dark"][data-accent="sage"]{ --primary:#8cbcaa; --primary-strong:#a4cdba; --primary-soft:#20342c; --hero:#29473d; --hero-accent:#a8d8c3; }
[data-accent="moss"]{ --primary:#5f7136; --primary-strong:#4c5b2a; --primary-soft:#eaedd9; --hero:#3f4a22; --hero-accent:#d4e197; }
[data-theme="dark"][data-accent="moss"]{ --primary:#a4b56a; --primary-strong:#b6c684; --primary-soft:#2b3220; --hero:#3d4722; --hero-accent:#cddf8e; }

/* ============================================================
   Base
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 "Sora",ui-sans-serif,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:var(--primary-soft)}
h1,h2,h3,h4{font-weight:600}
.ic{flex:none;vertical-align:middle}
main:focus{outline:none}

/* Layout */
.main{min-height:100dvh;padding:16px 16px calc(104px + env(safe-area-inset-bottom));max-width:880px;margin:0 auto}
@media(min-width:920px){
  body{padding-left:240px}
  .main{padding:32px 36px 64px;min-height:100dvh}
  .bottom-nav{display:none!important}
}

/* Sidebar (desktop) */
.sidebar{display:none}
@media(min-width:920px){
  .sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;z-index:40;overflow-y:auto}
}
.sb-brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sb-brand b{font-family:Fraunces,serif;font-size:19px;display:block;line-height:1.15}
.sb-sub{display:block;font-size:11px;color:var(--muted)}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:none;border-radius:12px;font:600 14px Sora,sans-serif;color:var(--muted);transition:background .15s,color .15s;text-align:left}
.sb-item:hover{background:var(--surface-2);color:var(--text)}
.sb-item.active{background:var(--primary-soft);color:var(--primary)}
.sb-label{font:700 10.5px Sora,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin:14px 8px 4px}
.sb-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.5}

/* Bottom navigation (mobile) */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bn-item{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;background:none;color:var(--muted);font:600 10.5px Sora,sans-serif;border-radius:12px}
.bn-item .bn-ic{width:38px;height:26px;border-radius:99px;display:grid;place-items:center;transition:background .18s}
.bn-item.active{color:var(--primary)}
.bn-item.active .bn-ic{background:var(--primary-soft)}

/* Topbar & judul halaman */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand-bar{justify-content:space-between}
.pg-title-wrap{flex:1;min-width:0}
.pg-title{font-family:Fraunces,serif;font-size:29px;letter-spacing:-.4px;line-height:1.1}
.pg-sub{color:var(--muted);font-size:13px;margin-top:4px}
.pg-acts{display:flex;gap:8px;align-items:center;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:600;font-size:18px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.logo.lg{width:56px;height:56px;border-radius:18px}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:13px;padding:11px 17px;font:600 14px Sora,sans-serif;transition:transform .15s,background .15s,box-shadow .15s;min-height:44px}
.btn:active{transform:scale(.965)}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 16px -8px var(--primary)}
.btn-primary:hover{background:var(--primary-strong)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-ghost:hover{background:var(--line)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:8px 13px;min-height:38px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:inline-grid;place-items:center;transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--line-strong)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.link{border:0;background:none;color:var(--primary);font:600 13px Sora,sans-serif;padding:4px 6px;border-radius:8px}
.link:hover{background:var(--primary-soft)}
.spacer{flex:1}

/* Kartu & seksi */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.sec-t{font-family:Fraunces,serif;font-size:17px;margin-bottom:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-head h3{font-family:Fraunces,serif;font-size:16.5px}
.pad-t{margin:22px 0 10px}
.mini-pct{font:700 12.5px Sora,sans-serif;color:var(--primary)}
.mut{color:var(--muted);font-size:13.5px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.6;background:var(--surface-2);border-radius:12px;padding:12px 14px}

/* Formulir */
.lbl{display:block;font:600 12.5px Sora,sans-serif;color:var(--muted);margin:0 0 6px 2px}
.lbl .opt{font-weight:500;color:var(--faint)}
.field{margin-bottom:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:380px){.row2{grid-template-columns:1fr}}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font:500 16px Sora,sans-serif;color:var(--text);transition:border-color .15s;min-height:46px}
textarea.inp{resize:vertical;line-height:1.55}
.inp:focus{outline:none;border-color:var(--primary)}
.inp::placeholder{color:var(--faint)}
.form-err{color:var(--red);font:600 12.5px Sora,sans-serif;min-height:17px;margin:2px 0 4px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg.fixed{width:190px;flex:none}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font:600 13px Sora,sans-serif;color:var(--muted);transition:.15s}
.seg button.sel{background:var(--surface);color:var(--primary);box-shadow:0 1px 4px rgba(28,42,33,.12)}
.chips-pick{display:flex;flex-wrap:wrap;gap:7px}
.chips-pick .chip.sel{outline:2px solid var(--primary);outline-offset:1px}
.search-bar{position:relative;flex:1;min-width:0}
.search-bar .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search-bar .inp{padding-left:38px}
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.sel-inp{width:150px;flex:none;appearance:auto}
.tog{width:48px;height:28px;border-radius:99px;border:0;background:var(--line-strong);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog.on{background:var(--primary)}
.tog.on::after{transform:translateX(20px)}

/* Chip & kategori */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:99px;font:600 12px Sora,sans-serif}
.chip.xs,.chip-xs{padding:2.5px 9px;font-size:11px}
.cat-pribadi{background:var(--primary-soft);color:var(--primary)}
.cat-sekolah{background:var(--teal-soft);color:var(--teal)}
.cat-pekerjaan{background:var(--amber-soft);color:var(--amber)}
.cat-kesehatan{background:var(--red-soft);color:var(--red)}
.cat-belajar{background:#e7e4f2;color:#5d5680}
[data-theme="dark"] .cat-belajar{background:#2a2637;color:#b1a8d6}
.cat-lainnya{background:var(--surface-2);color:var(--muted)}
.badge-late{background:var(--red-soft);color:var(--red);padding:2px 8px;border-radius:99px;font:700 11px Sora,sans-serif}
.badge-today{background:var(--primary-soft);color:var(--primary);padding:3px 10px;border-radius:99px;font:700 11.5px Sora,sans-serif}

/* Tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:99px;font:600 13px Sora,sans-serif;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.tab.active{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tab-n{background:var(--surface-2);border-radius:99px;padding:1px 7px;font-size:11px}
.tab.active .tab-n{background:rgba(255,255,255,.25);color:inherit}

/* Tugas */
.task-list{display:flex;flex-direction:column;gap:10px}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .15s}
.task:hover{border-color:var(--line-strong)}
.checkbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-strong);background:var(--surface);color:transparent;display:grid;place-items:center;flex:none;transition:.18s;margin-top:1px}
.checkbox:hover{border-color:var(--primary)}
.task.done .checkbox{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.task-main{flex:1;min-width:0}
.task-title{font-weight:600;cursor:pointer;overflow-wrap:break-word}
.task.done .task-title{color:var(--muted);text-decoration:line-through}
.task-desc{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
.task-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px}
.meta-it{display:inline-flex;align-items:center;gap:5px;font:600 12px Sora,sans-serif;color:var(--muted)}
.p-dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.p-rendah{background:#7fa48a}.p-sedang{background:#cf9b43}.p-tinggi{background:#c2634a}
.task-acts{display:flex;gap:4px;flex:none}
.just-done .checkbox{animation:pop .4s var(--ease)}

/* Hero (Beranda) */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:22px 22px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero .deco{position:absolute;right:-34px;bottom:-44px;color:#fff;opacity:.09;pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative}
.hero-greet{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font:600 14px Sora,sans-serif;opacity:.9}
.hero-date{font:500 12.5px Sora,sans-serif;opacity:.7;margin-top:3px}
.hero-clock{display:flex;align-items:baseline;gap:7px;font-family:Fraunces,serif;font-weight:600;font-size:clamp(44px,13vw,58px);letter-spacing:-1.5px;line-height:1.15;margin:10px 0 4px;position:relative}
.hero-sec{font-size:19px;opacity:.6;letter-spacing:0}
.hero-stats{display:flex;border-top:1px solid rgba(255,255,255,.16);margin-top:12px;padding-top:13px;position:relative}
.hero-stats>div{flex:1}
.hero-stats>div+div{border-left:1px solid rgba(255,255,255,.16);padding-left:14px}
.hero-stats b{font-family:Fraunces,serif;font-size:23px;font-weight:600;display:block;line-height:1.1}
.hero-stats span{font:500 11.5px Sora,sans-serif;opacity:.75}
.ring-wrap{flex:none}
.ring-num{font:700 17px Sora,sans-serif;fill:var(--hero-ink)}
.ring-lab{font:600 10px Sora,sans-serif;fill:var(--hero-ink);opacity:.7}
.ring-fg{transition:stroke-dashoffset 1s var(--ease)}

/* Beranda: aksi cepat & grid */
.quick-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:16px 0 14px}
.home-grid{display:flex;flex-direction:column;gap:14px}
@media(min-width:780px){.home-grid{display:grid;grid-template-columns:1.45fr 1fr;align-items:start}}
.home-col{display:flex;flex-direction:column;gap:14px}
.h-sec .task-list{margin-top:4px}
.habit-mini .hm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.habit-mini .hm:last-child{border-bottom:0}
.hm-name{display:flex;align-items:center;gap:8px;font:600 13.5px Sora,sans-serif;min-width:0;overflow-wrap:break-word}
.h-check{width:44px;height:44px;border-radius:99px;border:2px solid var(--line-strong);background:var(--surface);color:var(--muted);display:inline-grid;place-items:center;transition:.18s;flex:none}
.h-check:hover{border-color:var(--primary);color:var(--primary)}
.h-check.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.h-check.sm{width:32px;height:32px}
.just-check{animation:pop .4s var(--ease)}
.jr-preview{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:2px 0}
.jp-mood{width:42px;height:42px;border-radius:13px;background:var(--surface-2);color:var(--primary);display:grid;place-items:center;flex:none}
.jp-tx{flex:1;min-width:0}
.jp-tx b{display:block;font-size:14px}
.jp-tx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:12.5px}
.motd{display:flex;align-items:center;gap:12px;padding:16px 18px;margin-top:14px;color:var(--primary)}
.motd p{flex:1;font:italic 500 15px Fraunces,serif;line-height:1.45;transition:opacity .25s,transform .25s;min-width:0}
#motd.swap{opacity:0;transform:translateY(4px)}

/* Empty state */
.empty{text-align:center;padding:44px 22px;color:var(--muted)}
.empty.sm{padding:22px 12px}
.e-ic{width:56px;height:56px;border-radius:18px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 14px}
.empty.sm .e-ic{width:42px;height:42px;border-radius:14px;margin-bottom:10px}
.e-t{display:block;font:600 15px Sora,sans-serif;color:var(--text);margin-bottom:5px}
.e-d{font-size:13px;line-height:1.55;max-width:320px;margin:0 auto}
.e-act{margin-top:16px}

/* Progress & chart */
.pbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .7s var(--ease)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart-val{font:700 12px Sora,sans-serif;min-height:15px}
.chart-bar{width:100%;max-width:36px;height:0;background:var(--primary);border-radius:7px 7px 3px 3px;transition:height .7s var(--ease)}
.chart-bar.zero{background:var(--line)}
.chart-lab{font:600 11px Sora,sans-serif;color:var(--muted)}

/* Kalender */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-title{font-family:Fraunces,serif;font-size:18px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.cal-week span{text-align:center;font:700 10.5px Sora,sans-serif;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);padding:5px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{border:0;background:none;border-radius:12px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 14px Sora,sans-serif;color:var(--text);transition:background .15s;padding:2px}
.cal-cell:not(.blank):hover{background:var(--surface-2)}
.cal-cell.blank{pointer-events:none}
.cal-cell.is-sel{background:var(--primary-soft)}
.cal-cell .dnum{border-radius:8px;padding:1px 7px;line-height:1.3}
.cal-cell.is-today .dnum{background:var(--primary);color:var(--on-primary);font-weight:700}
.cal-grid.mini .cal-cell{min-height:40px;font-size:13px}
.dots{display:flex;gap:3px;height:4px}
.dot{width:4px;height:4px;border-radius:99px}
.d-task{background:var(--primary)}.d-ev{background:#c08b2d}.d-jr{background:var(--teal)}
.day-panel{margin-top:14px}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.day-head h3{font-family:Fraunces,serif;font-size:18px}
.day-sec-t{font:700 11.5px Sora,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin:16px 0 9px}
.ev{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.ev-bar{width:4px;height:36px;border-radius:99px;background:var(--amber);flex:none}
.ev-main{flex:1;min-width:0}
.ev-title{font-weight:600;font-size:14px;overflow-wrap:break-word}
.ev-meta{display:flex;gap:8px;font:600 12px Sora,sans-serif;color:var(--muted);margin-top:2px}
.ev-note{color:var(--muted);font-size:12.5px;margin-top:3px;overflow-wrap:break-word}
.day-jr{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--teal-soft);background:var(--teal-soft);border-radius:14px;color:var(--teal);font-weight:600;font-size:13.5px;width:100%;text-align:left}

/* Jurnal */
.jcal{margin-bottom:14px}
.j-item{display:flex;align-items:center;gap:14px;padding:13px 15px;width:100%;text-align:left;margin-bottom:10px}
.j-date{width:46px;flex:none;text-align:center;color:var(--muted)}
.j-date b{font-family:Fraunces,serif;font-size:21px;display:block;color:var(--text);line-height:1.1}
.j-date span{font:700 10.5px Sora,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.j-body{flex:1;min-width:0}
.j-top{display:flex;align-items:center;gap:8px;color:var(--primary)}
.j-top b{font-size:14.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.j-sn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:12.5px;margin-top:3px}
.j-item .chev{color:var(--faint)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font:600 10.5px Sora,sans-serif;color:var(--muted);transition:.15s}
.mood:hover{border-color:var(--line-strong)}
.mood.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

/* Kebiasaan */
.hsum-tx{font-size:13.5px;color:var(--muted);margin-bottom:9px}
.hsum-tx b{font-family:Fraunces,serif;font-size:17px;color:var(--text)}
.habit-list{display:flex;flex-direction:column;gap:12px}
.habit-head{display:flex;align-items:center;gap:12px}
.h-ic{width:42px;height:42px;border-radius:13px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none;transition:.18s}
.h-ic.on{background:var(--primary);color:var(--on-primary)}
.h-name{flex:1;min-width:0}
.h-name b{font-size:15px;display:block;overflow-wrap:break-word}
.h-sub{display:flex;align-items:center;gap:5px;font:600 12px Sora,sans-serif;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.flame{color:var(--amber);display:inline-flex}
.heat{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin-top:13px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);min-width:0}
.heat i.on{background:var(--primary)}
.heat i.t{box-shadow:inset 0 0 0 1.5px var(--primary)}
.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ip{padding:11px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);display:grid;place-items:center;transition:.15s}
.ip.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

/* Catatan */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.note{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:132px;border:1px solid rgba(30,42,34,.06);box-shadow:var(--shadow);transition:transform .15s}
.note:hover{transform:translateY(-2px)}
.note-c-sage{--nc:#e9f0e3}.note-c-sand{--nc:#f7efdc}.note-c-sky{--nc:#e5eef4}.note-c-rose{--nc:#f8e9e4}.note-c-lilac{--nc:#eee9f6}
[data-theme="dark"] .note-c-sage{--nc:#25302a}[data-theme="dark"] .note-c-sand{--nc:#302c21}
[data-theme="dark"] .note-c-sky{--nc:#1f2e34}[data-theme="dark"] .note-c-rose{--nc:#37251f}[data-theme="dark"] .note-c-lilac{--nc:#282338}
.note{background:var(--nc)}
.note.pinned{outline:2px solid var(--primary);outline-offset:2px}
.note-body{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font-family:inherit;color:var(--text)}
.note-title{font-weight:600;font-size:14.5px;overflow-wrap:break-word}
.note-snippet{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--muted);margin-top:5px;overflow-wrap:break-word}
.note-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.note-date{font:600 11px Sora,sans-serif;color:var(--faint)}
.note-foot>span:last-child{display:flex;gap:2px}
.pin-btn{border:0;background:none;color:var(--faint);width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center}
.pin-btn:hover{background:rgba(30,42,34,.07)}
.pin-btn.on{color:var(--primary)}
.color-pick{display:flex;gap:9px}
.cp{width:32px;height:32px;border-radius:99px;border:0;transition:.15s}
.cp.sel{outline:2.5px solid var(--primary);outline-offset:2px}
.cp[data-c="sage"]{background:#e9f0e3}.cp[data-c="sand"]{background:#f7efdc}.cp[data-c="sky"]{background:#e5eef4}.cp[data-c="rose"]{background:#f8e9e4}.cp[data-c="lilac"]{background:#eee9f6}
.save-ind{font:600 11.5px Sora,sans-serif;color:var(--faint);transition:color .2s}
.save-ind.flash{color:var(--primary)}

/* Target */
.goal-list{display:flex;flex-direction:column;gap:12px}
.goal{padding:16px}
.g-head{display:flex;align-items:flex-start;gap:10px}
.g-title{flex:1;min-width:0}
.g-title b{font-size:16px;overflow-wrap:break-word}
.g-desc{color:var(--muted);font-size:13px;margin-top:4px;overflow-wrap:break-word}
.g-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px}
.g-steps{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.step{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:var(--surface-2);border-radius:11px;width:100%;text-align:left;font:500 13.5px Sora,sans-serif;color:var(--text)}
.step .cb{width:19px;height:19px;border-radius:6px;border:2px solid var(--line-strong);color:transparent;display:grid;place-items:center;flex:none;background:var(--surface)}
.step.done .cb{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.step.done span{text-decoration:line-through;color:var(--muted)}
.step span{min-width:0;overflow-wrap:break-word}
.g-prog{margin-top:13px}
.g-prog .gp-t{display:flex;justify-content:space-between;font:600 12.5px Sora,sans-serif;color:var(--muted);margin-bottom:7px}
.step-row{display:flex;gap:8px;margin-bottom:8px}
.step-row .inp{flex:1}
.step-rm{flex:none}

/* Statistik */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:780px){.stat-grid{grid-template-columns:repeat(4,1fr)}.stats-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
.stats-2col{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.stat{display:flex;gap:12px;align-items:center;padding:14px}
.st-ic{width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.st-num{font-family:Fraunces,serif;font-size:24px;display:block;line-height:1.15}
.st-lab{font:600 11.5px Sora,sans-serif;color:var(--muted)}
.gpr-row{margin-bottom:14px}
.gpr-row:last-child{margin-bottom:2px}
.gpr-t{display:flex;justify-content:space-between;gap:10px;font:600 13.5px Sora,sans-serif;margin-bottom:7px}
.gpr-t b{min-width:0;overflow-wrap:break-word}
.gpr-t span{color:var(--primary);flex:none}

/* Profil */
.profile-card .pr-top{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.pr-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;flex:none}
.pr-avatar{position:relative;width:86px;height:86px;border:0;background:none;padding:0;cursor:pointer}
.pr-avatar .ph{width:86px;height:86px;border-radius:26px;background:var(--primary-soft);display:grid;place-items:center;font-size:38px;overflow:hidden}
.pr-avatar .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pr-avatar .cam{position:absolute;right:-3px;bottom:-3px;width:30px;height:30px;border-radius:99px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;border:2.5px solid var(--surface);transition:transform .15s}
.pr-avatar:active .cam{transform:scale(.9)}
.pr-avatar-hint{font:600 11px Sora,sans-serif;color:var(--faint);max-width:110px;text-align:center;line-height:1.4}
.pr-photo-del{font-size:11.5px;padding:2px 6px}
.pr-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:Fraunces,serif;font-size:22px}
.pr-bio{color:var(--muted);font-size:13.5px;margin-top:3px}
.pr-since{display:inline-flex;align-items:center;gap:6px;color:var(--faint);font:600 12px Sora,sans-serif;margin-top:7px}
.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.av{font-size:23px;padding:9px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);transition:.15s}
.av.sel{border-color:var(--primary);background:var(--primary-soft)}
.link-list{padding:6px 8px}
.link-it{display:flex;align-items:center;gap:13px;width:100%;padding:12px 10px;border:0;background:none;border-radius:13px;text-align:left;transition:.15s}
.link-it:hover{background:var(--surface-2)}
.li-ic{width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.li-tx{flex:1;min-width:0}
.li-tx b{display:block;font-size:14.5px}
.li-tx span{font-size:12.5px;color:var(--muted)}
.link-it .chev{color:var(--faint)}
.vrf{flex:none;display:inline-block;vertical-align:-4px}

/* Pengaturan */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row.last{border-bottom:0}
.set-row>div:first-child b{display:block;font-size:14.5px}
.set-row>div:first-child span{display:block;font-size:12.5px;color:var(--muted)}
.swatches{display:flex;gap:10px}
.swatch{width:30px;height:30px;border-radius:99px;border:0;transition:.15s}
.swatch.sel{outline:2.5px solid var(--text);outline-offset:2px}
.swatch[data-val="forest"]{background:#2e6b4e}
.swatch[data-val="sage"]{background:#5d8a78}
.swatch[data-val="moss"]{background:#5f7136}
.fmt-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:420px){.fmt-opts{grid-template-columns:1fr}}
.fmt{padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;transition:.15s}
.fmt b{display:block;font-size:13px}
.fmt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.fmt.sel{border-color:var(--primary);background:var(--primary-soft)}
.fmt.sel b{color:var(--primary)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.danger-zone{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.danger-zone h4{color:var(--red);font-size:13.5px;margin-bottom:10px}

/* Modal */
.m-ov{position:fixed;inset:0;z-index:200;background:rgba(13,22,16,.48);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
@media(min-width:640px){.m-ov{align-items:center;padding:24px}}
.m-ov.show{opacity:1}
.modal{width:100%;max-width:540px;max-height:calc(100dvh - 20px);display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(30px);transition:transform .24s var(--ease);box-shadow:0 -12px 48px rgba(10,20,14,.3)}
@media(min-width:640px){.modal{border-radius:22px;transform:translateY(14px) scale(.98);max-height:calc(100dvh - 48px)}}
.m-ov.show .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.modal-head h3{font-family:Fraunces,serif;font-size:19px;min-width:0;overflow-wrap:break-word}
.modal-head .mh-side{display:flex;gap:6px;align-items:center;flex:none}
.modal-body{padding:8px 18px 16px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;align-items:center;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
@media(min-width:640px){.modal-foot{border-radius:0 0 22px 22px}}
.confirm-msg{color:var(--muted);font-size:14px;line-height:1.6}
.onb{padding:26px 22px 22px;text-align:center}
.onb h3{font-family:Fraunces,serif;font-size:23px;margin:16px 0 8px}
.onb .mut{margin-bottom:20px}
.onb .field{text-align:left}
.onb .btn{margin-top:8px}

/* Toast */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:400;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100vw - 28px));pointer-events:none}
@media(min-width:920px){.toast-wrap{bottom:26px}}
.toast{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:0 12px 34px -10px rgba(10,20,14,.35);pointer-events:auto;animation:tIn .3s var(--ease)}
.toast.out{animation:tOut .22s forwards}
.t-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.t-success .t-ic{background:var(--primary-soft);color:var(--primary)}
.t-error .t-ic{background:var(--red-soft);color:var(--red)}
.t-info .t-ic{background:var(--surface-2);color:var(--muted)}
.t-msg{flex:1;font:600 13px Sora,sans-serif;min-width:0}
.t-act{border:0;background:none;color:var(--primary);font:700 13px Sora,sans-serif;padding:6px 8px;border-radius:8px;flex:none}
.t-act:hover{background:var(--primary-soft)}

/* Tombol instal PWA */
.gd-fab{position:fixed;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:80;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:12px 18px;background:var(--primary);color:var(--on-primary);font:600 13.5px Sora,sans-serif;box-shadow:0 12px 28px -10px rgba(20,40,28,.5);transition:transform .15s}
.gd-fab:active{transform:scale(.96)}
.gd-fab[hidden]{display:none}
@media(min-width:920px){.gd-fab{bottom:24px}}

/* Transisi halaman & animasi */
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-enter{animation:pgIn .32s var(--ease)}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes tIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateY(10px)}}
.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ===== Pengumuman (konten dari admin, tanpa ubah kode) ===== */
.ann-card{margin-top:14px}
.ann-card .sec-head h3{display:flex;align-items:center;gap:8px}
.ann-item{padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:9px}
.ann-item:last-child{margin-bottom:0}
.ann-t{font-weight:600;font-size:14.5px;overflow-wrap:break-word;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ann-new{background:var(--primary-soft);color:var(--primary);padding:2px 8px;border-radius:99px;font:700 10px Sora,sans-serif;letter-spacing:.4px}
.ann-b{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.55;white-space:pre-line;overflow-wrap:break-word}
.ann-d{display:inline-block;margin-top:7px;font:600 11.5px Sora,sans-serif;color:var(--faint)}

/* ===== Beranda v3: pesan kontekstual + aksi cepat baru ===== */
.hero-msg{font:500 13px Sora,sans-serif;opacity:.82;margin-top:6px;position:relative;max-width:34ch}
.quick-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 14px}
@media(min-width:780px){.quick-acts{grid-template-columns:repeat(6,1fr)}}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px 6px 11px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font:600 12px Sora,sans-serif;color:var(--text);transition:transform .15s,border-color .15s;box-shadow:var(--shadow);min-height:86px}
.qa:hover{border-color:var(--primary)}
.qa:active{transform:scale(.95)}
.qa .qa-ic{width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.qa.primary .qa-ic{background:var(--primary);color:var(--on-primary)}

/* Linimasa hari ini */
.tl{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.tl-it{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:13px}
.tl-it.past{opacity:.55}
.tl-time{font:700 13px Sora,sans-serif;color:var(--primary);flex:none;min-width:44px;text-align:center;background:var(--primary-soft);border-radius:9px;padding:4px 6px}
.tl-it.past .tl-time{color:var(--red);background:var(--red-soft)}
.tl-main{flex:1;min-width:0;font:600 13.5px Sora,sans-serif;overflow-wrap:break-word}
.tl-tag{flex:none;font:700 10px Sora,sans-serif;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);padding:2px 8px;border-radius:99px;background:var(--surface-2)}

/* Streak (Beranda & Statistik) */
.stk-row{display:flex;align-items:center;gap:13px}
.stk-flame{width:46px;height:46px;border-radius:14px;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;flex:none}
.stk-tx b{font-family:Fraunces,serif;font-size:21px;display:block;line-height:1.1}
.stk-tx span{font:600 12px Sora,sans-serif;color:var(--muted)}
.stk-dots{display:flex;gap:5px;margin-top:11px;align-items:center}
.stk-dots i{width:100%;max-width:26px;aspect-ratio:1;border-radius:8px;background:var(--surface-2)}
.stk-dots i.on{background:var(--primary)}
.stk-dots span{font:700 10.5px Sora,sans-serif;color:var(--faint);margin:0 3px;min-width:14px;text-align:center}

/* Lencana pencapaian */
.bdg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:780px){.bdg-grid{grid-template-columns:repeat(3,1fr)}}
.bdg{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1px solid var(--line);border-radius:15px;background:var(--surface);transition:.15s}
.bdg .bd-ic{width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.bdg b{display:block;font-size:13.5px}
.bdg span{display:block;font:500 11.5px Sora,sans-serif;color:var(--muted);margin-top:2px;line-height:1.4}
.bdg.locked{opacity:.45}
.bdg.locked .bd-ic{background:var(--surface-2);color:var(--faint)}
.bdg.unlocked{border-color:var(--primary)}

/* Modal timer fokus */
.focus-body{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:10px}
.fc-task{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:7px 14px;font:600 12.5px Sora,sans-serif}
.fc-task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
.fc-ring-wrap{position:relative;width:190px;height:190px}
.fc-ring-wrap svg{transform:rotate(-90deg)}
.fc-ring-bg{stroke:var(--surface-2)}
.fc-ring-fg{stroke:var(--primary);transition:stroke-dashoffset .5s linear}
.fc-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:600;font-size:44px;letter-spacing:-1px}
.fc-state{font:600 12px Sora,sans-serif;color:var(--muted)}
.du-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.du-chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 15px;font:600 13px Sora,sans-serif;color:var(--muted);transition:.15s}
.du-chips button.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.du-chips button:disabled{opacity:.4;cursor:not-allowed}

/* Chip fokus melayang (saat modal ditutup) */
.focus-chip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:90;display:inline-flex;align-items:center;gap:9px;border:0;border-radius:99px;padding:10px 18px;background:var(--primary);color:var(--on-primary);font:700 13px Sora,sans-serif;box-shadow:0 12px 28px -10px rgba(20,40,28,.5);animation:tIn .3s var(--ease)}
.focus-chip:active{transform:translateX(-50%) scale(.96)}
.focus-chip[hidden]{display:none}
@media(min-width:920px){.focus-chip{bottom:24px}}

/* Promosi notifikasi di Beranda */
.notif-promo{display:flex;align-items:center;gap:12px;margin-top:14px;border-color:var(--primary)}

   GreenDay — Daily List & Personal Productivity (versi final utuh)
   ----------------------------------------------------------------
   CATATAN PENYIMPANAN:
   Semua data pengguna disimpan di LocalStorage BROWSER INI saja.
   Artinya: data TIDAK otomatis tersinkronisasi ke perangkat lain,
   dan siapa pun yang membuka browser & profil yang sama di
   perangkat ini dapat melihat data tersebut. Gunakan fitur
   Ekspor Cadangan (Pengaturan) untuk memindahkan data antar
   perangkat secara manual.

const APP_TITLE_BASE = "GreenDay — Daily List & Personal Productivity";

/* ---------------- Pengguna bersama (multi-profil, satu perangkat) ----------------
   Registri pengguna & pengguna aktif disimpan di kunci GLOBAL:
     greenday.users       : [{id, createdAt}]
     greenday.activeUser  : "<id>"
   Data tiap pengguna tersimpan di kunci "greenday.<id>.<key>" sehingga
   tugas/jurnal/kebiasaan tiap orang terpisah rapi. Pengumuman tetap
   dibagikan untuk semua (greenday.announcements). */
const LS = {
  get(k, d=null){ try{ const v=JSON.parse(localStorage.getItem("greenday."+k)); return (v===null||v===undefined)?d:v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("greenday."+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("greenday."+k); }catch(e){} }
};
let STORE_PREFIX = "greenday."; /* dihitung dari pengguna aktif saat init/ganti pengguna */

function userRegistry(){
  const u = LS.get("users", []);
  return Array.isArray(u) ? u.filter(x=>isObj(x) && x.id) : [];
}
function currentUser(){ return LS.get("activeUser", null); }
function setActivePrefix(){
  STORE_PREFIX = `greenday.${currentUser()}.`;
}
/* Pindahkan data versi lama (tunggal-pengguna) ke profil pertama */
function migrateLegacy(){
  if(userRegistry().length) return;
  const firstId = uid();
  if(localStorage.getItem("greenday.profile") !== null){
    Object.keys(DEFAULTS).forEach(k=>{
      const v = localStorage.getItem("greenday."+k);
      if(v !== null){
        localStorage.setItem(`greenday.${firstId}.${k}`, v);
        localStorage.removeItem("greenday."+k);
      }
    });
  }
  LS.set("users", [{id:firstId, createdAt:new Date().toISOString()}]);
  LS.set("activeUser", firstId);
}
function userProfileOf(id){
  try{ const v=JSON.parse(localStorage.getItem(`greenday.${id}.profile`)); return isObj(v)?v:null; }catch(e){ return null; }
}
function switchUser(id){
  if(!userRegistry().some(u=>u.id===id)) return;
  LS.set("activeUser", id);
  setActivePrefix();
  loadAll(); applySettings(); renderApp(); showOnboarding(); focusChipUpdate();
  const p = state.profile;
  toast(`Berhasil berganti ke profil ${(p && p.name) || "pengguna baru"}.`, "success");
}
function addUser(name, avatar){
  const id = uid();
  const reg = userRegistry();
  reg.push({id, createdAt:new Date().toISOString()});
  LS.set("users", reg);
  LS.set("activeUser", id);
  setActivePrefix();
  state.profile = { ...DEFAULTS.profile, name:name||"", avatar:avatar||"🌱", createdAt:new Date().toISOString() };
  persist("profile");
  loadAll(); applySettings(); renderApp(); showOnboarding(); focusChipUpdate();
  toast("Profil baru dibuat. Selamat datang!","success");
}
function removeUser(id){
  let reg = userRegistry();
  if(reg.length <= 1){ toast("Minimal satu profil harus tetap ada.","error"); return; }
  reg = reg.filter(u=>u.id!==id);
  LS.set("users", reg);
  /* hapus seluruh data milik pengguna itu */
  const kill = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(`greenday.${id}.`)) kill.push(k);
  }
  kill.forEach(k=>localStorage.removeItem(k));
  if(currentUser()===id) switchUser(reg[0].id);
}

/* Lencana centang hijau dengan tepi gerigi (gaya "terverifikasi").
   Gerigi digambar lewat perhitungan titik sehingga bentuknya selalu rapi
   di semua ukuran, di mode terang maupun gelap. */
function verifiedBadge(size=18, light=false){
  const teeth=12, rO=11, rI=9.1, pts=[];
  for(let i=0;i<teeth*2;i++){
    const r=(i%2===0)?rO:rI;
    const a=(Math.PI*2/(teeth*2))*i-Math.PI/2;
    pts.push((12+r*Math.cos(a)).toFixed(2)+","+(12+r*Math.sin(a)).toFixed(2));
  }
  const fill=light?"var(--hero-accent)":"var(--primary)";
  const tick=light?"var(--hero)":"#fff";
  return `<svg class="vrf" width="${size}" height="${size}" viewBox="0 0 24 24" role="img" aria-label="Nama terverifikasi"><path d="M${pts.join("L")}Z" fill="${fill}" stroke="${fill}" stroke-width="1.6" stroke-linejoin="round"/><path d="m7.5 12.4 3 3 6-6.6" fill="none" stroke="${tick}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* Unggah foto: dipangkas persegi tepat di tengah + dikompres ke JPEG 256px
   agar hemat ruang LocalStorage (kuotanya terbatas). */
function processImageFile(file){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type.startsWith("image/")){
      reject(new Error("Berkas yang dipilih bukan gambar.")); return;
    }
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const S=256;
        const c=document.createElement("canvas");
        c.width=S; c.height=S;
        const ctx=c.getContext("2d");
        const side=Math.max(1,Math.min(img.naturalWidth,img.naturalHeight));
        const sx=(img.naturalWidth-side)/2, sy=(img.naturalHeight-side)/2;
        ctx.drawImage(img,sx,sy,side,side,0,0,S,S);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg",0.85));
      }catch(err){
        URL.revokeObjectURL(url);
        reject(new Error("Gagal memproses gambar."));
      }
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("Gagal membaca gambar. Coba berkas lain."));
    };
    img.src=url;
  });
}

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
}
/* Escape semua data user sebelum masuk ke HTML (cegah XSS) */
function esc(s){
  return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const isoDate = (d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parseISO(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); }
const fmtTime = t=>String(t||"").replace(":", ".");
function snippet(s,n=90){ s=String(s||"").trim(); return s.length>n ? s.slice(0,n).trim()+"…" : s; }
function greeting(){
  const h=new Date().getHours();
  if(h>=4 && h<11) return "Selamat pagi";
  if(h>=11 && h<15) return "Selamat siang";
  if(h>=15 && h<18) return "Selamat sore";
  return "Selamat malam";
}

  if(!iso) return "Tanpa tanggal";
  const d=parseISO(iso), s=state.settings.dateFormat;
  if(s==="sedang") return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  if(s==="angka")  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function shortDate(iso){
  if(!iso) return "";
  const d=parseISO(iso), y=d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"";
  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}${y}`;
}
function daysUntil(iso){
  return Math.round((parseISO(iso).getTime()-parseISO(isoDate()).getTime())/864e5);
}
function lastNDates(n){
  const out=[]; const d=new Date();
  for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); out.push(isoDate(x)); }
  return out;
}

function toast(msg, type="success", action=null){
  const wrap=el("toastWrap");
  const t=document.createElement("div");
  const icName = type==="success"?"check":type==="error"?"alert":"info";
  t.className="toast t-"+type;
  t.innerHTML=`<span class="t-ic">${ic(icName,15)}</span><span class="t-msg">${esc(msg)}</span>${action?`<button class="t-act">${esc(action.label)}</button>`:""}`;
  wrap.appendChild(t);
  while(wrap.children.length>3) wrap.firstChild.remove();
  const kill=()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),220); };
  const to=setTimeout(kill, action?5200:3200);
  if(action) t.querySelector(".t-act").addEventListener("click",()=>{ clearTimeout(to); action.fn(); kill(); });
}

/* ================= MESIN NOTIFIKASI =================
   - Tugas terlewat: dipanggil tiap 30 detik & saat tab aktif kembali.
     Hanya memberitahu sekali per kombinasi tugas+tanggal+jam (kalau
     jadwal diubah, akan memberitahu ulang pada jam baru).
   - Pengingat harian: ringkasan tugas & agenda pada jam pilihan.
   - Pengumuman baru: dipicu dari annFetch() saat daftar berubah. */
const Notif = {
  supported(){ return "Notification" in window; },
  granted(){ return this.supported() && Notification.permission==="granted"; },
  enabled(){ return state.settings.notifications!==false && this.granted(); },
  async request(){
    if(!this.supported()){ toast("Browser ini tidak mendukung notifikasi.","error"); return false; }
    if(Notification.permission==="granted") return true;
    const p = await Notification.requestPermission();
    if(p==="granted"){ toast("Notifikasi GreenDay diaktifkan.","success"); return true; }
    toast("Izin notifikasi ditolak — aktifkan dari pengaturan browser.","error");
    return false;
  },
  send(title, body, tag){
    if(!this.enabled()) return;
    try{
      const n = new Notification(title, { body, tag, icon:"icon-192.png", badge:"icon-192.png" });
      n.onclick = ()=>{ window.focus(); try{ n.close(); }catch(e){} };
    }catch(e){}
  },
  _notifiedKey(){ return STORE_PREFIX+"notif.tasks"; },
  _loadNotified(){ try{ const v=JSON.parse(localStorage.getItem(this._notifiedKey())); return isObj(v)?v:{}; }catch(e){ return {}; } },
  _saveNotified(o){ try{ localStorage.setItem(this._notifiedKey(), JSON.stringify(o)); }catch(e){} },
  checkTasks(){
    if(!state.settings.notifTask || !this.enabled()) return;
    const now = new Date(), today = isoDate(now);
    const seen = this._loadNotified(); let dirty = false;
    state.tasks.forEach(t=>{
      if(t.done || !t.date || !t.time) return;
      if(t.date > today) return;
      const due = parseISO(t.date);
      due.setHours(parseInt(String(t.time).slice(0,2),10)||0, parseInt(String(t.time).slice(3,5),10)||0, 0, 0);
      const overdueMin = Math.round((now.getTime()-due.getTime())/60000);
      if(overdueMin < 0 || overdueMin > 720) return; /* belum jatuh tempo / sudah > 12 jam */
      const key = t.id+"|"+t.date+"|"+t.time;
      if(seen[key]) return;
      seen[key] = Date.now(); dirty = true;
      const kapan = t.date===today ? `dijadwalkan pukul ${fmtTime(t.time)}` : `sejak ${shortDate(t.date)}`;
      this.send("⏰ Tugas terlewat: "+t.title, `Tugas ini ${kapan} dan belum selesai. Ketuk untuk membuka GreenDay.`, "task-"+t.id);
    });
    if(dirty) this._saveNotified(seen);
  },
  checkDaily(){
    if(!state.settings.dailyReminder || !this.enabled()) return;
    const now = new Date(), today = isoDate(now);
    const key = STORE_PREFIX+"notif.daily";
    const last = localStorage.getItem(key) || "";
    const rt = String(state.settings.reminderTime||"07:00");
    const h = parseInt(rt.slice(0,2),10)||0, m = parseInt(rt.slice(3,5),10)||0;
    if(now.getHours()*60+now.getMinutes() < h*60+m) return;
    if(last===today) return;
    try{ localStorage.setItem(key, today); }catch(e){}
    const tToday = state.tasks.filter(t=>t.date===today && !t.done);
    const evs = state.events.filter(e=>e.date===today);
    let body;
    if(tToday.length) body = `${tToday.length} tugas menunggu hari ini`;
    else body = "Tidak ada tugas terjadwal — nikmati harimu";
    body += evs.length ? ` dan ${evs.length} agenda.` : ".";
    this.send("🌅 Selamat pagi, "+(state.profile.name||"Sahabat GreenDay")+"!", body, "daily-"+today);
  }
};

let focusState = null;   /* {taskId, taskTitle, mins, total, left, running, completed} */
let focusIv = null;
const DURASI_FOKUS = [15, 25, 45, 60];

function fmtMMSS(s){ s=Math.max(0,s); return pad(Math.floor(s/60))+":"+pad(s%60); }
function focusMinutesToday(){ return state.focus.filter(f=>f.date===isoDate()).reduce((s,f)=>s+(f.minutes||0),0); }
function focusMinutes7d(){ const w=lastNDates(7); return state.focus.filter(f=>w.includes(f.date)).reduce((s,f)=>s+(f.minutes||0),0); }
function focusBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0, .3, .6].forEach(d=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = "sine"; o.frequency.value = 784;
      const t0 = ctx.currentTime + d;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
      o.start(t0); o.stop(t0 + 0.26);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 1400);
  }catch(e){}
}
function focusRecord(minutes){
  if(minutes < 1) return;
  state.focus.push({
    id: uid(), date: isoDate(), minutes: Math.round(minutes),
    taskId: focusState ? focusState.taskId : null,
    createdAt: new Date().toISOString()
  });
  persist("focus");
}
function focusPaint(){
  if(!focusState) return;
  const timeEl = el("fcTime");
  if(timeEl){
    timeEl.textContent = fmtMMSS(focusState.left);
    const rEl = el("fcRing");
    if(rEl){
      const c = +rEl.dataset.c;
      rEl.style.strokeDashoffset = (c*(focusState.left/focusState.total)).toFixed(1);
    }
    const st = el("fcState");
    if(st) st.textContent = focusState.running ? "Fokus berjalan — matikan gangguanmu" : (focusState.left<focusState.total ? "Dijeda" : "Siap mulai");
    const tgl = el("fcToggle");
    if(tgl) tgl.innerHTML = focusState.running ? `${ic("pause",16)} Jeda` : `${ic("play",16)} ${focusState.left<focusState.total?"Lanjut":"Mulai"}`;
  }
  const chip = el("focusChip");
  if(chip){
    chip.hidden = !focusState || !!document.getElementById("fcTime");
    if(focusState) el("focusChipTx").textContent = fmtMMSS(focusState.left) + (focusState.running ? "" : " · jeda");
  }
  document.title = focusState.running ? `${fmtMMSS(focusState.left)} · ${APP_TITLE_BASE}` : APP_TITLE_BASE;
}
function focusTick(){
  if(!focusState || !focusState.running) return;
  focusState.left--;
  if(focusState.left <= 0){ focusComplete(); return; }
  focusPaint();
}
function focusStart(){
  if(!focusState) return;
  focusState.running = true;
  clearInterval(focusIv);
  focusIv = setInterval(focusTick, 1000);
  focusPaint();
}
function focusPause(){
  if(!focusState) return;
  focusState.running = false;
  clearInterval(focusIv);
  focusPaint();
}
function focusReset(){
  if(!focusState) return;
  focusState.running = false;
  clearInterval(focusIv);
  focusState.left = focusState.total;
  document.title = APP_TITLE_BASE;
  focusPaint();
}
function focusStop(savePartial){
  if(!focusState) return;
  const elapsed = focusState.total - focusState.left;
  if(savePartial && elapsed >= 60){
    focusRecord(elapsed/60);
    toast(`Sesi fokus dihentikan — ${Math.max(1,Math.round(elapsed/60))} menit tercatat.`,"success");
  }else if(savePartial){
    toast("Sesi fokus dihentikan (kurang dari 1 menit, tidak dicatat).","info");
  }
  focusState = null;
  clearInterval(focusIv);
  document.title = APP_TITLE_BASE;
  const chip = el("focusChip");
  if(chip) chip.hidden = true;
}
function focusComplete(){
  const mins = Math.round(focusState.total/60);
  const title = focusState.taskTitle || "";
  focusRecord(mins);
  focusState.running = false;
  clearInterval(focusIv);
  focusBeep();
  Notif.send("🍅 Sesi fokus selesai!", `${mins} menit fokus${title?` untuk "${title}"`:""} tuntas — waktunya istirahat 5 menit.`, "focus-done");
  toast(`Kerja bagus! ${mins} menit fokus tercatat.`,"success");
  focusState = null;
  document.title = APP_TITLE_BASE;
  const chip = el("focusChip");
  if(chip) chip.hidden = true;
  if(document.getElementById("fcTime")) closeModal();
  renderApp();
}
function focusChipUpdate(){
  const chip = el("focusChip");
  if(!chip) return;
  chip.hidden = !focusState;
  if(focusState) el("focusChipTx").textContent = fmtMMSS(focusState.left) + (focusState.running?"":" · jeda");
}

/* ---------------- Sistem Modal ---------------- */
const modalStack=[];
function openModal(inner, {locked=false, onClose=null}={}){
  const ov=document.createElement("div");
  ov.className="m-ov";
  if(locked) ov.dataset.locked="1";
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.appendChild(ov);
  modalStack.push(ov);
  ov._onClose=onClose;
  requestAnimationFrame(()=>ov.classList.add("show"));
  ov.addEventListener("pointerdown",e=>{ if(e.target===ov && !locked) closeModal(); });
  const x=ov.querySelector("[data-close-x]");   if(x) x.addEventListener("click",()=>closeModal());
  const c=ov.querySelector("[data-cancel]");     if(c) c.addEventListener("click",()=>closeModal());
  return ov;
}
function closeModal(){
  const ov=modalStack.pop();
  if(!ov) return;
  if(ov._onClose) ov._onClose();
  ov.classList.remove("show");
  setTimeout(()=>ov.remove(),180);
}
function confirmDialog({title, message, confirmLabel="Hapus", danger=true}){
  return new Promise(resolve=>{
    let settled=false;
    const fin=v=>{ if(!settled){ settled=true; resolve(v); } };
    const ov=openModal(`
      <div class="modal-head"><h3>${esc(title)}</h3></div>
      <div class="modal-body"><p class="confirm-msg">${esc(message)}</p></div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button class="btn btn-ghost" data-cancel>Batal</button>
        <button class="btn ${danger?"btn-danger":"btn-primary"}" data-ok>${esc(confirmLabel)}</button>
      </div>`);
    ov.querySelector("[data-ok]").addEventListener("click",()=>{ fin(true); closeModal(); });
    ov._onClose=()=>fin(false);
  });
}
async function removeItem(coll, id, label){
  const arr=state[coll];
  const i=arr.findIndex(x=>x.id===id);
  if(i<0) return;
  const item=arr[i];
  const name=item.title||item.name||"";
  const ok=await confirmDialog({
    title:`Hapus ${label.toLowerCase()} ini?`,
    message:`"${name||label}" akan dihapus permanen dari perangkat ini. Tindakan ini tidak bisa dibatalkan.`
  });
  if(!ok) return;
  arr.splice(i,1);
  persist(coll); renderApp();
  toast(`${label} dihapus`,"success",{label:"Urungkan",fn:()=>{
    arr.splice(Math.min(i,arr.length),0,item); persist(coll); renderApp();
  }});
}

function habitStreak(h){
  const set=new Set(h.dates); let n=0; const d=new Date();
  if(!set.has(isoDate(d))) d.setDate(d.getDate()-1);
  while(set.has(isoDate(d))){ n++; d.setDate(d.getDate()-1); }

function habitConsistency(h,days=30){
  let n=0; lastNDates(days).forEach(ds=>{ if(h.dates.includes(ds)) n++; });
  return Math.round(n/days*100);
}
function tasksDoneOn(ds){
  return state.tasks.filter(t=>{
    if(!t.done) return false;
    if(t.completedAt) return isoDate(new Date(t.completedAt))===ds;
    return t.date===ds;
  }).length;

const habitDoneOn = ds=>state.habits.reduce((s,h)=>s+(h.dates.includes(ds)?1:0),0);
function goalPct(g){
  if(!g.steps.length) return 0;
  return Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100);
}
function computeStats(){
  const today=isoDate();
  const done=state.tasks.filter(t=>t.done).length;
  const open=state.tasks.filter(t=>!t.done).length;
  const tToday=state.tasks.filter(t=>t.date===today);
  return {
    done, open,
    completion: state.tasks.length?Math.round(done/state.tasks.length*100):0,
    todayPct: tToday.length?Math.round(tToday.filter(t=>t.done).length/tToday.length*100):0,
    journals: state.journals.length,

function weeklyBuckets(n=12){
  const out=[]; const now=new Date();
  const end=new Date(now); end.setDate(now.getDate()+ (7-now.getDay())%7 ); /* akhir minggu ini */
  for(let i=n-1;i>=0;i--){
    const wStart=new Date(end); wStart.setDate(end.getDate()-7*(i+1)+1);
    const wEnd=new Date(end); wEnd.setDate(end.getDate()-7*i);
    let v=0;
    for(let d=new Date(wStart); d<=wEnd; d.setDate(d.getDate()+1)){
      v+=tasksDoneOn(isoDate(d)) + habitDoneOn(isoDate(d));
    }
    out.push({label:`${wStart.getDate()} ${MONTHS_SHORT[wStart.getMonth()]}`, value:v});
  }
  return out;
}
function heroContextMsg(tToday, doneC){
  const h=new Date().getHours();
  if(!tToday.length)
    return h<11 ? "Hari masih muda — rancang tugas pertamamu."
         : h<15 ? "Tidak ada tugas terjadwal hari ini."
         : "Hari tanpa tugas — waktu istirahat yang layak.";
  if(doneC===tToday.length) return "Semua tugas hari ini selesai. Kerja bagus!";
  if(doneC===0)
    return h<11 ? `${tToday.length} tugas menunggu — mulai dari yang termudah.`
         : `${tToday.length} tugas menunggu hari ini.`;
  return `${doneC} dari ${tToday.length} tugas selesai — sisa sedikit lagi!`;
}

function filteredTasks(){
  const {q,filter,sort}=uiState.tasks;
  const lq=q.trim().toLowerCase();
  let list=state.tasks.filter(t=>!lq || (t.title+" "+(t.desc||"")).toLowerCase().includes(lq));
  const today=isoDate();
  if(filter==="hari-ini")      list=list.filter(t=>t.date===today);
  else if(filter==="mendatang") list=list.filter(t=>t.date && t.date>today);
  else if(filter==="terlambat") list=list.filter(t=>t.date && t.date<today && !t.done);
  else if(filter==="selesai")   list=list.filter(t=>t.done);
  const P={tinggi:0,sedang:1,rendah:2};
  const byDT=(a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||(a.time||"99:99").localeCompare(b.time||"99:99");
  if(sort==="waktu")        list=[...list].sort(byDT);
  else if(sort==="terbaru") list=[...list].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  else                      list=[...list].sort((a,b)=>P[a.priority]-P[b.priority]||byDT(a,b));
  return list;
}
function tabCounts(){
  const today=isoDate();
  const lq=uiState.tasks.q.trim().toLowerCase();
  const base=state.tasks.filter(t=>!lq || (t.title+" "+(t.desc||"")).toLowerCase().includes(lq));
  return {
    "semua":base.length,
    "hari-ini":base.filter(t=>t.date===today).length,
    "mendatang":base.filter(t=>t.date&&t.date>today).length,
    "terlambat":base.filter(t=>t.date&&t.date<today&&!t.done).length,
    "selesai":base.filter(t=>t.done).length
  };
}
function taskListHTML(){
  const list=filteredTasks();

    if(uiState.tasks.q.trim()) return emptySm("search","Tidak ada hasil",`Tidak ada tugas yang cocok dengan pencarian "${uiState.tasks.q.trim()}".`);

function monthLabel(y,m){ return `${MONTHS[m]} ${y}`; }
function calGridHTML(y,m,{sel=null,mini=false}){
  const first=new Date(y,m,1), startDow=first.getDay();
  const dim=new Date(y,m+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(`<span class="cal-cell blank"></span>`);
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`;
    const dots=[];
    if(state.tasks.some(t=>t.date===ds)) dots.push("d-task");
    if(state.events.some(e=>e.date===ds)) dots.push("d-ev");
    if(journalByDate(ds)) dots.push("d-jr");
    cells.push(`<button type="button" class="cal-cell ${ds===isoDate()?"is-today":""} ${ds===sel?"is-sel":""}"
      data-action="${mini?"jcal-pick":"cal-pick"}" data-date="${ds}" aria-label="${ds}">
      <span class="dnum">${d}</span><span class="dots">${dots.map(c=>`<i class="dot ${c}"></i>`).join("")}</span></button>`);
  }
  const rem=(7-(cells.length%7))%7;
  for(let i=0;i<rem;i++) cells.push(`<span class="cal-cell blank"></span>`);
  return cells.join("");
}

    .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||"")));

/* ---- Target ---- */
function goalCardHTML(g){
  const total=g.steps.length, done=g.steps.filter(s=>s.done).length, pct=goalPct(g);
  const du=g.due?daysUntil(g.due):null;
  return `<div class="goal card pad" data-id="${g.id}">
    <div class="g-head">
      <div class="g-title"><b>${esc(g.title)}</b>
        ${g.desc?`<p class="g-desc">${esc(g.desc)}</p>`:""}
        <div class="g-meta">
          <span class="chip chip-xs ${catOf(g.category).cls}">${catOf(g.category).label}</span>
          ${g.due?`<span class="meta-it">${ic("flag",12)} ${shortDate(g.due)}${
            du===null?"":du>0?` · ${du} hari lagi`:du===0?" · hari ini":` · ${-du} hari terlewat`}</span>`:""}
        </div>
      </div>
      <div class="task-acts">
        <button class="icon-btn sm" data-action="goal-edit" data-id="${g.id}" aria-label="Edit target">${ic("pencil",14)}</button>
        <button class="icon-btn sm" data-action="goal-del" data-id="${g.id}" aria-label="Hapus target">${ic("trash",14)}</button>
      </div>
    </div>
    ${g.steps.length?`<div class="g-steps">${g.steps.map(s=>`
      <button class="step ${s.done?"done":""}" data-action="goal-step" data-goal="${g.id}" data-id="${s.id}">
        <span class="cb">${ic("check",11)}</span><span>${esc(s.text)}</span>
      </button>`).join("")}</div>`
    : `<p class="mut" style="margin-top:10px">Belum ada langkah — buka edit untuk menambahkan langkah kecil menuju target ini.</p>`}
    <div class="g-prog">
      <div class="gp-t"><span>${done}/${total} langkah selesai</span><span>${pct}%</span></div>
      ${pbarHTML(pct)}
    </div>
  </div>`;
}
function renderGoals(){
  return pageHead("Target","Langkah kecil menuju tujuan besar",
    `<button class="btn btn-primary sm" data-action="goal-new">${ic("plus",15)} Target Baru</button>`, true)
  + (state.goals.length
    ? `<div class="goal-list">${state.goals.map(goalCardHTML).join("")}</div>`

/* ---- Statistik ---- */
function statCard(icon,num,label){
  return `<div class="card pad stat"><span class="st-ic">${ic(icon,17)}</span>
    <div><b class="st-num">${num}</b><span class="st-lab">${esc(label)}</span></div></div>`;
}
function renderStats(){
  const hasData = state.tasks.length||state.journals.length||state.habits.length||state.goals.length||state.focus.length;
  const st=computeStats();
  const head=pageHead("Statistik","Ringkasan produktivitasmu","",true);
  if(!hasData){
    return head+emptyState("chart","Belum ada data untuk dihitung","Statistik dihitung dari aktivitasmu yang nyata. Tambahkan tugas, jurnal, atau kebiasaan terlebih dahulu.",
      `<button class="btn btn-primary" data-action="nav-go" data-page="tasks">${ic("plus",16)} Mulai dengan Tugas</button>`);
  }
  const week=lastNDates(7);
  const tData=week.map(ds=>({label:DAYS_SHORT[parseISO(ds).getDay()],value:tasksDoneOn(ds)}));
  const hData=week.map(ds=>({label:DAYS_SHORT[parseISO(ds).getDay()],value:habitDoneOn(ds)}));
  const wData=weeklyBuckets(12);
  const badges=computeBadges();
  const unlockedN=badges.filter(b=>b.ok).length;
  const stk=activeStreak();
  return head+`
  <div class="stat-grid">
    ${statCard("check",st.done,"Tugas selesai")}
    ${statCard("tasks",st.open,"Belum selesai")}
    ${statCard("chart",st.completion+"%","Rasio penyelesaian")}
    ${statCard("sun",st.todayPct+"%","Produktivitas hari ini")}
    ${statCard("journal",st.journals,"Jurnal ditulis")}
    ${statCard("flame",st.habitDone+"/"+st.habitTotal,"Kebiasaan hari ini")}
    ${statCard("sparkle",st.bestStreak+" hari","Streak kebiasaan terbaik")}
    ${statCard("target",st.goalAvg+"%","Rata-rata target")}
    ${statCard("timer",focusMinutesToday()+" mnt","Fokus hari ini")}
    ${statCard("timer",focusMinutes7d()+" mnt","Fokus · 7 hari")}
    ${statCard("trophy",state.focus.length,"Sesi fokus total")}
    ${statCard("heart",stk+" hari","Streak aktif")}
  </div>

  <section class="card pad" style="margin-top:14px">
    <div class="sec-head"><h3>Streak aktif</h3>
      <span class="mini-pct">${stk} hari beruntun</span></div>
    <div class="stk-row">
      <span class="stk-flame">${ic("flame",20)}</span>
      <div class="stk-tx"><b>${stk} hari</b><span>aktivitas berturut-turut (tugas, jurnal, kebiasaan, atau fokus)</span></div>
    </div>
    <div class="stk-dots">${week.map(ds=>`<i class="${dayActive(ds)?"on":""}" title="${ds}"></i>`).join("")}<span>7 hari</span></div>
  </section>

  <div class="stats-2col">
    <section class="card pad"><h3 class="sec-t">Tugas selesai · 7 hari</h3>${barChart(tData)}</section>
    <section class="card pad"><h3 class="sec-t">Kebiasaan dicatat · 7 hari</h3>${barChart(hData)}</section>
  </div>

  <section class="card pad" style="margin-top:14px">
    <h3 class="sec-t">Tren produktivitas · 12 minggu</h3>
    ${barChart(wData)}
    <p class="mut" style="font-size:12px;margin-top:10px">Gabungan tugas selesai + kebiasaan tercatat per minggu (label = awal minggu).</p>
  </section>

  <section class="card pad" style="margin-top:14px">
    <h3 class="sec-t">Progres target pribadi</h3>
    ${state.goals.length
      ? state.goals.map(g=>`<div class="gpr-row">
          <div class="gpr-t"><b>${esc(g.title)}</b><span>${goalPct(g)}%</span></div>
          ${pbarHTML(goalPct(g))}</div>`).join("")
      : emptySm("target","Belum ada target","Buat target untuk melihat progresnya di sini.")}
  </section>

  <section class="card pad" style="margin-top:14px">
    <div class="sec-head"><h3>Lencana pencapaian</h3>
      <span class="mini-pct">${unlockedN}/${badges.length} terbuka</span></div>
    <div class="bdg-grid">
      ${badges.map(b=>`<div class="bdg ${b.ok?"unlocked":"locked"}" title="${esc(b.d)}">
        <span class="bd-ic">${ic(b.icon,18)}</span>
        <div><b>${esc(b.t)}</b><span>${esc(b.d)}</span></div>
      </div>`).join("")}
    </div>
  </section>`;
}

/* ================= ROUTER ================= */
const PAGES = {
  home:     { render:renderHome },
  tasks:    { render:renderTasks,  after:afterTasks },
  calendar: { render:renderCalendar },
  journal:  { render:renderJournal, after:afterJournal },
  habits:   { render:renderHabits },
  notes:    { render:renderNotes,  after:afterNotes },
  goals:    { render:renderGoals },
  stats:    { render:renderStats },
  profile:  { render:renderProfile, after:afterProfile },
  settings: { render:renderSettings, after:afterSettings }
};
const SUB_PAGES=["habits","notes","goals","stats","settings"];

function renderApp(){
  const page=PAGES[uiState.page]||PAGES.home;
  const view=el("view");
  view.classList.remove("page-enter");
  view.innerHTML=page.render();
  void view.offsetWidth;
  view.classList.add("page-enter");
  setActiveNav();
  if(page.after) page.after();
  animateVisuals();
  tickClock();
  if(uiState.lastDoneId){
    const r=$(`.task[data-id="${uiState.lastDoneId}"]`);
    if(r) r.classList.add("just-done");
    uiState.lastDoneId=null;
  }
  if(uiState.lastHabitId){
    const b=$(`.h-check[data-id="${uiState.lastHabitId}"]`);
    if(b) b.classList.add("just-check");
    uiState.lastHabitId=null;
  }
}
function navigate(p){
  if(!PAGES[p]) p="home";
  const changed=p!==uiState.page;
  uiState.page=p;
  if(changed){
    try{ history.pushState(null,"","#"+p); }catch(e){ location.hash=p; }
    window.scrollTo({top:0});
  }
  renderApp();
}
function setActiveNav(){
  const p=uiState.page;
  $$(".bn-item").forEach(b=>{
    const target=(SUB_PAGES.includes(p)?"profile":p);
    b.classList.toggle("active", b.dataset.page===target);
  });
  $$(".sb-item").forEach(b=>b.classList.toggle("active", b.dataset.page===p));
}

        <input class="inp" id="tfTitle" maxlength="120" placeholder="Misal: Menyelesaikan laporan" value="${esc(src.title)}"></div>

      <div class="row2">

      <div class="field"><span class="lbl">Kategori</span>
        <div class="chips-pick" id="tfCat">${CATS.map(c=>`<button type="button" class="chip ${c.cls} ${c.id===cat?"sel":""}" data-c="${c.id}">${c.label}</button>`).join("")}</div></div>
      <p class="form-err" id="tfErr"></p>

  });

    const data={title, desc:g("#tfDesc").value.trim(), date:g("#tfDate").value, time:g("#tfTime").value, priority:prio, category:cat};

      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" id="nfDone">Selesai</button>
    </div>`,{onClose:cleanupNote});
  const g=s=>ov.querySelector(s);
  function cleanupNote(){
    clearTimeout(timer);
    if(obj && !String(obj.title).trim() && !String(obj.content).trim()){
      const i=state.notes.indexOf(obj);
      if(i>=0){ state.notes.splice(i,1); persist("notes"); renderApp(); }
    }
  }
  function save(){
    const title=g("#nfTitle").value, content=g("#nfBody").value;
    if(!obj){
      if(!title.trim() && !content.trim()) return;
      obj={id:uid(),title:"",content:"",color,pinned,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
      state.notes.push(obj);
    }
    obj.title=title; obj.content=content; obj.color=color; obj.pinned=pinned;
    obj.updatedAt=new Date().toISOString();
    persist("notes"); renderApp();
    const ind=g("#nfSave"); ind.textContent="Tersimpan ✓"; ind.classList.add("flash");
    setTimeout(()=>{ ind.textContent="Tersimpan otomatis saat menulis"; ind.classList.remove("flash"); },1400);
  }
  const queueSave=()=>{ clearTimeout(timer); timer=setTimeout(save,550); };
  g("#nfTitle").addEventListener("input",queueSave);
  g("#nfBody").addEventListener("input",queueSave);
  g("#nfColor").addEventListener("click",e=>{
    const b=e.target.closest("[data-c]"); if(!b) return;
    color=b.dataset.c;
    $$(".cp",g("#nfColor")).forEach(x=>x.classList.toggle("sel",x===b));
    if(obj) save();
  });
  g("#nfPin").addEventListener("click",()=>{
    pinned=!pinned;
    g("#nfPin").style.color=pinned?"var(--primary)":"";
    g("#nfPin").style.borderColor=pinned?"var(--primary)":"";
    if(obj) save(); else queueSave();
  });
  g("#nfDone").addEventListener("click",()=>{ clearTimeout(timer); save(); closeModal(); });
  if(n) g("#nfDel").addEventListener("click",async()=>{
    const ok=await confirmDialog({title:"Hapus catatan ini?",message:"Catatan ini akan dihapus permanen."});
    if(!ok) return;
    const i=state.notes.indexOf(obj);
    if(i>=0){ state.notes.splice(i,1); persist("notes"); }
    closeModal(); renderApp(); toast("Catatan dihapus.","success");
  });
  setTimeout(()=>g(n?"#nfBody":"#nfTitle").focus(),80);
}

/* ================= PENGATURAN: tema, ekspor, impor, reset ================= */
function applySettings(){
  const s=state.settings, root=document.documentElement;
  root.dataset.theme = s.theme==="dark"?"dark":"light";
  root.dataset.accent = s.accent||"forest";
  root.classList.toggle("no-anim", s.animations===false);
}
function exportData(){
  try{
    const payload={meta:{app:"greenday",version:2,exportedAt:new Date().toISOString()},
      data:{profile:state.profile,settings:state.settings,tasks:state.tasks,journals:state.journals,
        habits:state.habits,events:state.events,notes:state.notes,goals:state.goals,focus:state.focus}};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`greenday-backup-${isoDate()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Berkas cadangan berhasil diunduh.","success");
  }catch(e){ toast("Gagal membuat berkas cadangan.","error"); }
}
function readBackup(obj){
  if(!isObj(obj)||!isObj(obj.meta)||obj.meta.app!=="greenday"||!isObj(obj.data)) return null;
  const d=obj.data, out={}, counts={};
  let any=false;
  ["tasks","journals","habits","events","notes","goals","focus"].forEach(k=>{
    if(Array.isArray(d[k])){
      out[k]=d[k].filter(isObj).map(x=>({...x,id:(typeof x.id==="string"&&x.id)?x.id:uid()}));
      counts[k]=out[k].length; any=true;
    }
  });
  if(!any) return null;
  out.profile=isObj(d.profile)?d.profile:null;
  out.settings=isObj(d.settings)?d.settings:null;
  return {out,counts};
}
function showImportPreview(parsed){
  const {out,counts}=parsed;
  const label={tasks:"Tugas",journals:"Jurnal",habits:"Kebiasaan",events:"Agenda",notes:"Catatan",goals:"Target",focus:"Sesi fokus"};
  const ov=openModal(`
    <div class="modal-head"><h3>Impor Cadangan</h3>
      <button class="icon-btn sm" data-close-x aria-label="Tutup">${ic("x",17)}</button></div>
    <div class="modal-body">
      <p class="confirm-msg">Berkas cadangan valid dan berisi data berikut:</p>
      <div class="stat-grid" style="margin-top:12px">
        ${Object.keys(counts).map(k=>`<div class="card pad stat"><span class="st-ic">${ic("check",15)}</span>
          <div><b class="st-num">${counts[k]}</b><span class="st-lab">${label[k]}</span></div></div>`).join("")}
      </div>
      <p class="confirm-msg" style="margin-top:14px">Pilih <b>Gabungkan</b> untuk menambahkan item baru tanpa menghapus data lamamu, atau <b>Timpa Semua</b> untuk menggantikan seluruh data saat ini.</p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" data-cancel>Batal</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="impMerge">Gabungkan</button>
      <button type="button" class="btn btn-danger" id="impOverwrite">Timpa Semua</button>
    </div>`);
  ov.querySelector("#impMerge").addEventListener("click",()=>{
    ["tasks","journals","habits","events","notes","goals","focus"].forEach(k=>{
      if(!out[k]) return;
      const ids=new Set(state[k].map(i=>i.id));
      out[k].forEach(i=>{ if(!ids.has(i.id)) state[k].push(i); });
      persist(k);
    });
    closeModal(); renderApp();
    toast("Data cadangan berhasil digabungkan.","success");
  });
  ov.querySelector("#impOverwrite").addEventListener("click",()=>{
    ["tasks","journals","habits","events","notes","goals","focus"].forEach(k=>{
      if(out[k]){ state[k]=out[k]; persist(k); }
    });
    if(out.profile){
      state.profile={...DEFAULTS.profile,...out.profile,onboarded:true};
      persist("profile");
    }
    if(out.settings){
      const s=out.settings, ns={};
      if(s.theme==="light"||s.theme==="dark") ns.theme=s.theme;
      if(["forest","sage","moss"].includes(s.accent)) ns.accent=s.accent;
      if(["panjang","sedang","angka"].includes(s.dateFormat)) ns.dateFormat=s.dateFormat;
      if(typeof s.animations==="boolean") ns.animations=s.animations;
      state.settings={...state.settings,...ns};
      persist("settings"); applySettings();
    }
    closeModal(); renderApp();
    toast("Seluruh data berhasil ditimpa dari cadangan.","success");
  });
}
async function resetAll(){
  const ok=await confirmDialog({
    title:"Hapus semua data?",

  loadAll(); applySettings(); renderApp(); showOnboarding(); focusChipUpdate();
  toast("Semua data profil ini telah dihapus.","success");
}

function bindGlobal(){
  document.body.addEventListener("click",e=>{
    const btn=e.target.closest("[data-action]");
    if(!btn) return;
    const fn=actions[btn.dataset.action];
    if(fn){ e.preventDefault(); fn(btn.dataset.id,btn,e); }
  });
  document.addEventListener("keydown",e=>{
    if(e.key!=="Escape") return;
    const top=modalStack[modalStack.length-1];
    if(top && !top.dataset.locked) closeModal();
  });
  window.addEventListener("hashchange",()=>{
    const p=location.hash.replace("#","");
    if(PAGES[p] && p!==uiState.page){ uiState.page=p; renderApp(); window.scrollTo({top:0}); }
  });
  /* Unggah foto profil (dipangkas & dikompres otomatis agar hemat LocalStorage) */
  el("photoFile").addEventListener("change",e=>{
    const f=e.target.files[0]; e.target.value="";
    if(!f) return;
    processImageFile(f).then(dataUrl=>{
      state.profile.photo=dataUrl;
      persist("profile"); renderApp();
      toast("Foto profil berhasil diperbarui.","success");
    }).catch(err=>{
      toast(err.message||"Gagal memproses gambar.","error");
    });
  });
  /* Impor berkas cadangan */
  el("importFile").addEventListener("change",e=>{
    const f=e.target.files[0]; e.target.value="";
    if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      let obj=null;
      try{ obj=JSON.parse(r.result); }catch(err){ obj=null; }
      const parsed=obj&&readBackup(obj);
      if(!parsed){ toast("Berkas tidak valid. Gunakan cadangan yang diunduh dari GreenDay.","error"); return; }
      showImportPreview(parsed);
    };
    r.onerror=()=>toast("Gagal membaca berkas.","error");
    r.readAsText(f);
  });
}
