/* ================= TIMER FOKUS (Pomodoro) ================= */
let focusState = null;   /* {taskId, taskTitle, mins, total, left, running, completed} */
let focusIv = null;
const DURASI_FOKUS = [15, 25, 45, 60];

function fmtMMSS(s){ s=Math.max(0,s); return pad(Math.floor(s/60))+":"+pad(s%60); }
function focusMinutesToday(){ return state.focus.filter(f=>f.date===isoDate()).reduce((s,f)=>s+(f.minutes||0),0); }
function focusMinutes7d(){ const w=lastNDates(7); return state.focus.filter(f=>w.includes(f.date)).reduce((s,f)=>s+(f.minutes||0),0); }
function focusBeep(){
  if(state.settings.sound===false) return; /* v5: ikut setelan efek suara */
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0, .3, .6].forEach(d=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = "sine"; o.frequency.value = 784;
      const t0 = ctx.currentTime + d;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
      o.start(t0); o.stop(t0 + 0.26);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 1400);
  }catch(e){}
}
function focusRecord(minutes){
  if(minutes < 1) return;
  state.focus.push({
    id: uid(), date: isoDate(), minutes: Math.round(minutes),
    taskId: focusState ? focusState.taskId : null,
    createdAt: new Date().toISOString()
  });
  persist("focus");
  awardXP(Math.max(5,Math.min(Math.round(minutes),30)),{quiet:true}); /* v5: poin sesi fokus */
}
function focusPaint(){
  if(!focusState) return;
  const timeEl = el("fcTime");
  if(timeEl){
    timeEl.textContent = fmtMMSS(focusState.left);
    const rEl = el("fcRing");
    if(rEl){
      const c = +rEl.dataset.c;
      rEl.style.strokeDashoffset = (c*(focusState.left/focusState.total)).toFixed(1);
    }
    const st = el("fcState");
    if(st) st.textContent = focusState.running ? "Fokus berjalan — matikan gangguanmu" : (focusState.left<focusState.total ? "Dijeda" : "Siap mulai");
    const tgl = el("fcToggle");
    if(tgl) tgl.innerHTML = focusState.running ? `${ic("pause",16)} Jeda` : `${ic("play",16)} ${focusState.left<focusState.total?"Lanjut":"Mulai"}`;
  }
  const chip = el("focusChip");
  if(chip){
    chip.hidden = !focusState || !!document.getElementById("fcTime");
    if(focusState) el("focusChipTx").textContent = fmtMMSS(focusState.left) + (focusState.running ? "" : " · jeda");
  }
  document.title = focusState.running ? `${fmtMMSS(focusState.left)} · ${APP_TITLE_BASE}` : APP_TITLE_BASE;
}
function focusTick(){
  if(!focusState || !focusState.running) return;
  focusState.left--;
  if(focusState.left <= 0){ focusComplete(); return; }
  focusPaint();
}
function focusStart(){
  if(!focusState) return;
  focusState.running = true;
  clearInterval(focusIv);
  focusIv = setInterval(focusTick, 1000);
  focusPaint();
}
function focusPause(){
  if(!focusState) return;
  focusState.running = false;
  clearInterval(focusIv);
  focusPaint();
}
function focusReset(){
  if(!focusState) return;
  focusState.running = false;
  clearInterval(focusIv);
  focusState.left = focusState.total;
  document.title = APP_TITLE_BASE;
  focusPaint();
}
function focusStop(savePartial){
  if(!focusState) return;
  const elapsed = focusState.total - focusState.left;
  if(savePartial && elapsed >= 60){
    focusRecord(elapsed/60);
    toast(`Sesi fokus dihentikan — ${Math.max(1,Math.round(elapsed/60))} menit tercatat.`,"success");
  }else if(savePartial){
    toast("Sesi fokus dihentikan (kurang dari 1 menit, tidak dicatat).","info");
  }
  focusState = null;
  clearInterval(focusIv);
  document.title = APP_TITLE_BASE;
  const chip = el("focusChip");
  if(chip) chip.hidden = true;
}
function focusComplete(){
  const mins = Math.round(focusState.total/60);
  const title = focusState.taskTitle || "";
  focusRecord(mins);
  focusState.running = false;
  clearInterval(focusIv);
  focusBeep();
  NC.add({ type:"focus", title:"Sesi fokus selesai!",
    body:`${mins} menit fokus${title?` untuk "${title}"`:""} tuntas — waktunya istirahat sejenak.`,
    icon:"timer", page:"stats" });
  toast(`Kerja bagus! ${mins} menit fokus tercatat.`,"success");
  focusState = null;
  document.title = APP_TITLE_BASE;
  const chip = el("focusChip");
  if(chip) chip.hidden = true;
  if(document.getElementById("fcTime")) closeModal();
  renderApp();
}

  const chip = el("focusChip");

/* ---------------- Sistem Modal ---------------- */
const modalStack=[];
function openModal(inner, {locked=false, onClose=null}={}){
  const ov=document.createElement("div");
  ov.className="m-ov";
  if(locked) ov.dataset.locked="1";
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.appendChild(ov);
  modalStack.push(ov);
  ov._onClose=onClose;
  requestAnimationFrame(()=>ov.classList.add("show"));
  ov.addEventListener("pointerdown",e=>{ if(e.target===ov && !locked) closeModal(); });
  const x=ov.querySelector("[data-close-x]");   if(x) x.addEventListener("click",()=>closeModal());
  const c=ov.querySelector("[data-cancel]");     if(c) c.addEventListener("click",()=>closeModal());
  return ov;
}
function closeModal(){
  const ov=modalStack.pop();
  if(!ov) return;
  if(ov._onClose) ov._onClose();
  ov.classList.remove("show");
  setTimeout(()=>ov.remove(),180);
}
function confirmDialog({title, message, confirmLabel="Hapus", danger=true}){
  return new Promise(resolve=>{
    let settled=false;
    const fin=v=>{ if(!settled){ settled=true; resolve(v); } };
    const ov=openModal(`
      <div class="modal-head"><h3>${esc(title)}</h3></div>
      <div class="modal-body"><p class="confirm-msg">${esc(message)}</p></div>
      <div class="modal-foot">

const journalByDate = ds=>state.journals.find(j=>j.date===ds);
const habitDoneToday = h=>h.dates.includes(isoDate());
function habitStreak(h){
  const set=new Set(h.dates); let n=0; const d=new Date();
  if(!set.has(isoDate(d))) d.setDate(d.getDate()-1);
  while(set.has(isoDate(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function habitConsistency(h,days=30){
  let n=0; lastNDates(days).forEach(ds=>{ if(h.dates.includes(ds)) n++; });
  return Math.round(n/days*100);
}
function tasksDoneOn(ds){
  return state.tasks.filter(t=>{
    if(!t.done) return false;
    if(t.completedAt) return isoDate(new Date(t.completedAt))===ds;
    return t.date===ds;
  }).length;
}
const habitDoneOn = ds=>state.habits.reduce((s,h)=>s+(h.dates.includes(ds)?1:0),0);
function goalPct(g){
  if(!g.steps.length) return 0;
  return Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100);
}
function computeStats(){
  const today=isoDate();
  const done=state.tasks.filter(t=>t.done).length;
  const open=state.tasks.filter(t=>!t.done).length;
  const tToday=state.tasks.filter(t=>t.date===today);
  return {
    done, open,
    completion: state.tasks.length?Math.round(done/state.tasks.length*100):0,
    todayPct: tToday.length?Math.round(tToday.filter(t=>t.done).length/tToday.length*100):0,
    journals: state.journals.length,
    habitDone: state.habits.filter(habitDoneToday).length,
    habitTotal: state.habits.length,
    bestStreak: state.habits.reduce((m,h)=>Math.max(m,habitStreak(h)),0),
    goalAvg: state.goals.length?Math.round(state.goals.reduce((s,g)=>s+goalPct(g),0)/state.goals.length):0
  };
}
function activitySummary(){
  return {
    done: state.tasks.filter(t=>t.done).length,

}

function weeklyBuckets(n=12){
  const out=[]; const now=new Date();
  const end=new Date(now); end.setDate(now.getDate()+ (7-now.getDay())%7 ); /* akhir minggu ini */
  for(let i=n-1;i>=0;i--){
    const wStart=new Date(end); wStart.setDate(end.getDate()-7*(i+1)+1);
    const wEnd=new Date(end); wEnd.setDate(end.getDate()-7*i);
    let v=0;
    for(let d=new Date(wStart); d<=wEnd; d.setDate(d.getDate()+1)){
      v+=tasksDoneOn(isoDate(d)) + habitDoneOn(isoDate(d));
    }
    out.push({label:`${wStart.getDate()} ${MONTHS_SHORT[wStart.getMonth()]}`, value:v});
  }
  return out;
}

function filteredTasks(){
  const {q,filter,sort}=uiState.tasks;
  const lq=q.trim().toLowerCase();
  let list=state.tasks.filter(t=>!lq || (t.title+" "+(t.desc||"")).toLowerCase().includes(lq));
  const today=isoDate();
  if(filter==="hari-ini")      list=list.filter(t=>t.date===today);
  else if(filter==="mendatang") list=list.filter(t=>t.date && t.date>today);
  else if(filter==="terlambat") list=list.filter(t=>t.date && t.date<today && !t.done);
  else if(filter==="selesai")   list=list.filter(t=>t.done);
  const P={tinggi:0,sedang:1,rendah:2};
  const byDT=(a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||(a.time||"99:99").localeCompare(b.time||"99:99");
  if(sort==="urutanku")     return list;   /* v6: urutan manual hasil drag & drop */
  if(sort==="waktu")        list=[...list].sort(byDT);
  else if(sort==="terbaru") list=[...list].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  else                      list=[...list].sort((a,b)=>P[a.priority]-P[b.priority]||byDT(a,b));
  return list;
}

  };
}

function calGridHTML(y,m,{sel=null,mini=false}){

/* ================= ROUTER ================= */
const PAGES = {
  home:     { render:renderHome },
  tasks:    { render:renderTasks,  after:afterTasks },
  calendar: { render:renderCalendar },
  journal:  { render:renderJournal, after:afterJournal },
  habits:   { render:renderHabits },
  notes:    { render:renderNotes,  after:afterNotes },
  goals:    { render:renderGoals },
  hadiah:   { render:renderHadiah },
  sahabat:  { render:renderSahabat },
  stats:    { render:renderStats },
  profile:  { render:renderProfile, after:afterProfile },
  settings: { render:renderSettings, after:afterSettings }
};
const SUB_PAGES=["habits","notes","goals","hadiah","sahabat","stats","settings"];

function renderApp(){
  const page=PAGES[uiState.page]||PAGES.home;
  const view=el("view");
  view.classList.remove("page-enter");
  view.innerHTML=page.render();
  void view.offsetWidth;
  view.classList.add("page-enter");
  setActiveNav();
  if(page.after) page.after();
  animateVisuals();
  tickClock();
  if(uiState.lastDoneId){
    const r=$(`.task[data-id="${uiState.lastDoneId}"]`);
    if(r) r.classList.add("just-done");
    uiState.lastDoneId=null;
  }
  if(uiState.lastHabitId){
    const b=$(`.h-check[data-id="${uiState.lastHabitId}"]`);
    if(b) b.classList.add("just-check");
    uiState.lastHabitId=null;
  }
  gamifyBadges(); /* v5: lencana baru otomatis terdeteksi setelah aktivitas apa pun */
}
function navigate(p){
  if(!PAGES[p]) p="home";
  const changed=p!==uiState.page;
  uiState.page=p;
  if(changed){
    try{ history.pushState(null,"","#"+p); }catch(e){ location.hash=p; }
    window.scrollTo({top:0});
  }
  renderApp();
}
function setActiveNav(){
  const p=uiState.page;
  $$(".bn-item").forEach(b=>{
    const target=(SUB_PAGES.includes(p)?"profile":p);
    b.classList.toggle("active", b.dataset.page===target);
  });
  $$(".sb-item").forEach(b=>b.classList.toggle("active", b.dataset.page===p));
}

/* ================= AKSI (event delegation) ================= */
const actions={
  "nav-go":(id,btn)=>navigate(btn.dataset.page),
  "back":()=>navigate("profile"),
  "toggle-theme":()=>{
    state.settings.theme = state.settings.theme==="dark"?"light":"dark";
    persist("settings"); applySettings(); renderApp();
  },
  "motd-next":()=>rotateMotivation(),

  /* Tugas */
  "task-new":()=>openTaskModal(),
  "task-edit":(id)=>{ const t=state.tasks.find(x=>x.id===id); if(t) openTaskModal(t); },
  "task-toggle":(id)=>{
    const t=state.tasks.find(x=>x.id===id); if(!t) return;
    t.done=!t.done;
    t.completedAt=t.done?new Date().toISOString():null;
    let ulang=false;
    if(t.done && t.repeat && t.repeat!=="none"){
      const nd=nextRepeatDate(t.date,t.repeat);
      if(nd){
        state.tasks.push({id:uid(), title:t.title, desc:t.desc||"", date:nd, time:t.time||"",
          priority:t.priority, category:t.category, repeat:t.repeat, assignee:t.assignee||null,
          subtasks:(t.subtasks||[]).map(s=>({id:uid(), text:s.text, done:false})),
          done:false, completedAt:null, createdAt:new Date().toISOString()});
        ulang=true;
        toast(`Tugas berulang dijadwalkan ulang ke ${shortDate(nd)}.`,"info");
      }
    }
    if(t.done) uiState.lastDoneId=id;
    persist("tasks"); renderApp();
    if(t.done && !ulang) toast("Tugas ditandai selesai.","success");
    if(!t.done) toast("Status selesai dibatalkan.","success");
    /* v5: poin, confetti & bunyi perayaan */
    if(t.done){
      const tepat = t.date && t.completedAt && isoDate(new Date(t.completedAt)) <= t.date;
      awardXP(10 + (tepat?5:0));
      confetti(); ding();
    }else{
      awardXP(-10,{quiet:true});
    }
  },
  "task-del":(id)=>removeItem("tasks",id,"Tugas"),
  "task-filter":(_,btn)=>{ uiState.tasks.filter=btn.dataset.val; renderApp(); },

  /* Jurnal */
  "journal-new":()=>{
    const ex=journalByDate(isoDate());
    if(ex){ openJournalModal(ex); toast("Jurnal hari ini sudah ada — membuka yang tersimpan.","info"); }
    else openJournalModal(null,isoDate());
  },
  "journal-new-date":(_,btn)=>openJournalModal(null,btn.dataset.date||isoDate()),
  "journal-edit":(id)=>{ const j=state.journals.find(x=>x.id===id); if(j) openJournalModal(j); },
  "jcal-pick":(_,btn)=>{
    const ds=btn.dataset.date, ex=journalByDate(ds);
    if(ex) openJournalModal(ex); else openJournalModal(null,ds);
  },
  "jcal-prev":()=>{ const jc=uiState.jcal; jc.m--; if(jc.m<0){jc.m=11;jc.y--;} renderApp(); },
  "jcal-next":()=>{ const jc=uiState.jcal; jc.m++; if(jc.m>11){jc.m=0;jc.y++;} renderApp(); },

  /* Kalender & agenda */
  "cal-prev":()=>{ const c=uiState.cal; c.m--; if(c.m<0){c.m=11;c.y--;} renderApp(); },
  "cal-next":()=>{ const c=uiState.cal; c.m++; if(c.m>11){c.m=0;c.y++;} renderApp(); },
  "cal-today":()=>{ const n=new Date(); uiState.cal={y:n.getFullYear(),m:n.getMonth(),sel:isoDate()}; renderApp(); },
  "cal-pick":(_,btn)=>{ uiState.cal.sel=btn.dataset.date; renderApp(); },
  "event-new":(_,btn)=>openEventModal(null, btn.dataset.date||uiState.cal.sel||isoDate()),
  "event-edit":(id)=>{ const e=state.events.find(x=>x.id===id); if(e) openEventModal(e); },
  "event-del":(id)=>removeItem("events",id,"Agenda"),

  /* Kebiasaan */
  "habit-new":()=>openHabitModal(),
  "habit-edit":(id)=>{ const h=state.habits.find(x=>x.id===id); if(h) openHabitModal(h); },
  "habit-del":(id)=>removeItem("habits",id,"Kebiasaan"),
  "habit-check":(id)=>{
    const h=state.habits.find(x=>x.id===id); if(!h) return;
    const t=isoDate(), i=h.dates.indexOf(t);
    if(i>=0){ h.dates.splice(i,1); }
    else{ h.dates.push(t); uiState.lastHabitId=id; toast("Kebiasaan hari ini tercatat. Pertahankan!","success"); NC.checkStreak(h); awardXP(2,{quiet:true}); }
    persist("habits"); renderApp();

  /* Pusat Notifikasi (v4 — di dalam aplikasi, selalu aktif) */
  "nc-open":()=>openNotifPanel(),
  "nc-clear":()=>{
    NC.clear(); closeModal(); renderApp();
    toast("Pusat notifikasi dibersihkan.","success");
  },

  "notif-popup":()=>{
    const on=state.settings.popupNotif!==false;
    state.settings.popupNotif=!on; persist("settings"); renderApp();

    const on=state.settings.sound!==false;
    state.settings.sound=!on; persist("settings"); renderApp();
    if(!on) ding();
  },
  "quick-add":()=>openQuickAdd(),
  "task-filter-go":(_,btn)=>{ uiState.tasks.filter=btn.dataset.val||"terlambat"; navigate("tasks"); },

  "nc-tab":(_,btn)=>{
    uiState.ncTab=btn.dataset.val||"semua";

    if(ov){
      $$(".nc-tab",ov).forEach(b=>b.classList.toggle("sel",b.dataset.val===uiState.ncTab));
      const body=ov.querySelector("#ncBody");
      if(body) body.innerHTML=ncListHTML();

  "ann-p-open":()=>openAnnManager(),
  "ann-p-close":(id)=>{
    let hidden=[];
    try{ const v=JSON.parse(localStorage.getItem(STORE_PREFIX+"annPentingHide")); if(Array.isArray(v)) hidden=v; }catch(e){}
    if(id && !hidden.includes(id)){
      hidden.push(id);
      try{ localStorage.setItem(STORE_PREFIX+"annPentingHide", JSON.stringify(hidden)); }catch(e){}
    }
    renderApp();
  },

    const a=annLocal.find(x=>x.id===id);
    if(a){ a.active=a.active===false; annSaveLocal(); }
    closeModal(); openAnnManager(); renderApp();

  "fam-react":(_,btn)=>{
    const uidLain=btn.dataset.uid, tid=btn.dataset.tid, me=currentUser();
    const key=uidLain+"|"+tid, m=reactionsMap();
    const arr=m[key]||[];
    const idx=arr.findIndex(x=>x.by===me);
    if(idx>=0){
      arr.splice(idx,1);

    }else{
      arr.push({by:me, byName:(state.profile.name||"Anggota"), av:(state.profile.avatar||"🌱"), at:Date.now()});

        title:(state.profile.name||"Anggota")+" memberi 👍 untuk tugasmu",

        icon:"heart", page:"tasks"});
      ting();

    if(arr.length) m[key]=arr; else delete m[key];
    reactionsSave(m); renderApp();

  /* v6: Toko Hadiah */
  "rw-new":()=>openRewardModal(),
  "rw-del":(id)=>{
    rewardsSave(rewardsList().filter(r=>r.id!==id));
    renderApp(); toast("Hadiah dihapus dari vitrin.","success");
  },
  "rw-redeem":(id)=>{
    const r=rewardsList().find(x=>x.id===id); if(!r) return;
    const cost=Math.max(0,Math.round(r.cost||0));
    if((state.xp||0)<cost){ toast("Poin belum cukup — kurang "+(cost-(state.xp||0))+" poin lagi.","error"); return; }
    confirmDialog({title:"Tukar hadiah ini?",
      message:"\""+r.title+"\" ("+cost+" poin) akan ditukar. Tunjukkan riwayat tukaran di halaman ini ke orang tua untuk mengambil hadiahmu.",
      confirmLabel:"Ya, tukar", danger:false}).then(ok=>{
      if(!ok) return;
      awardXP(-cost,{quiet:true});
      const rds=redeemsList();
      rds.unshift({id:uid(), rewardId:r.id, title:r.title, cost, icon:r.icon||"🎁",
        by:currentUser(), byName:state.profile.name||"Anggota", av:state.profile.avatar||"🌱",
        at:Date.now(), status:"pending"});
      redeemsSave(rds);
      userRegistry().forEach(u=>{
        if(u.id!==currentUser()) notifyUser(u.id,{type:"reward",
          title:(state.profile.name||"Anggota")+" menukar hadiah",
          body:"\""+r.title+"\" ("+cost+" poin) menunggu diproses. Buka Toko Hadiah untuk menyetujui.",
          icon:"gift", page:"hadiah"});
      });
      confetti(); renderApp();
      toast("Hadiah ditukar! Tunjukkan ke orang tua ya 🎁","success");
    });
  },
  "rw-approve":(id)=>{
    const rds=redeemsList();
    const r=rds.find(x=>x.id===id); if(!r) return;
    r.status="done"; redeemsSave(rds);
    notifyUser(r.by,{type:"reward", title:"Hadiah siap diambil!",
      body:"\""+r.title+"\" sudah disetujui. Selamat menikmati!", icon:"gift", page:"hadiah"});
    if(r.by===currentUser()) confetti();
    renderApp(); toast("Tukaran ditandai selesai.","success");
  },
  "rw-reject":(id)=>{
    const rds=redeemsList();
    const r=rds.find(x=>x.id===id); if(!r) return;
    r.status="rejected"; redeemsSave(rds);
    notifyUser(r.by,{type:"reward", title:"Tukaran ditolak",
      body:"\""+r.title+"\" ditolak — "+r.cost+" poin sudah kembali ke kamu.", icon:"gift", page:"hadiah"});
    if(r.by===currentUser()) awardXP(r.cost,{quiet:true});
    renderApp(); toast("Tukaran ditolak — poin kembali ke pemiliknya.","info");
  },

  /* v6: drag & drop urutan tugas (aksi no-op — logika di bindTaskDrag) */
  "task-drag":()=>{},

  /* v7: Sahabat */
  "fr-page":()=>navigate("sahabat"),
  "fr-board":()=>{ uiState.lbMode="sahabat"; navigate("stats"); },
  "lb-mode":(_,btn)=>{ uiState.lbMode=btn.dataset.val==="sahabat"?"sahabat":"semua"; renderApp(); },
  "fr-add":(id)=>frSendRequest(id),
  "fr-accept":(id)=>frAccept(id),
  "fr-reject":(id)=>frReject(id),
  "fr-cancel":(id)=>frCancel(id),
  "fr-card":(id)=>{ closeModal(); openFriendCard(id); },
  "fr-gift":(id)=>{ closeModal(); openGiftModal(id); },
  "fr-sapa":(id)=>{ closeModal(); frSapa(id); },
  "fr-del":(id)=>{ closeModal(); removeFriend(id); },
  "fr-share":()=>openShareCardModal(),
  "fr-import":()=>openImportCardModal(),
  /* v8: Jarak Jauh (beda HP) */
  "ol-on":()=>openOnlModal("buat"),
  "ol-tab":(_,btn)=>openOnlModal(btn.dataset.val==="masuk"?"masuk":"buat"),
  "ol-add":()=>onlAddFromInput(),
  "ol-copy":(id)=>onlCopyCode(String(id||"")),
  "ol-refresh":()=>{ onlPush(true); onlPoll(); toast("Menyinkronkan dengan GreenDay Online…","info"); },
  "ol-out":()=>onlLogout(),
  "rmt-del":(id)=>{
    remoteCardsSave(remoteCardsList().filter(c=>c.id!==id));
    renderApp(); toast("Kartu sahabat jauh dihapus.","success");
  },
  "sc-copy":()=>{
    const t=document.getElementById("scCode"); if(!t) return;
    t.focus(); t.select();
    const done=()=>toast("Kode kartu tersalin — kirim ke temanmu lewat WhatsApp!","success");
    const fb=()=>{ try{ if(document.execCommand("copy")){ done(); return; } }catch(e){}
                   toast("Salin manual: tekan lama kode lalu pilih Salin.","info"); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t.value).then(done).catch(fb); }
    else fb();
  },

  /* Pengguna bersama */
  "user-switch":()=>openUsersModal(),
  "habit-check-open":()=>navigate("habits")
};

function openTaskModal(task){
  const isNew=!task;
  const src=task||{title:"",desc:"",date:isoDate(),time:"",priority:"sedang",category:"pribadi",repeat:"none",assignee:null,subtasks:[]};
  let prio=src.priority, cat=src.category;
  let rep=(src.repeat && REPEATS.some(r=>r[0]===src.repeat)) ? src.repeat : "none";
  let subs=(src.subtasks||[]).filter(s=>s&&s.text).map(s=>({id:uid(),text:String(s.text),done:!!s.done}));
  const users=userRegistry();
  const ov=openModal(`
    <div class="modal-head"><h3>${isNew?"Tambah Tugas":"Edit Tugas"}</h3>
      <button class="icon-btn sm" data-close-x aria-label="Tutup">${ic("x",17)}</button></div>
    <form class="modal-body" id="taskForm" novalidate>
      <div class="field"><label class="lbl" for="tfTitle">Judul tugas</label>
        <input class="inp" id="tfTitle" maxlength="120" placeholder="Misal: Menyelesaikan laporan" value="${esc(src.title)}"></div>
      <div class="field"><label class="lbl" for="tfDesc">Deskripsi <span class="opt">(opsional)</span></label>
        <textarea class="inp" id="tfDesc" rows="2" maxlength="400" placeholder="Detail tambahan...">${esc(src.desc)}</textarea></div>
      <div class="row2">
        <div class="field"><label class="lbl" for="tfDate">Tanggal</label>
          <input type="date" class="inp" id="tfDate" value="${esc(src.date)}"></div>
        <div class="field"><label class="lbl" for="tfTime">Waktu</label>
          <input type="time" class="inp" id="tfTime" value="${esc(src.time)}"></div>
      </div>
      <div class="field"><span class="lbl">Prioritas</span>
        <div class="seg" id="tfPrio">${PRIOS.map(p=>`<button type="button" data-p="${p.id}" class="${p.id===prio?"sel":""}">${p.label}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Kategori</span>
        <div class="chips-pick" id="tfCat">${CATS.map(c=>`<button type="button" class="chip ${c.cls} ${c.id===cat?"sel":""}" data-c="${c.id}">${c.label}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Ulangi <span class="opt">(tugas rutin keluarga)</span></span>
        <div class="seg" id="tfRepeat">${REPEATS.map(([id,lab])=>`<button type="button" data-r="${id}" class="${id===rep?"sel":""}">${lab}</button>`).join("")}</div></div>
      ${users.length>1?`
      <div class="field"><label class="lbl" for="tfAsg">Penanggung jawab <span class="opt">(opsional — untuk dipakai bersama)</span></label>
        <select class="inp" id="tfAsg">
          <option value="">— Tanpa penanggung jawab —</option>
          ${users.map(u=>{const up=userProfileOf(u.id)||{};return `<option value="${u.id}" ${src.assignee===u.id?"selected":""}>${esc(up.name||"Anggota")} ${esc(up.avatar||"")}</option>`;}).join("")}
        </select></div>`:""}
      <div class="field"><span class="lbl">Langkah-langkah <span class="opt">(opsional — sub-tugas)</span></span>
        <div id="tfSubs"></div>
        <div class="step-row" style="margin-top:2px">
          <input class="inp" id="tfSubInp" maxlength="120" placeholder="Tambah langkah, lalu Enter">
          <button type="button" class="btn btn-ghost sm" id="tfSubAdd">${ic("plus",14)}</button>
        </div></div>
      <p class="form-err" id="tfErr"></p>
    </form>
    <div class="modal-foot">
      ${isNew?"":`<button type="button" class="btn btn-danger sm" id="tfDel">${ic("trash",15)} Hapus</button>`}
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" data-cancel>Batal</button>
      <button type="submit" form="taskForm" class="btn btn-primary">${isNew?"Tambah":"Simpan"}</button>
    </div>`);
  const g=s=>ov.querySelector(s);
  const paintSubs=()=>{
    g("#tfSubs").innerHTML = subs.length
      ? subs.map((s,i)=>`
        <div class="sub-row">
          <button type="button" class="cbx ${s.done?"on":""}" data-subdone="${i}" aria-label="Tandai langkah selesai">${ic("check",12)}</button>
          <span class="${s.done?"done-tx":""}">${esc(s.text)}</span>
          <button type="button" class="icon-btn sm" data-subdel="${i}" aria-label="Hapus langkah">${ic("trash",13)}</button>
        </div>`).join("")
      : `<p class="mut" style="font-size:12px;margin:2px 0 6px">Belum ada langkah — pecah tugas besar jadi langkah kecil agar lebih mudah dikerjakan.</p>`;
  };
  paintSubs();
  g("#tfSubs").addEventListener("click",e=>{
    const d=e.target.closest("[data-subdone]");
    if(d){ const s=subs[+d.dataset.subdone]; if(s){ s.done=!s.done; paintSubs(); } return; }
    const x=e.target.closest("[data-subdel]");
    if(x){ subs.splice(+x.dataset.subdel,1); paintSubs(); }
  });
  const addSub=()=>{
    const inp=g("#tfSubInp"), v=inp.value.trim();
    if(!v) return;
    if(subs.length>=15){ toast("Maksimal 15 langkah per tugas.","info"); return; }
    subs.push({id:uid(),text:v.slice(0,120),done:false});
    inp.value=""; paintSubs(); inp.focus();
  };
  g("#tfSubAdd").addEventListener("click",addSub);
  g("#tfSubInp").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addSub(); } });
  g("#tfPrio").addEventListener("click",e=>{
    const b=e.target.closest("[data-p]"); if(!b) return;
    prio=b.dataset.p; $$("button",g("#tfPrio")).forEach(x=>x.classList.toggle("sel",x===b));
  });
  g("#tfCat").addEventListener("click",e=>{
    const b=e.target.closest("[data-c]"); if(!b) return;
    cat=b.dataset.c; $$("button",g("#tfCat")).forEach(x=>x.classList.toggle("sel",x===b));
  });
  g("#tfRepeat").addEventListener("click",e=>{
    const b=e.target.closest("[data-r]"); if(!b) return;
    rep=b.dataset.r; $$("button",g("#tfRepeat")).forEach(x=>x.classList.toggle("sel",x===b));
  });
  g("#taskForm").addEventListener("submit",e=>{
    e.preventDefault();
    const title=g("#tfTitle").value.trim();
    if(!title){ g("#tfErr").textContent="Judul tugas tidak boleh kosong."; g("#tfTitle").focus(); return; }
    const asgSel=g("#tfAsg");
    const data={title, desc:g("#tfDesc").value.trim(), date:g("#tfDate").value, time:g("#tfTime").value,
      priority:prio, category:cat, repeat:rep, assignee:asgSel?(asgSel.value||null):null, subtasks:subs};
    if(isNew) state.tasks.push({id:uid(), ...data, done:false, completedAt:null, createdAt:new Date().toISOString()});
    else Object.assign(task,data);
    persist("tasks"); closeModal(); renderApp();
    toast(isNew?"Tugas berhasil ditambahkan.":"Perubahan tugas disimpan.","success");
  });
  if(!isNew) g("#tfDel").addEventListener("click",async()=>{
    const ok=await confirmDialog({title:"Hapus tugas ini?",message:`"${task.title}" akan dihapus permanen.`});
    if(!ok) return;
    closeModal();
    removeItem("tasks",task.id,"Tugas");
  });
  setTimeout(()=>g("#tfTitle").focus(),80);
}

    </div>`,{onClose:cleanupNote});
  const g=s=>ov.querySelector(s);
  function cleanupNote(){
    clearTimeout(timer);
    if(obj && !String(obj.title).trim() && !String(obj.content).trim()){
      const i=state.notes.indexOf(obj);
      if(i>=0){ state.notes.splice(i,1); persist("notes"); renderApp(); }
    }
  }
  function save(){
    const title=g("#nfTitle").value, content=g("#nfBody").value;
    if(!obj){
      if(!title.trim() && !content.trim()) return;
      obj={id:uid(),title:"",content:"",color,pinned,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
      state.notes.push(obj);
    }
    obj.title=title; obj.content=content; obj.color=color; obj.pinned=pinned;
    obj.updatedAt=new Date().toISOString();
    persist("notes"); renderApp();
    const ind=g("#nfSave"); ind.textContent="Tersimpan ✓"; ind.classList.add("flash");
    setTimeout(()=>{ ind.textContent="Tersimpan otomatis saat menulis"; ind.classList.remove("flash"); },1400);
  }
  const queueSave=()=>{ clearTimeout(timer); timer=setTimeout(save,550); };
  g("#nfTitle").addEventListener("input",queueSave);
  g("#nfBody").addEventListener("input",queueSave);
  g("#nfColor").addEventListener("click",e=>{
    const b=e.target.closest("[data-c]"); if(!b) return;
    color=b.dataset.c;
    $$(".cp",g("#nfColor")).forEach(x=>x.classList.toggle("sel",x===b));
    if(obj) save();
  });
  g("#nfPin").addEventListener("click",()=>{
    pinned=!pinned;
    g("#nfPin").style.color=pinned?"var(--primary)":"";
    g("#nfPin").style.borderColor=pinned?"var(--primary)":"";
    if(obj) save(); else queueSave();
  });
  g("#nfDone").addEventListener("click",()=>{ clearTimeout(timer); save(); closeModal(); });
  if(n) g("#nfDel").addEventListener("click",async()=>{
    const ok=await confirmDialog({title:"Hapus catatan ini?",message:"Catatan ini akan dihapus permanen."});
    if(!ok) return;
    const i=state.notes.indexOf(obj);
    if(i>=0){ state.notes.splice(i,1); persist("notes"); }
    closeModal(); renderApp(); toast("Catatan dihapus.","success");
  });
  setTimeout(()=>g(n?"#nfBody":"#nfTitle").focus(),80);
}

function applySettings(){
  const s=state.settings, root=document.documentElement;

  root.classList.toggle("no-anim", s.animations===false);

function exportData(){
  try{
    const globals={};   /* v6: data keluarga bersama ikut dalam cadangan */
    ["announcements","annLocal","rewards","redeems","reactions","friends","freqs","gifts"].forEach(k=>{
      try{ const v=JSON.parse(localStorage.getItem("greenday."+k)); if(v!==null) globals[k]=v; }catch(e){}
    });
    const payload={meta:{app:"greenday",version:7,exportedAt:new Date().toISOString()},
      data:{profile:state.profile,settings:state.settings,tasks:state.tasks,journals:state.journals,
        habits:state.habits,events:state.events,notes:state.notes,goals:state.goals,focus:state.focus,notifs:state.notifs,
        xp:state.xp,badgeLog:state.badgeLog,globals}};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`greenday-backup-${isoDate()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Berkas cadangan berhasil diunduh.","success");
  }catch(e){ toast("Gagal membuat berkas cadangan.","error"); }
}
function readBackup(obj){
  if(!isObj(obj)||!isObj(obj.meta)||obj.meta.app!=="greenday"||!isObj(obj.data)) return null;
  const d=obj.data, out={}, counts={};
  let any=false;
  ["tasks","journals","habits","events","notes","goals","focus","notifs","badgeLog"].forEach(k=>{
    if(Array.isArray(d[k])){
      out[k]=d[k].filter(isObj).map(x=>({...x,id:(typeof x.id==="string"&&x.id)?x.id:uid()}));
      counts[k]=out[k].length; any=true;
    }
  });
  if(!any) return null;
  out.profile=isObj(d.profile)?d.profile:null;
  out.settings=isObj(d.settings)?d.settings:null;
  if(typeof d.xp==="number"&&isFinite(d.xp)&&d.xp>=0) out.xp=Math.floor(d.xp);
  if(isObj(d.globals)){    /* v6: data keluarga bersama */
    const g=d.globals, gl={};
    if(Array.isArray(g.announcements)) gl.announcements=g.announcements.filter(isObj);
    if(Array.isArray(g.annLocal))      gl.annLocal=g.annLocal.filter(isObj);
    if(Array.isArray(g.rewards))       gl.rewards=g.rewards.filter(isObj);
    if(Array.isArray(g.redeems))       gl.redeems=g.redeems.filter(isObj);
    if(isObj(g.reactions))             gl.reactions=g.reactions;
    if(isObj(g.friends))               gl.friends=g.friends;          /* v7 */
    if(Array.isArray(g.freqs))         gl.freqs=g.freqs.filter(isObj);
    if(Array.isArray(g.gifts))         gl.gifts=g.gifts.filter(isObj);
    if(Object.keys(gl).length) out.globals=gl;
  }
  return {out,counts};
}
function showImportPreview(parsed){
  const {out,counts}=parsed;
  const label={tasks:"Tugas",journals:"Jurnal",habits:"Kebiasaan",events:"Agenda",notes:"Catatan",goals:"Target",focus:"Sesi fokus",notifs:"Notifikasi",badgeLog:"Lencana"};
  const ov=openModal(`

      <p class="confirm-msg" style="margin-top:14px">Pilih <b>Gabungkan</b> untuk menambahkan item baru tanpa menghapus data lamamu, atau <b>Timpa Semua</b> untuk menggantikan seluruh data saat ini.</p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" data-cancel>Batal</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="impMerge">Gabungkan</button>
      <button type="button" class="btn btn-danger" id="impOverwrite">Timpa Semua</button>
    </div>`);
  ov.querySelector("#impMerge").addEventListener("click",()=>{
    ["tasks","journals","habits","events","notes","goals","focus","notifs","badgeLog"].forEach(k=>{
      if(!out[k]) return;
      const ids=new Set(state[k].map(i=>i.id));
      out[k].forEach(i=>{ if(!ids.has(i.id)) state[k].push(i); });
      persist(k);
    });
    if(out.globals) applyBackupGlobals(out.globals,"merge");
    closeModal(); renderApp();
    toast("Data cadangan berhasil digabungkan.","success");
  });
  ov.querySelector("#impOverwrite").addEventListener("click",()=>{
    ["tasks","journals","habits","events","notes","goals","focus","notifs","badgeLog"].forEach(k=>{
      if(out[k]){ state[k]=out[k]; persist(k); }
    });
    if(out.profile){
      state.profile={...DEFAULTS.profile,...out.profile,onboarded:true};
      persist("profile");
    }
    if(out.settings){
      const s=out.settings, ns={};
      if(s.theme==="light"||s.theme==="dark") ns.theme=s.theme;
      if(["forest","sage","moss"].includes(s.accent)) ns.accent=s.accent;
      if(["panjang","sedang","angka"].includes(s.dateFormat)) ns.dateFormat=s.dateFormat;
      if(typeof s.animations==="boolean") ns.animations=s.animations;
      state.settings={...state.settings,...ns};
      persist("settings"); applySettings();
    }
    if(typeof out.xp==="number"){ state.xp=out.xp; persist("xp"); }
    if(out.globals) applyBackupGlobals(out.globals,"overwrite");
    closeModal(); renderApp();
    toast("Seluruh data berhasil ditimpa dari cadangan.","success");
  });
}

    if(e.key!=="Escape") return;
    const top=modalStack[modalStack.length-1];
    if(top && !top.dataset.locked) closeModal();
  });
  window.addEventListener("hashchange",()=>{
    const p=location.hash.replace("#","");
    if(PAGES[p] && p!==uiState.page){ uiState.page=p; renderApp(); window.scrollTo({top:0}); }
  });
  /* Unggah foto profil (dipangkas & dikompres otomatis agar hemat LocalStorage) */
  el("photoFile").addEventListener("change",e=>{
    const f=e.target.files[0]; e.target.value="";
    if(!f) return;
    processImageFile(f).then(dataUrl=>{
      state.profile.photo=dataUrl;
      persist("profile"); renderApp();
      toast("Foto profil berhasil diperbarui.","success");
    }).catch(err=>{
      toast(err.message||"Gagal memproses gambar.","error");
    });
  });
  /* Impor berkas cadangan */
  el("importFile").addEventListener("change",e=>{
    const f=e.target.files[0]; e.target.value="";
    if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      let obj=null;
      try{ obj=JSON.parse(r.result); }catch(err){ obj=null; }
      const parsed=obj&&readBackup(obj);
      if(!parsed){ toast("Berkas tidak valid. Gunakan cadangan yang diunduh dari GreenDay.","error"); return; }
      showImportPreview(parsed);
    };
    r.onerror=()=>toast("Gagal membaca berkas.","error");
    r.readAsText(f);
  });
}

/* ---------- Impor data keluarga bersama dari cadangan ---------- */
function applyBackupGlobals(gl, mode){
  ["annLocal","rewards","redeems","freqs","gifts"].forEach(k=>{
    if(!Array.isArray(gl[k])) return;
    const cur = (k==="annLocal") ? annLocal : (k==="rewards") ? rewardsList() : (k==="redeems") ? redeemsList() : (k==="freqs") ? freqsList() : giftsList();
    let nw;
    if(mode==="overwrite"){
      nw = gl[k].filter(isObj).map(x=>({...x, id:(typeof x.id==="string"&&x.id)?x.id:uid()}));
    }else{
      nw=[...cur];
      const ids=new Set(cur.map(x=>x.id));
      gl[k].filter(isObj).forEach(x=>{
        const id=(typeof x.id==="string"&&x.id)?x.id:uid();
        if(!ids.has(id)) nw.push({...x, id});
      });
    }
    try{ localStorage.setItem("greenday."+k, JSON.stringify(nw)); }catch(e){}
    if(k==="annLocal") annLocal=nw;
  });
  if(isObj(gl.reactions)){
    let m=reactionsMap();
    if(mode==="overwrite") m={};
    m=Object.assign({}, m, gl.reactions);
    reactionsSave(m);
  }
  if(isObj(gl.friends)){   /* v7: pertemanan sahabat ikut digabung */
    let m=friendsMap();
    if(mode==="overwrite") m={...gl.friends};
    else m=Object.assign({}, m, gl.friends);
    friendsSave(m);
  }
  if(Array.isArray(gl.announcements)){
    try{ localStorage.setItem(ANN_KEY, JSON.stringify(gl.announcements.filter(isObj).slice(0,60))); }catch(e){}
  }
}

/* ---------- Drag & drop: geser kartu tugas untuk menyusun urutan ---------- */
function bindTaskDrag(){
  const wrap=el("taskList"); if(!wrap) return;
  wrap.addEventListener("pointerdown",e=>{
    const h=e.target.closest(".drag-h"); if(!h) return;
    const card=h.closest(".task"); if(!card) return;
    e.preventDefault();
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
    let moved=false, baseY=e.clientY;
    document.body.classList.add("drag-cursor");
    const onMove=ev=>{
      const dy=ev.clientY-baseY;
      if(!moved){ if(Math.abs(dy)<6) return; moved=true; card.classList.add("dragging"); }
      card.style.transform=`translateY(${dy}px)`;
      const cr=card.getBoundingClientRect();
      const mid=cr.top+cr.height/2;
      let target=null;
      for(const sib of wrap.children){
        if(sib===card) continue;
        const sr=sib.getBoundingClientRect();
        if(mid<sr.top+sr.height/2){ target=sib; break; }
      }
      if(target!==card.nextElementSibling && !(target===null && card===wrap.lastElementChild)){
        wrap.insertBefore(card,target);
        card.style.transform="";
        baseY=ev.clientY;
      }
    };
    const finish=cancel=>{
      try{ card.releasePointerCapture(e.pointerId); }catch(err){}
      document.body.classList.remove("drag-cursor");
      card.classList.remove("dragging");
      card.style.transform="";
      wrap.removeEventListener("pointermove",onMove);
      wrap.removeEventListener("pointerup",onUp);
      wrap.removeEventListener("pointercancel",onCancel);
      if(cancel||!moved) return;
      /* terapkan urutan DOM ke state.tasks */
      const ids=[...wrap.querySelectorAll(".task")].map(x=>x.dataset.id);
      const inFilter=new Set(filteredTasks().map(t=>t.id));
      const idxs=[];
      state.tasks.forEach((t,k)=>{ if(inFilter.has(t.id)) idxs.push(k); });
      const byId={};
      state.tasks.forEach(t=>{ byId[t.id]=t; });
      if(ids.length!==idxs.length || ids.some(id=>!byId[id])) return;
      ids.forEach((tid,k)=>{ state.tasks[idxs[k]]=byId[tid]; });
      uiState.tasks.sort="urutanku";
      commit("tasks");
      toast("Urutan tugas disimpan.","success");
    };
    const onUp=()=>finish(false);
    const onCancel=()=>finish(true);
    wrap.addEventListener("pointermove",onMove);
    wrap.addEventListener("pointerup",onUp);
    wrap.addEventListener("pointercancel",onCancel);
  });
}

/* ================= v7: SAHABAT — berteman antar profil di web ini =================
   Data bersama (global, satu perangkat):
     greenday.friends : { userId: [idSahabat, ...] }
     greenday.freqs   : permintaan sahabat yang menunggu jawaban
     greenday.gifts   : kado yang pernah dikirim
   Kartu jarak jauh (per pengguna): greenday.<id>.remoteCards */
const FR_KEY="greenday.friends", FREQ_KEY="greenday.freqs", GIFT_KEY="greenday.gifts";
const KADO_EMOJIS=["🍪","⚡","⭐","🎈","🍫","🧸","🌈","🍀"];
const KADO_COST=5;   /* harga satu kado, dalam poin semangat */
const SAPA_MSGS=[
  "Semangat hari ini! 💪","Ayo kitakan satu tugas dulu! 🔥","Kamu keren — jangan lupa istirahat ya 😊",
  "Sedikit demi sedikit jadi gunung 🏔️","Hari yang baik untuk memulai kebiasaan baru ✨",
  "Jangan nyerah, kamu hampir sampai! 🚀","Semoga harimu lancar semua 🍀",
  "Tugasnya berat? Rehat 5 menit dulu ☕","Kamu lebih hebat dari kemarin 🌱","Kiriman semangat jarak dekat 🤗"
];

function friendsMap(){ try{ const v=JSON.parse(localStorage.getItem(FR_KEY)); if(isObj(v)) return v; }catch(e){} return {}; }
function friendsSave(m){ try{ localStorage.setItem(FR_KEY, JSON.stringify(m)); }catch(e){} }
function myFriends(){
  const reg=new Set(userRegistry().map(u=>u.id));
  const me=currentUser();
  return (friendsMap()[me]||[]).filter(x=>typeof x==="string" && x!==me && reg.has(x));
}
function freqsList(){ try{ const v=JSON.parse(localStorage.getItem(FREQ_KEY)); if(Array.isArray(v)) return v.filter(isObj); }catch(e){} return []; }
function freqsSave(a){ try{ localStorage.setItem(FREQ_KEY, JSON.stringify(a)); }catch(e){} }
function giftsList(){ try{ const v=JSON.parse(localStorage.getItem(GIFT_KEY)); if(Array.isArray(v)) return v.filter(isObj); }catch(e){} return []; }
function giftsSave(a){ try{ localStorage.setItem(GIFT_KEY, JSON.stringify(a)); }catch(e){} }
function remoteCardsList(){ try{ const v=JSON.parse(localStorage.getItem(STORE_PREFIX+"remoteCards")); if(Array.isArray(v)) return v.filter(isObj); }catch(e){} return []; }
function remoteCardsSave(a){ try{ localStorage.setItem(STORE_PREFIX+"remoteCards", JSON.stringify(a)); }catch(e){} }

/* Bersihkan jejak pengguna yang dihapus / di-reset dari data sahabat */
function cleanFriendData(id){
  try{
    const m=friendsMap();
    delete m[id];
    Object.keys(m).forEach(k=>{ if(Array.isArray(m[k])&&m[k].includes(id)) m[k]=m[k].filter(x=>x!==id); });
    friendsSave(m);
    freqsSave(freqsList().filter(f=>f.from!==id&&f.to!==id));
    giftsSave(giftsList().filter(g=>g.from!==id&&g.to!==id));
  }catch(e){}
}

/* ---- Kirim / jawab permintaan sahabat ---- */
function frSendRequest(toId){
  const me=currentUser();
  if(!toId||toId===me) return;
  if(myFriends().includes(toId)){ toast("Kalian sudah sahabat!","info"); return; }
  const fq=freqsList();
  if(fq.some(f=>(f.from===me&&f.to===toId)||(f.from===toId&&f.to===me))){
    toast("Permintaan sudah ada — tunggu jawabannya ya.","info"); return;
  }
  const tp=userProfileOf(toId)||{};
  const fid=uid();
  fq.push({id:fid, from:me, fromName:state.profile.name||"Anggota", fromAv:state.profile.avatar||"🌱",
           to:toId, toName:tp.name||"Tanpa nama", ts:Date.now()});
  if(fq.length>40) fq.length=40;
  freqsSave(fq);
  notifyUser(toId,{type:"freq", title:"Permintaan sahabat dari "+(state.profile.name||"Anggota"),
    body:"Ketuk Terima untuk saling mengirim kado & sapaan — atau Tolak kalau belum mau.",
    icon:"users", page:"sahabat", fid});
  ting(); renderApp();
  toast("Ajakan terkirim! Dia akan menjawab lewat lonceng notifikasinya.","success");
}
function ncMarkFreqDone(fid, txt){
  const n=state.notifs.find(x=>x.fid===fid);
  if(!n) return;
  n.body=txt||"Permintaan sudah ditanggapi.";
  n.read=true;
  persist("notifs"); updateBellBadge();
}
function ncPanelRefresh(){
  const body=document.querySelector(".modal #ncBody");
  if(!body) return;
  body.innerHTML=ncListHTML();
  const tabs=document.querySelector(".modal #ncTabs");
  if(tabs){
    const counts={semua:state.notifs.length};
    NC_TABS.slice(1).forEach(([,id])=>{ counts[id]=state.notifs.filter(n=>ncCat(n.type)===id).length; });
    tabs.innerHTML=NC_TABS.map(([id,lab])=>`<button class="nc-tab ${uiState.ncTab===id?"sel":""}" data-action="nc-tab" data-val="${id}">${lab}${counts[id]?`<span class="nc-count">${counts[id]}</span>`:""}</button>`).join("");
  }
}
function frAccept(fid){
  if(typeof fid==="string" && fid.indexOf("net:")===0){ onlAcceptReq(fid.slice(4)); return; }
  const me=currentUser();
  const fq=freqsList();
  const f=fq.find(x=>x.id===fid);
  if(!f){ ncMarkFreqDone(fid,"Permintaan sudah tidak berlaku."); ncPanelRefresh(); renderApp();
          toast("Permintaan itu sudah tidak berlaku.","info"); return; }
  if(f.to!==me){ toast("Hanya penerima ajakan yang bisa menjawab.","error"); return; }
  freqsSave(fq.filter(x=>x.id!==fid));
  const m=friendsMap();
  const add=(a,b)=>{ const s=new Set(m[a]||[]); s.add(b); m[a]=[...s]; };
  add(f.from,f.to); add(f.to,f.from);
  friendsSave(m);
  notifyUser(f.from,{type:"freqres", title:(state.profile.name||"Anggota")+" menerima ajakanmu 🎉",
    body:"Kalian sekarang sahabat! Kirim kado atau sapaan lewat halaman Sahabat.",
    icon:"users", page:"sahabat"});
  ncMarkFreqDone(fid,"Sudah diterima — kalian sahabat sekarang 🎉");
  confetti(); ting(); ncPanelRefresh(); renderApp();
  toast("Kalian sekarang sahabat! 🎉","success");
}
function frReject(fid){
  if(typeof fid==="string" && fid.indexOf("net:")===0){ onlRejectReq(fid.slice(4)); return; }
  const fq=freqsList();
  const f=fq.find(x=>x.id===fid);
  freqsSave(fq.filter(x=>x.id!==fid));
  if(f&&f.from){
    notifyUser(f.from,{type:"freqres", title:"Ajakan sahabat belum diterima",
      body:(state.profile.name||"Anggota")+" belum menerima ajakanmu. Tidak apa-apa — coba lagi nanti!",
      icon:"users", page:"sahabat"});
  }
  ncMarkFreqDone(fid,"Kamu menolak ajakan ini.");
  ncPanelRefresh(); renderApp();
  toast("Ajakan ditolak.","info");
}
function frCancel(fid){
  if(typeof fid==="string" && fid.indexOf("net:")===0){ onlCancelReq(fid.slice(4)); return; }
  freqsSave(freqsList().filter(x=>x.id!==fid));

}
async function removeFriend(id){
  /* v8: lepas sahabat jauh — lewat cloud */
  if(typeof id==="string" && id.indexOf("net:")===0){
    const d=frReadUser(id);
    const ok=await confirmDialog({title:"Lepas sahabat jauh ini?",
      message:"Kamu dan \""+(d.name||"sahabat itu")+"\" tidak lagi terhubung sebagai sahabat jauh. Dia bisa diajak lagi kapan saja lewat Kode Sahabat.",
      confirmLabel:"Ya, lepas"});
    if(!ok) return;
    try{ await api("/friends/remove",{method:"POST",body:JSON.stringify({userId:id.slice(4)})}); }catch(e){}
    await onlPoll();
    renderApp();
    toast("Sahabat jauh dilepas.","info");
    return;
  }
  const d=frReadUser(id);
  const ok=await confirmDialog({title:"Lepas sahabat ini?",
    message:"Kamu dan \""+(d.name||"sahabat itu")+"\" tidak lagi terhubung sebagai sahabat. Riwayat kado & sapaan tetap tersimpan.",
    confirmLabel:"Ya, lepas"});
  if(!ok) return;
  const m=friendsMap(), me=currentUser();
  m[me]=(m[me]||[]).filter(x=>x!==id);
  m[id]=(m[id]||[]).filter(x=>x!==me);
  friendsSave(m);
  renderApp();
  toast("Sahabat dilepas.","info");
}

/* ---- Baca ringkasan profil pengguna lain (kartu sahabat) ---- */
function frReadUser(id){
  /* v8: sahabat jauh — baca dari cache GreenDay Online, bukan localStorage */
  if(typeof id==="string" && id.indexOf("net:")===0){
    const oc=onlCacheLoad()||{};
    const p=(oc.friends||[]).find(f=>("net:"+f.id)===id);
    if(!p) return {name:"Sahabat jauh", av:"🌐", photo:null, xp:0, li:0, title:LEVELS[0][0],
                   streak:0, badges:0, done7:0, days:[], net:true, lastSeen:null};
    const li=Math.max(0,Math.min(+(p.level)||0, LEVELS.length-1));
    return {name:p.name||"Sahabat", av:p.avatar||"🌱", photo:null,
            xp:Math.max(0,+(p.xp)||0), li, title:LEVELS[li][0],
            streak:Math.max(0,+(p.streak)||0), badges:Math.max(0,+(p.badges)||0),
            done7:Math.max(0,+(p.done7)||0),
            days:Array.isArray(p.days)?p.days.slice(0,14).map(x=>Math.max(0,+x||0)):[],
            net:true, lastSeen:p.lastSeen||null};
  }
  const isActive=id===currentUser();
  const read=k=>{ try{ return JSON.parse(localStorage.getItem("greenday."+id+"."+k)); }catch(e){ return null; } };
  const prof=isActive?state.profile:(read("profile")||{});
  const tasks=isActive?state.tasks:(read("tasks")||[]);
  const journals=isActive?state.journals:(read("journals")||[]);
  const habits=isActive?state.habits:(read("habits")||[]);
  const focus=isActive?state.focus:(read("focus")||[]);
  let xp=isActive?state.xp:read("xp");
  if(typeof xp!=="number"||!isFinite(xp)||xp<0)
    xp=xpFromHistory({tasks:Array.isArray(tasks)?tasks:[],journals:Array.isArray(journals)?journals:[],
                      habits:Array.isArray(habits)?habits:[],focus:Array.isArray(focus)?focus:[]});
  const badges=(isActive?state.badgeLog:(read("badgeLog")||[])).length;
  const score={};
  const bump=(ds,n)=>{ if(typeof ds==="string"&&ds) score[ds]=(score[ds]||0)+n; };
  (Array.isArray(tasks)?tasks:[]).forEach(t=>{ if(t&&t.done&&t.completedAt) bump(isoDate(new Date(t.completedAt)),1); });
  (Array.isArray(journals)?journals:[]).forEach(j=>{ if(j) bump(j.date,1); });
  (Array.isArray(habits)?habits:[]).forEach(h=>{ (h&&Array.isArray(h.dates)?h.dates:[]).forEach(ds=>bump(ds,1)); });
  (Array.isArray(focus)?focus:[]).forEach(f=>{ if(f) bump(f.date,1); });
  const act=ds=>!!score[ds];
  let streak=0; const sd=new Date();
  if(!act(isoDate(sd))) sd.setDate(sd.getDate()-1);
  while(act(isoDate(sd))){ streak++; sd.setDate(sd.getDate()-1); }
  const week=lastNDates(7);
  const done7=(Array.isArray(tasks)?tasks:[]).filter(t=>t.done&&t.completedAt&&week.includes(isoDate(new Date(t.completedAt)))).length;
  const days=[]; const start=new Date(); start.setDate(start.getDate()-13);
  const end=new Date();
  for(let dd=new Date(start); dd<=end; dd.setDate(dd.getDate()+1)) days.push(score[isoDate(dd)]||0);
  const li=xpLevel(xp);
  return {name:(prof&&prof.name)||"Tanpa nama", av:(prof&&prof.avatar)||"🌱", photo:(prof&&prof.photo)||null,
          xp:Math.max(0,Math.round(xp)), li, title:LEVELS[li][0], streak, badges, done7, days};
}

  }
  let icon=KADO_EMOJIS[0];

      <button class="icon-btn sm" data-close-x aria-label="Tutup">${ic("x",17)}</button></div>

        <input class="inp" id="kadoMsg" maxlength="120" placeholder="Misal: Semangat ujiannya ya!"></div>
      <p class="hint" style="margin:0">Kado memakai <b>${KADO_COST} poin</b> dari ${state.xp} poinmu — ${esc(d.name)} menerimanya lewat lonceng notifikasi.</p>
      <p class="form-err" id="kadoErr"></p>
    </form>
    <div class="modal-foot">
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" data-cancel>Batal</button>
      <button type="submit" form="kadoForm" class="btn btn-primary">${ic("gift",15)} Kirim (${KADO_COST} poin)</button>
    </div>`);
  const g=s=>ov.querySelector(s);
  g("#kadoEmojis").addEventListener("click",e=>{
    const b=e.target.closest("[data-e]"); if(!b) return;
    icon=b.dataset.e;
    $$("button",g("#kadoEmojis")).forEach(x=>x.classList.toggle("sel",x===b));
  });
  g("#kadoForm").addEventListener("submit",e=>{
    e.preventDefault();
    if((state.xp||0)<KADO_COST){ g("#kadoErr").textContent="Poinmu berubah — sekarang tidak cukup untuk kirim kado."; return; }
    const msg=g("#kadoMsg").value.trim().slice(0,120);
    /* v8: kado ke sahabat jauh — lewat cloud, poin tetap dipotong lokal */
    if(typeof id==="string" && id.indexOf("net:")===0){
      awardXP(-KADO_COST,{quiet:true});
      onlSendGift(id.slice(4), icon, msg)
        .then(()=>{
          closeModal(); renderApp(); ting();
          toast("Kado "+icon+" terkirim ke "+d.name+" — nyampe walau beda HP! 🌍","success");
        })
        .catch(e2=>{
          awardXP(KADO_COST,{quiet:true});   /* gagal terkirim: poin kembali */
          g("#kadoErr").textContent=onlErrMsg(e2);
        });
      return;
    }
    awardXP(-KADO_COST,{quiet:true});
    const gl=giftsList();
    gl.unshift({id:uid(), from:currentUser(), fromName:state.profile.name||"Anggota",
      fromAv:state.profile.avatar||"🌱", to:id, icon, msg, ts:Date.now()});
    if(gl.length>80) gl.length=80;
    giftsSave(gl);
    notifyUser(id,{type:"kado", title:"Kado dari "+(state.profile.name||"Anggota")+": "+icon,
      body:msg?snippet(msg,120):"Sekadar menyemangati harimu! Buka halaman Sahabat untuk melihatnya.",
      icon:"gift", page:"sahabat"});
    closeModal(); renderApp(); ting();
    toast("Kado "+icon+" terkirim ke "+d.name+"!","success");
  });
  setTimeout(()=>g("#kadoMsg").focus(),80);
}

      x:Math.max(0,+data.x||0), l:Math.max(0,+data.l||0), t:String(data.t||"").slice(0,20),
      s:Math.max(0,+data.s||0), b:Math.max(0,+data.b||0),
      d:Array.isArray(data.d)?data.d.slice(0,14).map(x=>Math.max(0,+x||0)):[], ts:Date.now()});
    if(cards.length>12) cards.length=12;
    remoteCardsSave(cards);
    closeModal(); renderApp();
    toast("Kartu "+nm+" berhasil diimpor ke Sahabat Jauh!","success");
  });
  setTimeout(()=>g("#scIn").focus(),80);
}

/* ================= v8: MODE JARAK JAUH — sahabat beda HP via GreenDay Online =================
   Cara kerja:
   - Akun kecil di server (username "Kode Sahabat" + PIN) untuk tiap profil lokal.
   - Yang dikirim ke cloud HANYA snapshot profil: nama, avatar, poin, level,
     streak, lencana, dan 14 hari terakhir. Isi tugas/jurnal TETAP di HP sendiri.
   - Polling /api/sync tiap 15 detik (saat tab terlihat & online) untuk:
     permintaan sahabat, kado, sapaan, dan profil sahabat jauh terbaru.
   - Sahabat jauh diberi prefix id "net:" agar bisa dibedakan dari sahabat
     satu perangkat di frReadUser / kartu / kado / sapa / papan peringkat. */
const ONL_POLL_MS = 15000;
let onlTimer=null, onlPushTimer=null, onlLastPush=0, onlLastSync=0, onlOk=null, onlBound=false, onlFirstSync=true;
let OC=null;   /* cache jawaban /api/sync terakhir */

function onlKey(){ return STORE_PREFIX+"online"; }
function onlLoad(){
  try{ const v=JSON.parse(localStorage.getItem(onlKey()));
       if(isObj(v)&&typeof v.t==="string"&&v.t&&typeof v.u==="string"&&v.u) return v; }catch(e){}
  return null;
}
function onlSave(c){ try{ localStorage.setItem(onlKey(), JSON.stringify(c)); }catch(e){} }
function onlClear(){
  try{ localStorage.removeItem(onlKey());
       localStorage.removeItem(STORE_PREFIX+"oc");
       localStorage.removeItem(STORE_PREFIX+"onlSeen"); }catch(e){}
}
function onlCacheLoad(){
  if(OC) return OC;
  try{ const v=JSON.parse(localStorage.getItem(STORE_PREFIX+"oc")); if(isObj(v)){ OC=v; return v; } }catch(e){}
  return null;
}
function onlCacheSave(d){ OC=d; try{ localStorage.setItem(STORE_PREFIX+"oc", JSON.stringify(d)); }catch(e){} }
function onlSeen(){
  try{ const v=JSON.parse(localStorage.getItem(STORE_PREFIX+"onlSeen"));
       if(isObj(v)) return {f:v.f||{},r:v.r||{},g:v.g||{},s:v.s||{}}; }catch(e){}
  return {f:{},r:{},g:{},s:{}};
}
function onlSeenSave(s){ try{ localStorage.setItem(STORE_PREFIX+"onlSeen", JSON.stringify(s)); }catch(e){} }

function onlErrMsg(e){
  if(e&&e.status){
    if(e.status===401) return "Sesi/PIN tidak dikenali — coba masuk lagi.";
    if(e.status===404&&e.message==="nouser") return "Kode Sahabat itu belum terdaftar. Pastikan temanmu sudah mengaktifkan Mode Jarak Jauh.";
    if(e.status===409&&e.message==="taken") return "Kode Sahabat itu sudah dipakai — coba kode lain, atau pilih Masuk kalau itu punyamu.";
    if(e.status===409&&e.message==="already") return "Kalian sudah sahabat!";
    if(e.status===409&&e.message==="pending") return "Permintaan sudah ada — tunggu jawabannya ya.";
    if(e.status===403) return "Kalian belum menjadi sahabat.";
    if(e.status===429) return "Terlalu banyak terkirim hari ini — coba lagi besok ya.";
    if(/^HTTP \d+$/.test(String(e.message||"")))
      return "Server GreenDay Online tidak ada di tempat ini (galat "+e.status+"). Kalau GreenDay dibuka lewat GitHub Pages atau berkas, Mode Jarak Jauh tidak bisa jalan — pakai link GreenDay Online ya.";
    return "GreenDay Online menolak: "+e.message;
  }
  if(location.protocol==="file:")
    return "Mode Jarak Jauh butuh GreenDay Online — buka lewat link web-nya (bukan berkas offline), ya.";
  return "Tidak bisa menghubungi GreenDay Online — cek internetmu lalu coba lagi.";
}

/* ---- klien API (selalu origin yang sama) ---- */
function api(path, opts){
  const c=onlLoad();
  return fetch("/api"+path, Object.assign({}, opts||{}, {
    headers: Object.assign({"Content-Type":"application/json"}, (opts&&opts.headers)||{},
                            (c&&c.t)?{Authorization:"Bearer "+c.t}:{})
  })).then(r=>r.json().catch(()=>({})).then(j=>{
    if(!r.ok){ const e=new Error(String((j&&j.error)||("HTTP "+r.status))); e.status=r.status; throw e; }
    return j;
  }));
}

/* ---- dorong snapshot profil ke cloud ---- */
function onlPush(force){
  const c=onlLoad(); if(!c) return Promise.resolve(false);
  if(force!==true && Date.now()-onlLastPush<45000) return Promise.resolve(false);
  const me=frReadUser(currentUser());
  return api("/profile",{method:"POST",body:JSON.stringify({
    name:me.name, avatar:me.av, xp:me.xp, level:me.li, streak:me.streak,
    done7:me.done7, badges:me.badges, days:me.days
  })}).then(()=>{ onlLastPush=Date.now(); if(onlOk!==true){ onlOk=true; onlStatusPaint(); } return true; })
     .catch(e=>{ if(e&&e.status===401) onlDead(); else { onlOk=false; onlStatusPaint(); } return false; });
}
function onlPushSoon(){
  if(!onlLoad()) return;
  clearTimeout(onlPushTimer);
  onlPushTimer=setTimeout(()=>onlPush(true), 4000);
}

/* ---- tarik data sosial terbaru ---- */
function onlPoll(){
  const c=onlLoad(); if(!c) return Promise.resolve(null);
  if(!navigator.onLine){ onlOk=false; onlStatusPaint(); return Promise.resolve(null); }
  return api("/sync").then(d=>{ onlApply(d); return d; })
    .catch(e=>{ if(e&&e.status===401) onlDead(); else { onlOk=false; onlStatusPaint(); } return null; });
}

function onlFriendsSig(d){ return JSON.stringify(((d||{}).friends||[]).map(f=>f.id+":"+f.xp+":"+f.done7+":"+f.level)); }

function onlApply(d){
  const prevSig=onlFriendsSig(OC);
  onlCacheSave(d);
  onlOk=true; onlLastSync=Date.now();
  const seen=onlSeen();
  if(onlFirstSync){
    /* sinkron pertama setelah masuk: tandai semua yang ada agar tidak membanjiri notifikasi */
    (d.friends||[]).forEach(f=>seen.f[f.id]=1);
    (d.reqIn||[]).forEach(r=>seen.r[r.id]=1);
    (d.gifts||[]).forEach(g=>seen.g[g.id]=1);
    (d.sapa||[]).forEach(s=>seen.s[s.id]=1);
    onlFirstSync=false;
  }else{
    (d.friends||[]).forEach(f=>{ if(!seen.f[f.id]){ seen.f[f.id]=1;
      notifyUser(currentUser(),{type:"freqres", title:(f.name||"Sahabat")+" sekarang sahabatmu 🎉",
        body:"Kalian terhubung lewat Mode Jarak Jauh — kirim kado atau sapaan lewat halaman Sahabat.",
        icon:"users", page:"sahabat"});
      confetti(); ting();
    }});
    (d.reqIn||[]).forEach(r=>{ if(!seen.r[r.id]){ seen.r[r.id]=1;
      notifyUser(currentUser(),{type:"freq", title:"Permintaan sahabat dari "+((r.from&&r.from.name)||"Sahabat"),
        body:"Sahabat beda HP! Ketuk Terima untuk saling mengirim kado & sapaan — atau Tolak kalau belum mau.",
        icon:"users", page:"sahabat", fid:"net:"+r.id});
    }});
    (d.gifts||[]).forEach(g=>{ if(!seen.g[g.id]){ seen.g[g.id]=1;
      notifyUser(currentUser(),{type:"kado", title:"Kado dari "+((g.from&&g.from.name)||"Sahabat")+": "+(g.icon||"🎁"),
        body:g.msg?snippet(g.msg,120):"Sekadar menyemangati harimu! Buka halaman Sahabat untuk melihatnya.",
        icon:"gift", page:"sahabat"});
      ting();
    }});
    (d.sapa||[]).forEach(s=>{ if(!seen.s[s.id]){ seen.s[s.id]=1;
      notifyUser(currentUser(),{type:"sapa", title:"Sapaan dari "+((s.from&&s.from.name)||"Sahabat"),
        body:s.msg||"Semangat hari ini!", icon:"heart", page:"sahabat"});
      ting();
    }});
  }
  onlSeenSave(seen);
  onlStatusPaint();
  onlBoxRefresh();     /* perbarui seksi Jarak Jauh tanpa merender ulang kolom input */
  ncPanelRefresh();    /* bila panel notifikasi terbuka, baris freq/kado ikut segar */
  updateBellBadge();
  /* papan sahabat memakai data cloud → segarkan Statistik bila berubah */
  if(uiState.page==="stats" && uiState.lbMode==="sahabat" && onlFriendsSig(d)!==prevSig && !modalStack.length) renderApp();
}

function onlStatusPaint(){
  const dot=document.getElementById("onlDot"), tx=document.getElementById("onlStatusTx");
  if(!dot||!tx) return;
  dot.className="onl-dot"+(onlOk===true?" ok":"");
  tx.textContent = onlOk===true ? ("Terhubung ke GreenDay Online · "+(onlLastSync?relTime(onlLastSync):"baru saja"))
                : onlOk===false ? "Offline — nanti disambung lagi otomatis"
                : "Menyambung…";
}

/* perbarui hanya bagian dinamis #onlDyn — kolom ajak (#olCode) tidak tersentuh */
function onlBoxRefresh(){
  const dyn=document.getElementById("onlDyn");
  if(!dyn) return;
  dyn.innerHTML=onlDynHTML();
  onlStatusPaint();
}

/* ---- hidupkan / matikan mesin sinkron ---- */
function onlStart(){
  onlStop();
  onlCacheLoad();
  onlPush(true); onlPoll();
  onlTimer=setInterval(()=>{
    if(!onlLoad()||document.visibilityState!=="visible") return;
    onlPush(false); onlPoll();
  }, ONL_POLL_MS);
  if(!onlBound){
    onlBound=true;
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&onlLoad()) onlPoll(); });
    window.addEventListener("online",()=>{ if(onlLoad()){ onlOk=null; onlStatusPaint(); onlPush(true); onlPoll(); } });
    window.addEventListener("offline",()=>{ onlOk=false; onlStatusPaint(); });
  }
}
function onlStop(){
  if(onlTimer){ clearInterval(onlTimer); onlTimer=null; }
  clearTimeout(onlPushTimer); onlPushTimer=null;
}
function onlInit(){
  onlFirstSync=true;
  if(onlLoad()) onlStart();
  else { onlStop(); OC=null; onlOk=null; }
}

/* sesi mati (token tak dikenali lagi) — akun cloud tetap aman, tinggal masuk lagi */
function onlDead(){
  onlClear(); onlStop(); OC=null; onlOk=null;
  renderApp();
  toast("Sesi Jarak Jauh berakhir — masuk lagi dengan Kode Sahabat & PIN-mu.","error");
  setTimeout(()=>{ if(!modalStack.length) openOnlModal("masuk"); }, 600);
}

async function onlLogout(){
  const ok=await confirmDialog({title:"Keluar dari Mode Jarak Jauh?",
    message:"Profil ini berhenti tersinkron dengan GreenDay Online. Akun dan sahabat jauh-mu tetap tersimpan di cloud — kamu bisa masuk lagi kapan saja dengan Kode Sahabat dan PIN yang sama.",
    confirmLabel:"Ya, keluar"});
  if(!ok) return;
  if(onlLoad()){ try{ await api("/auth/logout",{method:"POST"}); }catch(e){} }
  onlClear(); onlStop(); OC=null; onlOk=null;
  renderApp();
  toast("Mode Jarak Jauh dimatikan untuk profil ini.","info");
}

/* ---- kirim kado / sapaan ke sahabat jauh ---- */
function onlSendGift(fuid, icon, msg){
  return api("/gift",{method:"POST",body:JSON.stringify({toId:fuid,icon,msg})})
    .then(()=>onlPush(true));
}
function onlSendSapa(fuid, msg){
  return api("/sapa",{method:"POST",body:JSON.stringify({toId:fuid,msg})});
}

/* ---- jawab permintaan (Terima / Tolak / Batal) ---- */
function onlAcceptReq(reqId){
  const oc=onlCacheLoad()||{};
  const r=(oc.reqIn||[]).find(x=>x.id===reqId);
  api("/friends/accept",{method:"POST",body:JSON.stringify({id:reqId})})
    .then(()=>{
      if(r&&r.from&&r.from.id){ const seen=onlSeen(); seen.f[r.from.id]=1; onlSeenSave(seen); }
      ncMarkFreqDone("net:"+reqId,"Sudah diterima — kalian sahabat sekarang 🎉");
      return onlPoll();
    })
    .then(()=>{
      confetti(); ting(); ncPanelRefresh(); renderApp();
      toast("Kalian sekarang sahabat! 🎉","success");
    })
    .catch(e2=>{
      ncMarkFreqDone("net:"+reqId,"Permintaan sudah tidak berlaku.");
      ncPanelRefresh(); toast(onlErrMsg(e2),"error");
    });
}
function onlRejectReq(reqId){
  api("/friends/reject",{method:"POST",body:JSON.stringify({id:reqId})})
    .then(()=>{ ncMarkFreqDone("net:"+reqId,"Kamu menolak ajakan ini."); return onlPoll(); })
    .then(()=>{ ncPanelRefresh(); renderApp(); toast("Ajakan ditolak.","info"); })
    .catch(e2=>toast(onlErrMsg(e2),"error"));
}
function onlCancelReq(reqId){
  api("/friends/cancel",{method:"POST",body:JSON.stringify({id:reqId})})
    .then(()=>onlPoll())
    .then(()=>{ renderApp(); toast("Ajakan sahabat dibatalkan.","info"); })
    .catch(e2=>toast(onlErrMsg(e2),"error"));
}

/* ---- ajak lewat kolom kode ---- */
function onlAddFromInput(){
  const inp=document.getElementById("olCode");
  if(!inp) return;
  const user=String(inp.value||"").trim().toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(user)){
    toast("Tulis Kode Sahabat temanmu dulu (huruf kecil, tanpa spasi).","error");
    inp.focus(); return;
  }
  api("/friends/request",{method:"POST",body:JSON.stringify({username:user})})
    .then(()=>{
      inp.value="";
      ting();
      toast("Ajakan terkirim ke @"+user+"! Dia menjawabnya di HP-nya sendiri.","success");
      onlPoll();
    })
    .catch(e2=>toast(onlErrMsg(e2),"error"));
}

/* ---- salin kode sahabat ---- */
function onlCopyCode(code){
  const txt=String(code||"");
  const ok=()=>{ toast("Kode Sahabat \""+txt+"\" tersalin! Kirim ke temanmu lewat WhatsApp. 💬","success"); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(()=>onlCopyFallback(txt,ok));
  }else onlCopyFallback(txt,ok);
}
function onlCopyFallback(txt,ok){
  try{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    ok();
  }catch(e){ toast("Salin manual ya: "+txt,"info"); }
}

/* v8b: cek dulu apakah server GreenDay Online ada di origin ini —
   kalau tidak, tampilkan peringatan ramah SEBELUM anak mengisi formulir,
   bukan menunggu galat HTTP 404 yang membingungkan setelah tombol ditekan. */
function onlPingCheck(ov){
  const box=ov.querySelector("#olPing");
  if(!box) return;
  const say=t=>{ box.innerHTML=t; box.hidden=false; };
  if(location.protocol==="file:"){
    say("<b>GreenDay dibuka sebagai berkas offline.</b> Mode Jarak Jauh hanya jalan di <b>link GreenDay Online</b> — bukan di berkas.");
    return;
  }
  fetch("/api/ping",{cache:"no-store"})
    .then(r=>r.json().catch(()=>null))
    .then(j=>{
      if(j&&j.ok===true) return; /* server ada — tidak perlu peringatan */
      const gh=/\.github\.io$/.test(location.hostname);
      say(gh
        ? "<b>Ini GitHub Pages — di sini tidak ada GreenDay Online.</b> Alamat .github.io hanya menyimpan halaman GreenDay, bukan server sahabatnya, jadi Buat Akun selalu gagal (HTTP 404). Buka GreenDay lewat <b>link GreenDay Online</b> (dari obrolan tempat kamu dapat GreenDay) supaya bisa berteman beda HP."
        : "<b>Server GreenDay Online tidak terdeteksi di sini.</b> Tempat ini sepertinya hanya menyimpan halaman GreenDay (tanpa server), atau servernya sedang tidak aktif. Buat Akun bisa gagal — pastikan kamu membuka lewat <b>link GreenDay Online</b>.");
    })
    .catch(()=>{
      say("<b>Tidak bisa menjangkau GreenDay Online.</b> Cek internetmu — atau servernya sedang istirahat. Coba lagi nanti ya.");
    });
}

/* ================= PENGUMUMAN =================
   Konten diambil dari berkas "pengumuman.json" (folder yang sama dengan

const ANN_KEY = "greenday.announcements"; /* global: dibagikan ke semua profil */
const ANN_LOCAL_KEY = "greenday.annLocal"; /* v6: pengumuman buatan keluarga (dari dalam aplikasi) */
let annItems = [];
let annLocal = [];
try {
  const _al = JSON.parse(localStorage.getItem(ANN_LOCAL_KEY));

/* gabungan pengumuman: buatan keluarga + berkas admin, terbaru duluan */
function annAll(){
  const seen=new Set(), out=[];
  for(const a of [...annLocal, ...annItems]){
    if(a && a.id && !seen.has(a.id)){ seen.add(a.id); out.push(a); }
  }
  return out.filter(a=>a.active!==false)
            .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
}
try {
  const _cached = JSON.parse(localStorage.getItem(ANN_KEY));
  if (Array.isArray(_cached)) annItems = _cached.filter(isObj);

function annCardHTML() {

/* Beri tahu pengguna untuk pengumuman yang belum pernah dilihat (per profil). */
function annNotify(items){
  if(state.settings.notifAnn===false) return;
  const seenKey = STORE_PREFIX + "annSeen";
  let seen = null;
  try{ seen = JSON.parse(localStorage.getItem(seenKey)); }catch(e){ seen = null; }
  if(!Array.isArray(seen)){
    /* pertama kali: tandai semua yang ada agar tidak membanjiri notifikasi lama */
    try{ localStorage.setItem(seenKey, JSON.stringify(items.filter(a=>a.active!==false).map(a=>a.id))); }catch(e){}
    return;
  }
  const fresh = items.filter(a=>a.active!==false && !seen.includes(a.id));
  if(!fresh.length) return;
  for(const a of fresh.slice(0,3)){
    const added = NC.add({ type:"ann", title:"Pengumuman baru: "+a.title,
      body: a.body ? snippet(a.body, 120) : "Buka GreenDay untuk membaca pengumuman lengkapnya.",
      icon:"sparkle", page:"home", dedupKey:"ann|"+a.id });
    if(added) seen.push(a.id);
  }
  try{ localStorage.setItem(seenKey, JSON.stringify(seen)); }catch(e){}
}

function annFetch() {
  fetch("pengumuman.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("tidak ada"); return r.json(); })
    .then(obj => {
      if (!isObj(obj) || !Array.isArray(obj.items)) return;
      const items = obj.items.filter(isObj).map(x => ({
        id: (typeof x.id === "string" && x.id) ? x.id : uid(),
        title: String(x.title || "").slice(0, 120),
        body: String(x.body || "").slice(0, 1000),
        date: (typeof x.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x.date)) ? x.date : "",
        active: x.active !== false,
        penting: x.penting === true
      }));
      if (JSON.stringify(items) !== JSON.stringify(annItems)) {
        annItems = items;
        try { localStorage.setItem(ANN_KEY, JSON.stringify(items)); } catch (e) {}
        annNotify(annAll());   /* v6: pengumuman berkas admin + buatan keluarga */
        renderApp();
      }
    })
    .catch(() => { /* offline / berkas belum ada: pengumuman terakhir tetap tampil */ });
}

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){
        console.log("Service worker tidak aktif — buka lewat HTTPS agar mode offline siap.");
      });
    });
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPrompt = e;
    if (fab) fab.hidden = false;
  });

  if (fab) fab.addEventListener("click", function(){
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){
      deferredPrompt = null;
      fab.hidden = true;
    });
  });

  window.addEventListener("appinstalled", function(){
    if (fab) fab.hidden = true;
  });
})();
</script>
</body>
</html>
