<!DOCTYPE html>
<html lang="id" data-theme="light" data-accent="forest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d7148">
<title>GreenDay — Daily List & Personal Productivity</title>
<meta name="description" content="GreenDay v6: tugas, jurnal, kebiasaan, kalender, catatan, target, timer fokus, popup notifikasi Beranda, poin & level, toko hadiah, reaksi keluarga, heatmap — produktivitas harian keluarga.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GreenDay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GreenDay — Design Tokens
   ============================================================ */
:root{
  --bg:#edf3ec; --surface:#ffffff; --surface-2:#e6efe5; --line:#dce6db; --line-strong:#c2d2c3;
  --text:#15231b; --muted:#586c5f; --faint:#879a8d;
  --primary:#0f8a55; --primary-strong:#0c7246; --primary-soft:#d9f1e3; --on-primary:#f2fbf6;
  --grad-a:#0d7148; --grad-b:#33c17f;
  --hero:#113f2c; --hero-ink:#edf8f0; --hero-accent:#9fe3bb;
  --amber:#9a6a13; --amber-soft:#f6ecd4;
  --red:#b34532; --red-soft:#f8e2db;
  --teal:#2c6e79; --teal-soft:#dfeef1;
  --radius:20px;
  --shadow:0 1px 2px rgba(24,42,32,.04), 0 18px 42px -24px rgba(24,42,32,.28);
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#0f1712; --surface:#182219; --surface-2:#212d24; --line:#2a382c; --line-strong:#3b4b3e;
  --text:#e6ede6; --muted:#9aafa0; --faint:#71857a;
  --primary:#4fb385; --primary-strong:#6bc79a; --primary-soft:#1d3527; --on-primary:#0d1a12;
  --grad-a:#155c40; --grad-b:#2e9e6b;
  --hero:#152f23; --hero-ink:#e8f4ea; --hero-accent:#8ed3a9;
  --amber:#d7a45a; --amber-soft:#382e19;
  --red:#dd8068; --red-soft:#3c241d;
  --teal:#6fb3bd; --teal-soft:#1c3236;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 42px -22px rgba(0,0,0,.55);
}
[data-accent="sage"]{ --primary:#4f8672; --primary-strong:#3f6f5c; --primary-soft:#e2ebe6; --grad-a:#3f6f5c; --grad-b:#7fb69e; --hero:#2f5448; --hero-accent:#b3dcc9; }
[data-theme="dark"][data-accent="sage"]{ --primary:#8cbcaa; --primary-strong:#a4cdba; --primary-soft:#20342c; --grad-a:#2e5a48; --grad-b:#63a288; --hero:#27453b; --hero-accent:#a8d8c3; }
[data-accent="moss"]{ --primary:#5c7034; --primary-strong:#495a29; --primary-soft:#eaedd8; --grad-a:#495a29; --grad-b:#93ac59; --hero:#3a4720; --hero-accent:#d4e197; }
[data-theme="dark"][data-accent="moss"]{ --primary:#a4b56a; --primary-strong:#b6c684; --primary-soft:#2b3220; --grad-a:#4a5426; --grad-b:#8fa04f; --hero:#3a4420; --hero-accent:#cddf8e; }

/* ============================================================
   Base
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 "Plus Jakarta Sans",ui-sans-serif,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:var(--primary-soft)}
h1,h2,h3,h4{font-weight:600}
.ic{flex:none;vertical-align:middle}
main:focus{outline:none}

/* Layout */
.main{min-height:100dvh;padding:16px 16px calc(114px + env(safe-area-inset-bottom));max-width:880px;margin:0 auto}
@media(min-width:920px){
  body{padding-left:240px}
  .main{padding:32px 36px 64px;min-height:100dvh}
  .bottom-nav{display:none!important}
}

/* Sidebar (desktop) */
.sidebar{display:none}
@media(min-width:920px){
  .sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;z-index:40;overflow-y:auto}
}
.sb-brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sb-brand b{font-family:Fraunces,serif;font-size:19px;display:block;line-height:1.15}
.sb-sub{display:block;font-size:11px;color:var(--muted)}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:none;border-radius:12px;font:600 14px "Plus Jakarta Sans",sans-serif;color:var(--muted);transition:background .15s,color .15s;text-align:left}
.sb-item:hover{background:var(--surface-2);color:var(--text)}
.sb-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.sb-label{font:700 10.5px "Plus Jakarta Sans",sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin:14px 8px 4px}
.sb-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.5}

/* Bottom navigation (mobile) */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bn-item{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;background:none;color:var(--muted);font:600 10.5px "Plus Jakarta Sans",sans-serif;border-radius:12px}
.bn-item .bn-ic{width:38px;height:26px;border-radius:99px;display:grid;place-items:center;transition:background .18s}
.bn-item.active{color:var(--primary)}
.bn-item.active .bn-ic{background:linear-gradient(140deg,var(--grad-a),var(--grad-b));color:#fff;box-shadow:0 6px 14px -7px rgba(13,90,55,.5)}

/* Topbar & judul halaman */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand-bar{justify-content:space-between}
.pg-title-wrap{flex:1;min-width:0}
.pg-title{font-family:Fraunces,serif;font-size:29px;letter-spacing:-.4px;line-height:1.1}
.pg-sub{color:var(--muted);font-size:13px;margin-top:4px}
.pg-acts{display:flex;gap:8px;align-items:center;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:600;font-size:18px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--grad-a),var(--grad-b));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -7px rgba(13,90,55,.55)}
.logo.lg{width:56px;height:56px;border-radius:18px}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:13px;padding:11px 17px;font:600 14px "Plus Jakarta Sans",sans-serif;transition:transform .15s,background .15s,box-shadow .15s;min-height:44px}
.btn:active{transform:scale(.965)}
.btn-primary{background:linear-gradient(140deg,var(--grad-a),var(--grad-b));color:#fff;box-shadow:0 8px 18px -8px rgba(13,90,55,.55)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-ghost:hover{background:var(--line)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:8px 13px;min-height:38px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:inline-grid;place-items:center;transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--line-strong)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.link{border:0;background:none;color:var(--primary);font:600 13px "Plus Jakarta Sans",sans-serif;padding:4px 6px;border-radius:8px}
.link:hover{background:var(--primary-soft)}
.spacer{flex:1}

/* Kartu & seksi */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.sec-t{font-family:Fraunces,serif;font-size:17px;margin-bottom:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-head h3{font-family:Fraunces,serif;font-size:16.5px}
.pad-t{margin:22px 0 10px}
.mini-pct{font:700 12.5px "Plus Jakarta Sans",sans-serif;color:var(--primary)}
.mut{color:var(--muted);font-size:13.5px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.6;background:var(--surface-2);border-radius:12px;padding:12px 14px}

/* Formulir */
.lbl{display:block;font:600 12.5px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin:0 0 6px 2px}
.lbl .opt{font-weight:500;color:var(--faint)}
.field{margin-bottom:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:380px){.row2{grid-template-columns:1fr}}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font:500 16px "Plus Jakarta Sans",sans-serif;color:var(--text);transition:border-color .15s;min-height:46px}
textarea.inp{resize:vertical;line-height:1.55}
.inp:focus{outline:none;border-color:var(--primary)}
.inp::placeholder{color:var(--faint)}
.form-err{color:var(--red);font:600 12.5px "Plus Jakarta Sans",sans-serif;min-height:17px;margin:2px 0 4px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg.fixed{width:190px;flex:none}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font:600 13px "Plus Jakarta Sans",sans-serif;color:var(--muted);transition:.15s}
.seg button.sel{background:var(--surface);color:var(--primary);box-shadow:0 1px 4px rgba(28,42,33,.12)}
.chips-pick{display:flex;flex-wrap:wrap;gap:7px}
.chips-pick .chip.sel{outline:2px solid var(--primary);outline-offset:1px}
.search-bar{position:relative;flex:1;min-width:0}
.search-bar .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search-bar .inp{padding-left:38px}
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.sel-inp{width:150px;flex:none;appearance:auto}
.tog{width:48px;height:28px;border-radius:99px;border:0;background:var(--line-strong);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog.on{background:var(--primary)}
.tog.on::after{transform:translateX(20px)}

/* Chip & kategori */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:99px;font:600 12px "Plus Jakarta Sans",sans-serif}
.chip.xs,.chip-xs{padding:2.5px 9px;font-size:11px}
.cat-pribadi{background:var(--primary-soft);color:var(--primary)}
.cat-sekolah{background:var(--teal-soft);color:var(--teal)}
.cat-pekerjaan{background:var(--amber-soft);color:var(--amber)}
.cat-kesehatan{background:var(--red-soft);color:var(--red)}
.cat-belajar{background:#e7e4f2;color:#5d5680}
[data-theme="dark"] .cat-belajar{background:#2a2637;color:#b1a8d6}
.cat-lainnya{background:var(--surface-2);color:var(--muted)}
.badge-late{background:var(--red-soft);color:var(--red);padding:2px 8px;border-radius:99px;font:700 11px "Plus Jakarta Sans",sans-serif}
.badge-today{background:var(--primary-soft);color:var(--primary);padding:3px 10px;border-radius:99px;font:700 11.5px "Plus Jakarta Sans",sans-serif}

/* Tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:99px;font:600 13px "Plus Jakarta Sans",sans-serif;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.tab.active{background:linear-gradient(140deg,var(--grad-a),var(--grad-b));color:#fff;border-color:transparent;box-shadow:0 6px 14px -8px rgba(13,90,55,.5)}
.tab-n{background:var(--surface-2);border-radius:99px;padding:1px 7px;font-size:11px}
.tab.active .tab-n{background:rgba(255,255,255,.25);color:inherit}

/* Tugas */
.task-list{display:flex;flex-direction:column;gap:10px}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .15s}
.task:hover{border-color:var(--line-strong)}
.checkbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-strong);background:var(--surface);color:transparent;display:grid;place-items:center;flex:none;transition:.18s;margin-top:1px}
.checkbox:hover{border-color:var(--primary)}
.task.done .checkbox{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.task-main{flex:1;min-width:0}
.task-title{font-weight:600;cursor:pointer;overflow-wrap:break-word}
.task.done .task-title{color:var(--muted);text-decoration:line-through}
.task-desc{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
.task-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px}
.meta-it{display:inline-flex;align-items:center;gap:5px;font:600 12px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.p-dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.p-rendah{background:#7fa48a}.p-sedang{background:#cf9b43}.p-tinggi{background:#c2634a}
.task-acts{display:flex;gap:4px;flex:none}
.just-done .checkbox{animation:pop .4s var(--ease)}

/* Hero (Beranda) */
.hero{background:linear-gradient(140deg,var(--grad-a) 0%,var(--grad-b) 100%);color:var(--hero-ink);border-radius:26px;padding:24px 22px 18px;position:relative;overflow:hidden;box-shadow:0 18px 44px -20px rgba(13,80,50,.5)}
.hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08);top:-110px;right:-70px;pointer-events:none}
.hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07);bottom:-75px;left:-45px;pointer-events:none}
.hero-av{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:99px;background:rgba(255,255,255,.22);font-size:15px;font-style:normal}
.hero .deco{position:absolute;right:-34px;bottom:-44px;color:#fff;opacity:.09;pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative}
.hero-greet{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font:600 14px "Plus Jakarta Sans",sans-serif;opacity:.9}
.hero-date{font:500 12.5px "Plus Jakarta Sans",sans-serif;opacity:.7;margin-top:3px}
.hero-clock{display:flex;align-items:baseline;gap:7px;font-family:Fraunces,serif;font-weight:600;font-size:clamp(44px,13vw,58px);letter-spacing:-1.5px;line-height:1.15;margin:10px 0 4px;position:relative}
.hero-sec{font-size:19px;opacity:.6;letter-spacing:0}
.hero-stats{display:flex;border-top:1px solid rgba(255,255,255,.16);margin-top:12px;padding-top:13px;position:relative}
.hero-stats>div{flex:1}
.hero-stats>div+div{border-left:1px solid rgba(255,255,255,.16);padding-left:14px}
.hero-stats b{font-family:Fraunces,serif;font-size:23px;font-weight:600;display:block;line-height:1.1}
.hero-stats span{font:500 11.5px "Plus Jakarta Sans",sans-serif;opacity:.75}
.ring-wrap{flex:none}
.ring-num{font:700 17px "Plus Jakarta Sans",sans-serif;fill:var(--hero-ink)}
.ring-lab{font:600 10px "Plus Jakarta Sans",sans-serif;fill:var(--hero-ink);opacity:.7}
.ring-fg{transition:stroke-dashoffset 1s var(--ease)}

/* Beranda: aksi cepat & grid */
.quick-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:16px 0 14px}
.home-grid{display:flex;flex-direction:column;gap:14px}
@media(min-width:780px){.home-grid{display:grid;grid-template-columns:1.45fr 1fr;align-items:start}}
.home-col{display:flex;flex-direction:column;gap:14px}
.h-sec .task-list{margin-top:4px}
.habit-mini .hm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.habit-mini .hm:last-child{border-bottom:0}
.hm-name{display:flex;align-items:center;gap:8px;font:600 13.5px "Plus Jakarta Sans",sans-serif;min-width:0;overflow-wrap:break-word}
.h-check{width:44px;height:44px;border-radius:99px;border:2px solid var(--line-strong);background:var(--surface);color:var(--muted);display:inline-grid;place-items:center;transition:.18s;flex:none}
.h-check:hover{border-color:var(--primary);color:var(--primary)}
.h-check.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.h-check.sm{width:32px;height:32px}
.just-check{animation:pop .4s var(--ease)}
.jr-preview{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:2px 0}
.jp-mood{width:42px;height:42px;border-radius:13px;background:var(--surface-2);color:var(--primary);display:grid;place-items:center;flex:none}
.jp-tx{flex:1;min-width:0}
.jp-tx b{display:block;font-size:14px}
.jp-tx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:12.5px}
.motd{display:flex;align-items:center;gap:12px;padding:16px 18px;margin-top:14px;color:var(--primary)}
.motd p{flex:1;font:italic 500 15px Fraunces,serif;line-height:1.45;transition:opacity .25s,transform .25s;min-width:0}
#motd.swap{opacity:0;transform:translateY(4px)}

/* Empty state */
.empty{text-align:center;padding:44px 22px;color:var(--muted)}
.empty.sm{padding:22px 12px}
.e-ic{width:56px;height:56px;border-radius:18px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 14px}
.empty.sm .e-ic{width:42px;height:42px;border-radius:14px;margin-bottom:10px}
.e-t{display:block;font:600 15px "Plus Jakarta Sans",sans-serif;color:var(--text);margin-bottom:5px}
.e-d{font-size:13px;line-height:1.55;max-width:320px;margin:0 auto}
.e-act{margin-top:16px}

/* Progress & chart */
.pbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border-radius:99px;transition:width .7s var(--ease)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart-val{font:700 12px "Plus Jakarta Sans",sans-serif;min-height:15px}
.chart-bar{width:100%;max-width:36px;height:0;background:linear-gradient(180deg,var(--grad-b),var(--grad-a));border-radius:7px 7px 3px 3px;transition:height .7s var(--ease)}
.chart-bar.zero{background:var(--line)}
.chart-lab{font:600 11px "Plus Jakarta Sans",sans-serif;color:var(--muted)}

/* Kalender */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-title{font-family:Fraunces,serif;font-size:18px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.cal-week span{text-align:center;font:700 10.5px "Plus Jakarta Sans",sans-serif;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);padding:5px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{border:0;background:none;border-radius:12px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 14px "Plus Jakarta Sans",sans-serif;color:var(--text);transition:background .15s;padding:2px}
.cal-cell:not(.blank):hover{background:var(--surface-2)}
.cal-cell.blank{pointer-events:none}
.cal-cell.is-sel{background:var(--primary-soft)}
.cal-cell .dnum{border-radius:8px;padding:1px 7px;line-height:1.3}
.cal-cell.is-today .dnum{background:var(--primary);color:var(--on-primary);font-weight:700}
.cal-grid.mini .cal-cell{min-height:40px;font-size:13px}
.dots{display:flex;gap:3px;height:4px}
.dot{width:4px;height:4px;border-radius:99px}
.d-task{background:var(--primary)}.d-ev{background:#c08b2d}.d-jr{background:var(--teal)}
.day-panel{margin-top:14px}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.day-head h3{font-family:Fraunces,serif;font-size:18px}
.day-sec-t{font:700 11.5px "Plus Jakarta Sans",sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin:16px 0 9px}
.ev{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.ev-bar{width:4px;height:36px;border-radius:99px;background:var(--amber);flex:none}
.ev-main{flex:1;min-width:0}
.ev-title{font-weight:600;font-size:14px;overflow-wrap:break-word}
.ev-meta{display:flex;gap:8px;font:600 12px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-top:2px}
.ev-note{color:var(--muted);font-size:12.5px;margin-top:3px;overflow-wrap:break-word}
.day-jr{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--teal-soft);background:var(--teal-soft);border-radius:14px;color:var(--teal);font-weight:600;font-size:13.5px;width:100%;text-align:left}

/* Jurnal */
.jcal{margin-bottom:14px}
.j-item{display:flex;align-items:center;gap:14px;padding:13px 15px;width:100%;text-align:left;margin-bottom:10px}
.j-date{width:46px;flex:none;text-align:center;color:var(--muted)}
.j-date b{font-family:Fraunces,serif;font-size:21px;display:block;color:var(--text);line-height:1.1}
.j-date span{font:700 10.5px "Plus Jakarta Sans",sans-serif;text-transform:uppercase;letter-spacing:.5px}
.j-body{flex:1;min-width:0}
.j-top{display:flex;align-items:center;gap:8px;color:var(--primary)}
.j-top b{font-size:14.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.j-sn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:12.5px;margin-top:3px}
.j-item .chev{color:var(--faint)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font:600 10.5px "Plus Jakarta Sans",sans-serif;color:var(--muted);transition:.15s}
.mood:hover{border-color:var(--line-strong)}
.mood.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

/* Kebiasaan */
.hsum-tx{font-size:13.5px;color:var(--muted);margin-bottom:9px}
.hsum-tx b{font-family:Fraunces,serif;font-size:17px;color:var(--text)}
.habit-list{display:flex;flex-direction:column;gap:12px}
.habit-head{display:flex;align-items:center;gap:12px}
.h-ic{width:42px;height:42px;border-radius:13px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none;transition:.18s}
.h-ic.on{background:var(--primary);color:var(--on-primary)}
.h-name{flex:1;min-width:0}
.h-name b{font-size:15px;display:block;overflow-wrap:break-word}
.h-sub{display:flex;align-items:center;gap:5px;font:600 12px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.flame{color:var(--amber);display:inline-flex}
.heat{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin-top:13px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);min-width:0}
.heat i.on{background:var(--primary)}
.heat i.t{box-shadow:inset 0 0 0 1.5px var(--primary)}
.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ip{padding:11px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);display:grid;place-items:center;transition:.15s}
.ip.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

/* Catatan */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.note{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:132px;border:1px solid rgba(30,42,34,.06);box-shadow:var(--shadow);transition:transform .15s}
.note:hover{transform:translateY(-2px)}
.note-c-sage{--nc:#e9f0e3}.note-c-sand{--nc:#f7efdc}.note-c-sky{--nc:#e5eef4}.note-c-rose{--nc:#f8e9e4}.note-c-lilac{--nc:#eee9f6}
[data-theme="dark"] .note-c-sage{--nc:#25302a}[data-theme="dark"] .note-c-sand{--nc:#302c21}
[data-theme="dark"] .note-c-sky{--nc:#1f2e34}[data-theme="dark"] .note-c-rose{--nc:#37251f}[data-theme="dark"] .note-c-lilac{--nc:#282338}
.note{background:var(--nc)}
.note.pinned{outline:2px solid var(--primary);outline-offset:2px}
.note-body{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font-family:inherit;color:var(--text)}
.note-title{font-weight:600;font-size:14.5px;overflow-wrap:break-word}
.note-snippet{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--muted);margin-top:5px;overflow-wrap:break-word}
.note-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.note-date{font:600 11px "Plus Jakarta Sans",sans-serif;color:var(--faint)}
.note-foot>span:last-child{display:flex;gap:2px}
.pin-btn{border:0;background:none;color:var(--faint);width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center}
.pin-btn:hover{background:rgba(30,42,34,.07)}
.pin-btn.on{color:var(--primary)}
.color-pick{display:flex;gap:9px}
.cp{width:32px;height:32px;border-radius:99px;border:0;transition:.15s}
.cp.sel{outline:2.5px solid var(--primary);outline-offset:2px}
.cp[data-c="sage"]{background:#e9f0e3}.cp[data-c="sand"]{background:#f7efdc}.cp[data-c="sky"]{background:#e5eef4}.cp[data-c="rose"]{background:#f8e9e4}.cp[data-c="lilac"]{background:#eee9f6}
.save-ind{font:600 11.5px "Plus Jakarta Sans",sans-serif;color:var(--faint);transition:color .2s}
.save-ind.flash{color:var(--primary)}

/* Target */
.goal-list{display:flex;flex-direction:column;gap:12px}
.goal{padding:16px}
.g-head{display:flex;align-items:flex-start;gap:10px}
.g-title{flex:1;min-width:0}
.g-title b{font-size:16px;overflow-wrap:break-word}
.g-desc{color:var(--muted);font-size:13px;margin-top:4px;overflow-wrap:break-word}
.g-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px}
.g-steps{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.step{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:var(--surface-2);border-radius:11px;width:100%;text-align:left;font:500 13.5px "Plus Jakarta Sans",sans-serif;color:var(--text)}
.step .cb{width:19px;height:19px;border-radius:6px;border:2px solid var(--line-strong);color:transparent;display:grid;place-items:center;flex:none;background:var(--surface)}
.step.done .cb{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.step.done span{text-decoration:line-through;color:var(--muted)}
.step span{min-width:0;overflow-wrap:break-word}
.g-prog{margin-top:13px}
.g-prog .gp-t{display:flex;justify-content:space-between;font:600 12.5px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-bottom:7px}
.step-row{display:flex;gap:8px;margin-bottom:8px}
.step-row .inp{flex:1}
.step-rm{flex:none}

/* Statistik */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:780px){.stat-grid{grid-template-columns:repeat(4,1fr)}.stats-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
.stats-2col{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.stat{display:flex;gap:12px;align-items:center;padding:14px}
.st-ic{width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.st-num{font-family:Fraunces,serif;font-size:24px;display:block;line-height:1.15}
.st-lab{font:600 11.5px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.gpr-row{margin-bottom:14px}
.gpr-row:last-child{margin-bottom:2px}
.gpr-t{display:flex;justify-content:space-between;gap:10px;font:600 13.5px "Plus Jakarta Sans",sans-serif;margin-bottom:7px}
.gpr-t b{min-width:0;overflow-wrap:break-word}
.gpr-t span{color:var(--primary);flex:none}

/* Profil */
.profile-card .pr-top{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.pr-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;flex:none}
.pr-avatar{position:relative;width:86px;height:86px;border:0;background:none;padding:0;cursor:pointer}
.pr-avatar .ph{width:86px;height:86px;border-radius:26px;background:var(--primary-soft);display:grid;place-items:center;font-size:38px;overflow:hidden}
.pr-avatar .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pr-avatar .cam{position:absolute;right:-3px;bottom:-3px;width:30px;height:30px;border-radius:99px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;border:2.5px solid var(--surface);transition:transform .15s}
.pr-avatar:active .cam{transform:scale(.9)}
.pr-avatar-hint{font:600 11px "Plus Jakarta Sans",sans-serif;color:var(--faint);max-width:110px;text-align:center;line-height:1.4}
.pr-photo-del{font-size:11.5px;padding:2px 6px}
.pr-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:Fraunces,serif;font-size:22px}
.pr-bio{color:var(--muted);font-size:13.5px;margin-top:3px}
.pr-since{display:inline-flex;align-items:center;gap:6px;color:var(--faint);font:600 12px "Plus Jakarta Sans",sans-serif;margin-top:7px}
.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.av{font-size:23px;padding:9px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);transition:.15s}
.av.sel{border-color:var(--primary);background:var(--primary-soft)}
.link-list{padding:6px 8px}
.link-it{display:flex;align-items:center;gap:13px;width:100%;padding:12px 10px;border:0;background:none;border-radius:13px;text-align:left;transition:.15s}
.link-it:hover{background:var(--surface-2)}
.li-ic{width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.li-tx{flex:1;min-width:0}
.li-tx b{display:block;font-size:14.5px}
.li-tx span{font-size:12.5px;color:var(--muted)}
.link-it .chev{color:var(--faint)}
.vrf{flex:none;display:inline-block;vertical-align:-4px}

/* Pengaturan */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row.last{border-bottom:0}
.set-row>div:first-child b{display:block;font-size:14.5px}
.set-row>div:first-child span{display:block;font-size:12.5px;color:var(--muted)}
.swatches{display:flex;gap:10px}
.swatch{width:30px;height:30px;border-radius:99px;border:0;transition:.15s}
.swatch.sel{outline:2.5px solid var(--text);outline-offset:2px}
.swatch[data-val="forest"]{background:#2e6b4e}
.swatch[data-val="sage"]{background:#5d8a78}
.swatch[data-val="moss"]{background:#5f7136}
.fmt-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:420px){.fmt-opts{grid-template-columns:1fr}}
.fmt{padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;transition:.15s}
.fmt b{display:block;font-size:13px}
.fmt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.fmt.sel{border-color:var(--primary);background:var(--primary-soft)}
.fmt.sel b{color:var(--primary)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.danger-zone{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.danger-zone h4{color:var(--red);font-size:13.5px;margin-bottom:10px}
/* Panel status notifikasi (v3.1) */
.nstat{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.55;margin-bottom:12px;border:1px solid var(--line)}
.nstat .ic{flex:none;margin-top:1px}
.nstat b{display:block;font-size:13.5px;margin-bottom:2px}
.nstat.ok{background:var(--primary-soft);border-color:color-mix(in srgb, var(--primary) 35%, transparent)}
.nstat.ok b{color:var(--primary)}
.nstat.warn{background:color-mix(in srgb, #d97706 12%, transparent);border-color:color-mix(in srgb, #d97706 38%, transparent)}
.nstat.warn b{color:#b45309}
.nstat.err{background:color-mix(in srgb, var(--red) 10%, transparent);border-color:color-mix(in srgb, var(--red) 35%, transparent)}
.nstat.err b{color:var(--red)}
.nstat .nstat-act{margin-top:6px;font-weight:600;color:var(--primary);cursor:pointer;display:inline-flex;align-items:center;gap:4px}

/* Modal */
.m-ov{position:fixed;inset:0;z-index:200;background:rgba(13,22,16,.48);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
@media(min-width:640px){.m-ov{align-items:center;padding:24px}}
.m-ov.show{opacity:1}
.modal{width:100%;max-width:540px;max-height:calc(100dvh - 20px);display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(30px);transition:transform .24s var(--ease);box-shadow:0 -12px 48px rgba(10,20,14,.3)}
@media(min-width:640px){.modal{border-radius:22px;transform:translateY(14px) scale(.98);max-height:calc(100dvh - 48px)}}
.m-ov.show .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.modal-head h3{font-family:Fraunces,serif;font-size:19px;min-width:0;overflow-wrap:break-word}
.modal-head .mh-side{display:flex;gap:6px;align-items:center;flex:none}
.modal-body{padding:8px 18px 16px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;align-items:center;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
@media(min-width:640px){.modal-foot{border-radius:0 0 22px 22px}}
.confirm-msg{color:var(--muted);font-size:14px;line-height:1.6}
.onb{padding:26px 22px 22px;text-align:center}
.onb h3{font-family:Fraunces,serif;font-size:23px;margin:16px 0 8px}
.onb .mut{margin-bottom:20px}
.onb .field{text-align:left}
.onb .btn{margin-top:8px}

/* Toast */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:400;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100vw - 28px));pointer-events:none}
@media(min-width:920px){.toast-wrap{bottom:26px}}
.toast{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:0 12px 34px -10px rgba(10,20,14,.35);pointer-events:auto;animation:tIn .3s var(--ease)}
.toast.out{animation:tOut .22s forwards}
.t-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.t-success .t-ic{background:var(--primary-soft);color:var(--primary)}
.t-error .t-ic{background:var(--red-soft);color:var(--red)}
.t-info .t-ic{background:var(--surface-2);color:var(--muted)}
.t-msg{flex:1;font:600 13px "Plus Jakarta Sans",sans-serif;min-width:0}
.t-act{border:0;background:none;color:var(--primary);font:700 13px "Plus Jakarta Sans",sans-serif;padding:6px 8px;border-radius:8px;flex:none}
.t-act:hover{background:var(--primary-soft)}

/* Tombol instal PWA */
.gd-fab{position:fixed;left:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:12px 18px;background:var(--primary);color:var(--on-primary);font:600 13.5px "Plus Jakarta Sans",sans-serif;box-shadow:0 12px 28px -10px rgba(20,40,28,.5);transition:transform .15s}
.gd-fab:active{transform:scale(.96)}
.gd-fab[hidden]{display:none}
@media(min-width:920px){.gd-fab{left:auto;right:24px;bottom:88px}}

/* Transisi halaman & animasi */
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-enter{animation:pgIn .32s var(--ease)}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes tIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateY(10px)}}
.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ===== Pengumuman (konten dari admin, tanpa ubah kode) ===== */
.ann-card{margin-top:14px}
.ann-card .sec-head h3{display:flex;align-items:center;gap:8px}
.ann-item{padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:9px}
.ann-item:last-child{margin-bottom:0}
.ann-t{font-weight:600;font-size:14.5px;overflow-wrap:break-word;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ann-new{background:var(--primary-soft);color:var(--primary);padding:2px 8px;border-radius:99px;font:700 10px "Plus Jakarta Sans",sans-serif;letter-spacing:.4px}
.ann-b{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.55;white-space:pre-line;overflow-wrap:break-word}
.ann-d{display:inline-block;margin-top:7px;font:600 11.5px "Plus Jakarta Sans",sans-serif;color:var(--faint)}

/* ===== Beranda v3: pesan kontekstual + aksi cepat baru ===== */
.hero-msg{font:500 13px "Plus Jakarta Sans",sans-serif;opacity:.82;margin-top:6px;position:relative;max-width:34ch}
.quick-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 14px}
@media(min-width:780px){.quick-acts{grid-template-columns:repeat(6,1fr)}}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px 6px 11px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font:600 12px "Plus Jakarta Sans",sans-serif;color:var(--text);transition:transform .15s,border-color .15s;box-shadow:var(--shadow);min-height:86px}
.qa:hover{border-color:var(--primary)}
.qa:active{transform:scale(.95)}
.qa .qa-ic{width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.qa.primary .qa-ic{background:var(--primary);color:var(--on-primary)}

/* Linimasa hari ini */
.tl{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.tl-it{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:13px}
.tl-it.past{opacity:.55}
.tl-time{font:700 13px "Plus Jakarta Sans",sans-serif;color:var(--primary);flex:none;min-width:44px;text-align:center;background:var(--primary-soft);border-radius:9px;padding:4px 6px}
.tl-it.past .tl-time{color:var(--red);background:var(--red-soft)}
.tl-main{flex:1;min-width:0;font:600 13.5px "Plus Jakarta Sans",sans-serif;overflow-wrap:break-word}
.tl-tag{flex:none;font:700 10px "Plus Jakarta Sans",sans-serif;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);padding:2px 8px;border-radius:99px;background:var(--surface-2)}

/* Streak (Beranda & Statistik) */
.stk-row{display:flex;align-items:center;gap:13px}
.stk-flame{width:46px;height:46px;border-radius:14px;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;flex:none}
.stk-tx b{font-family:Fraunces,serif;font-size:21px;display:block;line-height:1.1}
.stk-tx span{font:600 12px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.stk-dots{display:flex;gap:5px;margin-top:11px;align-items:center}
.stk-dots i{width:100%;max-width:26px;aspect-ratio:1;border-radius:8px;background:var(--surface-2)}
.stk-dots i.on{background:var(--primary)}
.stk-dots span{font:700 10.5px "Plus Jakarta Sans",sans-serif;color:var(--faint);margin:0 3px;min-width:14px;text-align:center}

/* Lencana pencapaian */
.bdg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:780px){.bdg-grid{grid-template-columns:repeat(3,1fr)}}
.bdg{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1px solid var(--line);border-radius:15px;background:var(--surface);transition:.15s}
.bdg .bd-ic{width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.bdg b{display:block;font-size:13.5px}
.bdg span{display:block;font:500 11.5px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-top:2px;line-height:1.4}
.bdg.locked{opacity:.45}
.bdg.locked .bd-ic{background:var(--surface-2);color:var(--faint)}
.bdg.unlocked{border-color:var(--primary)}

/* Modal timer fokus */
.focus-body{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:10px}
.fc-task{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:7px 14px;font:600 12.5px "Plus Jakarta Sans",sans-serif}
.fc-task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
.fc-ring-wrap{position:relative;width:190px;height:190px}
.fc-ring-wrap svg{transform:rotate(-90deg)}
.fc-ring-bg{stroke:var(--surface-2)}
.fc-ring-fg{stroke:var(--primary);transition:stroke-dashoffset .5s linear}
.fc-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:600;font-size:44px;letter-spacing:-1px}
.fc-state{font:600 12px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.du-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.du-chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 15px;font:600 13px "Plus Jakarta Sans",sans-serif;color:var(--muted);transition:.15s}
.du-chips button.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.du-chips button:disabled{opacity:.4;cursor:not-allowed}

/* Chip fokus melayang (saat modal ditutup) */
.focus-chip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:90;display:inline-flex;align-items:center;gap:9px;border:0;border-radius:99px;padding:10px 18px;background:var(--primary);color:var(--on-primary);font:700 13px "Plus Jakarta Sans",sans-serif;box-shadow:0 12px 28px -10px rgba(20,40,28,.5);animation:tIn .3s var(--ease)}
.focus-chip:active{transform:translateX(-50%) scale(.96)}
.focus-chip[hidden]{display:none}
@media(min-width:920px){.focus-chip{bottom:24px}}

/* ===== v4: Pusat Notifikasi (dalam aplikasi) ===== */
.bell-btn{position:relative}
.bell-badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:99px;background:#e5484d;color:#fff;font:700 10.5px "Plus Jakarta Sans",sans-serif;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface);pointer-events:none}
.bell-badge[hidden]{display:none}
.sb-bell{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin-top:auto;margin-bottom:10px;border:0;background:none;border-radius:12px;font:600 14px "Plus Jakarta Sans",sans-serif;color:var(--muted);text-align:left;transition:.15s;position:relative}
.sb-bell:hover{background:var(--surface-2);color:var(--text)}
.sb-bell .bell-badge{position:absolute;top:5px;right:10px;border-color:var(--surface)}
.sb-foot{margin-top:0}
.nc-it{display:flex;gap:12px;width:100%;text-align:left;padding:12px;border:0;background:none;border-radius:14px;transition:background .15s}
.nc-it:hover{background:var(--surface-2)}
.nc-it.unread{background:var(--primary-soft)}
.nc-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.nc-it.unread .nc-ic{background:linear-gradient(140deg,var(--grad-a),var(--grad-b));color:#fff}
.nc-ic.t-overdue{background:var(--red-soft);color:var(--red)}
.nc-ic.t-ann{background:var(--amber-soft);color:var(--amber)}
.nc-ic.t-focus{background:var(--teal-soft);color:var(--teal)}
.nc-ic.t-streak{background:var(--amber-soft);color:var(--amber)}
.nc-tx{flex:1;min-width:0}
.nc-tx b{display:block;font-size:14px;overflow-wrap:break-word}
.nc-tx>span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.5;overflow-wrap:break-word}
.nc-tx i{display:block;font:600 11px "Plus Jakarta Sans",sans-serif;color:var(--faint);font-style:normal;margin-top:5px}

/* Spanduk tugas terlambat (Beranda) */
.ov-banner{display:flex;align-items:center;gap:13px;margin-top:14px;padding:15px 17px;border:0;border-radius:20px;background:linear-gradient(135deg,#b3392b,#e2603c);color:#fff;box-shadow:0 14px 32px -16px rgba(170,50,30,.6);position:relative;overflow:hidden;width:100%;cursor:pointer;font-family:inherit}
.ov-banner::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);top:-60px;right:-30px;pointer-events:none}
.ov-banner .ov-ic{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.ov-banner .ov-tx{flex:1;min-width:0;position:relative;text-align:left}
.ov-banner .ov-tx b{display:block;font-size:15px}
.ov-banner .ov-tx span{display:block;font:500 12.5px "Plus Jakarta Sans",sans-serif;opacity:.88;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-banner .btn{background:#fff;color:#b3392b;position:relative;flex:none}

/* Tombol tambah cepat melayang (+) */
.add-fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:70;width:54px;height:54px;border-radius:18px;border:0;background:linear-gradient(140deg,var(--grad-a),var(--grad-b));color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(13,90,55,.55);transition:transform .15s}
.add-fab:hover{transform:translateY(-2px)}
.add-fab:active{transform:scale(.92)}
@media(min-width:920px){.add-fab{right:24px;bottom:24px}}

/* Menu tambah cepat */
.qadd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qadd-it{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;transition:.15s}
.qadd-it:hover{border-color:var(--primary);transform:translateY(-1px)}
.qadd-it .qadd-ic{width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin-bottom:7px}
.qadd-it b{font-size:14px}
.qadd-it>span:last-child{font:500 11.5px "Plus Jakarta Sans",sans-serif;color:var(--muted)}

/* Sub-langkah & penanggung jawab pada kartu tugas */
.sub-mini{display:flex;align-items:center;gap:8px;margin-top:8px}
.sub-bar{flex:0 1 112px;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:block}
.sub-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border-radius:99px}
.sub-n{font:700 11px "Plus Jakarta Sans",sans-serif;color:var(--faint)}
.asg-chip{background:var(--teal-soft);color:var(--teal)}
.sub-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:7px;background:var(--surface)}
.sub-row>span{flex:1;min-width:0;font:500 13.5px "Plus Jakarta Sans",sans-serif;overflow-wrap:break-word}
.sub-row .done-tx{text-decoration:line-through;color:var(--muted)}
.cbx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line-strong);background:var(--surface);color:transparent;display:grid;place-items:center;flex:none;transition:.15s;padding:0}
.cbx.on{background:var(--primary);border-color:var(--primary);color:#fff}
.qa:hover{transform:translateY(-2px)}

/* Pengguna bersama */
.usr-it{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;transition:.15s;margin-bottom:9px}
.usr-it:hover{border-color:var(--line-strong)}
.usr-it.active{border-color:var(--primary);background:var(--primary-soft)}
.usr-av{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;flex:none;overflow:hidden}
.usr-av img{width:100%;height:100%;object-fit:cover;display:block}
.usr-tx{flex:1;min-width:0}
.usr-tx b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr-tx span{display:block;font:500 12px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.usr-tag{font:700 10px "Plus Jakarta Sans",sans-serif;letter-spacing:.4px;color:var(--primary);border:1.5px solid var(--primary);border-radius:99px;padding:2px 9px;flex:none}

/* ===== v5: Popup notifikasi di Beranda ===== */
.np-wrap{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:380;display:flex;flex-direction:column;gap:9px;width:min(430px,calc(100vw - 22px));pointer-events:none}
@media(min-width:920px){.np-wrap{left:auto;right:20px;top:18px;transform:none;width:352px}}
.np-card{position:relative;display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 40px 14px 13px;box-shadow:0 18px 44px -14px rgba(10,25,15,.4);pointer-events:auto;overflow:hidden;animation:npIn .34s var(--ease);cursor:pointer}
.np-card.out{animation:npOut .24s var(--ease) forwards}
@keyframes npIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes npOut{to{opacity:0;transform:translateY(-10px) scale(.96)}}
.np-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.np-tx{flex:1;min-width:0}
.np-tx b{display:block;font-size:14px;overflow-wrap:break-word}
.np-tx>span{display:block;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:2px;overflow-wrap:break-word}
.np-tx i{display:block;font:600 11px "Plus Jakarta Sans",sans-serif;color:var(--faint);font-style:normal;margin-top:4px}
.np-go{flex:none;color:var(--faint);margin-top:3px}
.np-card:hover .np-go{color:var(--primary)}
.np-x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:9px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer;padding:0}
.np-x:hover{background:var(--surface-2);color:var(--text)}
.np-bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));animation:npBar linear forwards;border-radius:99px}
@keyframes npBar{from{width:100%}to{width:0}}
.np-card.t-overdue{border-color:var(--red-soft)}
.np-card.t-overdue .np-ic{background:var(--red-soft);color:var(--red)}
.np-card.t-ann .np-ic{background:var(--amber-soft);color:var(--amber)}
.np-card.t-streak .np-ic{background:var(--amber-soft);color:var(--amber)}
.np-card.t-daily .np-ic{background:var(--primary-soft);color:var(--primary)}
.np-card.t-focus .np-ic{background:var(--teal-soft);color:var(--teal)}
.np-card.t-badge .np-ic,.np-card.t-level .np-ic{background:linear-gradient(140deg,var(--grad-a),var(--grad-b));color:#fff}

/* ===== v5: Poin & level ===== */
.xp-card{cursor:pointer;transition:transform .15s}
.xp-card:hover{transform:translateY(-2px)}
.xp-top{display:flex;align-items:center;gap:11px}
.xp-bolt{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--grad-a),var(--grad-b));color:#fff;display:grid;place-items:center;flex:none}
.xp-bolt.big{width:46px;height:46px;border-radius:14px}
.xp-t{flex:1;min-width:0}
.xp-t b{display:block;font-size:14.5px}
.xp-t span{display:block;font:500 12px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-top:1px}
.xp-next{flex:none;font:700 10.5px "Plus Jakarta Sans",sans-serif;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:99px;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp-bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:11px;display:block}
.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border-radius:99px;transition:width .6s var(--ease)}

/* ===== v5: Papan peringkat ===== */
.lb-list{display:flex;flex-direction:column;gap:9px}
.lb-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px}
.lb-row.me{border-color:var(--primary);background:var(--primary-soft)}
.lb-rank{width:30px;text-align:center;font:700 14px "Plus Jakarta Sans",sans-serif;flex:none}
.lb-av{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:none;overflow:hidden}
.lb-tx{flex:1;min-width:0}
.lb-tx b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-tx>span{display:block;font:500 11.5px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-top:2px}
.lb-bar{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:4px 0 3px}
.lb-row.me .lb-bar{background:rgba(13,113,72,.14)}
.lb-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border-radius:99px}

/* ===== v5: Kanvas confetti ===== */
#confettiCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:520}

/* ===== v6: Tab filter Pusat Notifikasi ===== */
.nc-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.nc-tab{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 13px;font:600 12px "Plus Jakarta Sans",sans-serif;cursor:pointer;transition:.15s}
.nc-tab:hover{border-color:var(--line-strong);color:var(--text)}
.nc-tab.sel{background:linear-gradient(140deg,var(--grad-a),var(--grad-b));border-color:transparent;color:#fff}
.nc-count{font:700 10.5px "Plus Jakarta Sans",sans-serif;background:var(--surface-2);border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--muted)}
.nc-tab.sel .nc-count{background:rgba(255,255,255,.25);color:#fff}

/* ===== v6: Pengumuman PENTING — kartu besar di Beranda ===== */
.ann-hero{position:relative;overflow:hidden;display:flex;gap:14px;align-items:flex-start;margin-top:14px;padding:18px 56px 18px 18px;border:0;border-radius:22px;background:linear-gradient(135deg,#0d7148,#33c17f);color:#fff;box-shadow:0 18px 40px -18px rgba(13,113,72,.65);cursor:pointer;width:100%;text-align:left;font-family:inherit}
.ann-hero::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);top:-70px;right:-40px;pointer-events:none}
.ann-hero .ah-ic{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.ann-hero .ah-tx{flex:1;min-width:0;position:relative}
.ann-hero .ah-tag{display:inline-block;font:700 10px "Plus Jakarta Sans",sans-serif;letter-spacing:1.2px;background:#fff;color:#0d7148;border-radius:99px;padding:2px 10px;margin-bottom:7px}
.ann-hero .ah-tx b{display:block;font-size:16.5px;line-height:1.35;overflow-wrap:break-word}
.ann-hero .ah-tx p{margin:5px 0 0;font:500 13px/1.55 "Plus Jakarta Sans",sans-serif;opacity:.94;overflow-wrap:break-word}
.ann-hero .ah-d{display:block;font:600 11px "Plus Jakarta Sans",sans-serif;opacity:.82;margin-top:7px}
.ann-hero .ah-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:10px;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;z-index:2}
.ann-hero .ah-x:hover{background:rgba(255,255,255,.32)}
.ann-p-tag{font:700 9.5px "Plus Jakarta Sans",sans-serif;letter-spacing:.8px;color:#b3392b;background:#fdeceb;border-radius:99px;padding:1px 8px;margin-left:7px;vertical-align:1px;white-space:nowrap}
.ann-p-tag.local{color:var(--teal);background:var(--teal-soft)}
.annm-list{display:flex;flex-direction:column;gap:8px}
.annm-it{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--surface)}
.annm-ic{width:34px;height:34px;border-radius:11px;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;flex:none}
.annm-tx{flex:1;min-width:0}
.annm-tx b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.annm-tx span{display:block;font:500 11.5px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-top:1px}

/* ===== v6: Heatmap aktivitas ===== */
.hm-wrap{overflow-x:auto;padding-bottom:4px}
.hm-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:4px;width:max-content}
.hm-c{width:12px;height:12px;border-radius:3.5px;background:var(--surface-2)}
.hm-c.l1{background:#b9e5c8}
.hm-c.l2{background:#7fd3a0}
.hm-c.l3{background:#33c17f}
.hm-c.l4{background:#0d7148}
.hm-leg{display:flex;align-items:center;gap:5px;margin-top:10px;font:500 11px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.hm-leg .hm-c{width:10px;height:10px}

/* ===== v6: Sorotan keluarga & reaksi ===== */
.fam-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}
.fam-av{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:none;overflow:hidden}
.fam-tx{flex:1;min-width:0}
.fam-tx b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fam-tx span{display:block;font:500 11.5px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-top:1px}
.rx-btn{flex:none;display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font:700 12.5px "Plus Jakarta Sans",sans-serif;color:var(--muted);cursor:pointer;transition:.15s;min-width:46px;justify-content:center}
.rx-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.rx-btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.rx-chip{display:inline-flex;align-items:center;gap:5px;font:700 11px "Plus Jakarta Sans",sans-serif;color:var(--teal);background:var(--teal-soft);border-radius:99px;padding:2px 9px}

/* ===== v6: Toko Hadiah ===== */
.rw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px;margin-top:12px}
.rw-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:15px 14px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);position:relative;transition:.15s}
.rw-card:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.rw-ic{width:46px;height:46px;border-radius:15px;background:var(--amber-soft);display:grid;place-items:center;font-size:23px;flex:none}
.rw-t{font-size:14px;font-weight:700;line-height:1.35;overflow-wrap:break-word}
.rw-cost{font:700 12px "Plus Jakarta Sans",sans-serif;color:var(--amber);background:var(--amber-soft);border-radius:99px;padding:3px 10px}
.rw-card .btn[disabled]{opacity:.55;cursor:not-allowed}
.rw-x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:9px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer;padding:0}
.rw-x:hover{background:var(--red-soft);color:var(--red)}
.rw-emoji-pick{display:flex;flex-wrap:wrap;gap:7px}
.rw-emoji-pick button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center;cursor:pointer;padding:0}
.rw-emoji-pick button.sel{border-color:var(--primary);background:var(--primary-soft)}
.rd-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1.5px solid var(--line);border-radius:13px;margin-bottom:8px}
.rd-ic{width:36px;height:36px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;flex:none}
.rd-tx{flex:1;min-width:0}
.rd-tx b{display:block;font-size:13.5px}
.rd-tx span{display:block;font:500 11.5px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-top:1px}

"use strict";
/* ================================================================
   GreenDay — Daily List & Personal Productivity (versi final utuh)
   ----------------------------------------------------------------
   CATATAN PENYIMPANAN:
   Semua data pengguna disimpan di LocalStorage BROWSER INI saja.
   Artinya: data TIDAK otomatis tersinkronisasi ke perangkat lain,
   dan siapa pun yang membuka browser & profil yang sama di
   perangkat ini dapat melihat data tersebut. Gunakan fitur
   Ekspor Cadangan (Pengaturan) untuk memindahkan data antar
   perangkat secara manual.
   ================================================================ */

/* ---------------- Konstanta ---------------- */
const APP_TITLE_BASE = "GreenDay — Daily List & Personal Productivity";

/* ---------------- Pengguna bersama (multi-profil, satu perangkat) ----------------
   Registri pengguna & pengguna aktif disimpan di kunci GLOBAL:
     greenday.users       : [{id, createdAt}]
     greenday.activeUser  : "<id>"
   Data tiap pengguna tersimpan di kunci "greenday.<id>.<key>" sehingga
   tugas/jurnal/kebiasaan tiap orang terpisah rapi. Pengumuman tetap
   dibagikan untuk semua (greenday.announcements). */
const LS = {
  get(k, d=null){ try{ const v=JSON.parse(localStorage.getItem("greenday."+k)); return (v===null||v===undefined)?d:v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("greenday."+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("greenday."+k); }catch(e){} }
};
let STORE_PREFIX = "greenday."; /* dihitung dari pengguna aktif saat init/ganti pengguna */

function userRegistry(){
  const u = LS.get("users", []);
  return Array.isArray(u) ? u.filter(x=>isObj(x) && x.id) : [];
}
function currentUser(){ return LS.get("activeUser", null); }
function setActivePrefix(){
  STORE_PREFIX = `greenday.${currentUser()}.`;
}
/* Pindahkan data versi lama (tunggal-pengguna) ke profil pertama */
function migrateLegacy(){
  if(userRegistry().length) return;
  const firstId = uid();
  if(localStorage.getItem("greenday.profile") !== null){
    Object.keys(DEFAULTS).forEach(k=>{
      const v = localStorage.getItem("greenday."+k);
      if(v !== null){
        localStorage.setItem(`greenday.${firstId}.${k}`, v);
        localStorage.removeItem("greenday."+k);
      }
    });
  }
  LS.set("users", [{id:firstId, createdAt:new Date().toISOString()}]);
  LS.set("activeUser", firstId);
}
function userProfileOf(id){
  try{ const v=JSON.parse(localStorage.getItem(`greenday.${id}.profile`)); return isObj(v)?v:null; }catch(e){ return null; }
}
function switchUser(id){
  if(!userRegistry().some(u=>u.id===id)) return;
  /* v8: tutup modal apa pun yang masih terbuka (termasuk onboarding profil
     lama yang belum diselesaikan) agar tidak nyangkut di profil baru */
  while(modalStack.length) closeModal();
  LS.set("activeUser", id);
  setActivePrefix();
  loadAll(); applySettings(); renderApp(); showOnboarding(); focusChipUpdate(); onlInit();   /* v8: akun cloud per profil */
  const p = state.profile;
  toast(`Berhasil berganti ke profil ${(p && p.name) || "pengguna baru"}.`, "success");
}
function addUser(name, avatar){
  const id = uid();
  const reg = userRegistry();
  reg.push({id, createdAt:new Date().toISOString()});
  LS.set("users", reg);
  LS.set("activeUser", id);
  setActivePrefix();
  state.profile = { ...DEFAULTS.profile, name:name||"", avatar:avatar||"🌱", createdAt:new Date().toISOString() };
  persist("profile");
  loadAll(); applySettings(); renderApp(); showOnboarding(); focusChipUpdate(); onlInit();   /* v8: akun cloud per profil */
  toast("Profil baru dibuat. Selamat datang!","success");
}
function removeUser(id){
  let reg = userRegistry();
  if(reg.length <= 1){ toast("Minimal satu profil harus tetap ada.","error"); return; }
  reg = reg.filter(u=>u.id!==id);
  LS.set("users", reg);
  /* hapus seluruh data milik pengguna itu */
  const kill = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(`greenday.${id}.`)) kill.push(k);
  }
  kill.forEach(k=>localStorage.removeItem(k));
  cleanFriendData(id);   /* v7: lepas dari daftar sahabat, permintaan & kado */
  if(currentUser()===id) switchUser(reg[0].id);
}

/* Tanggal berikutnya untuk tugas berulang (dari tanggal asli atau hari ini, mana yang lebih baru) */
function nextRepeatDate(iso, rep){
  if(!iso || rep==="none") return null;
  const base=parseISO(iso), today=parseISO(isoDate());
  const d = base>today ? new Date(base) : new Date(today);
  if(rep==="harian") d.setDate(d.getDate()+1);
  else if(rep==="mingguan") d.setDate(d.getDate()+7);
  else if(rep==="bulanan") d.setMonth(d.getMonth()+1);
  return isoDate(d);
}

/* Lencana centang hijau dengan tepi gerigi (gaya "terverifikasi").
   Gerigi digambar lewat perhitungan titik sehingga bentuknya selalu rapi
   di semua ukuran, di mode terang maupun gelap. */
function verifiedBadge(size=18, light=false){
  const teeth=12, rO=11, rI=9.1, pts=[];
  for(let i=0;i<teeth*2;i++){
    const r=(i%2===0)?rO:rI;
    const a=(Math.PI*2/(teeth*2))*i-Math.PI/2;
    pts.push((12+r*Math.cos(a)).toFixed(2)+","+(12+r*Math.sin(a)).toFixed(2));
  }
  const fill=light?"var(--hero-accent)":"var(--primary)";
  const tick=light?"var(--hero)":"#fff";
  return `<svg class="vrf" width="${size}" height="${size}" viewBox="0 0 24 24" role="img" aria-label="Nama terverifikasi"><path d="M${pts.join("L")}Z" fill="${fill}" stroke="${fill}" stroke-width="1.6" stroke-linejoin="round"/><path d="m7.5 12.4 3 3 6-6.6" fill="none" stroke="${tick}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* Unggah foto: dipangkas persegi tepat di tengah + dikompres ke JPEG 256px
   agar hemat ruang LocalStorage (kuotanya terbatas). */
function processImageFile(file){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type.startsWith("image/")){
      reject(new Error("Berkas yang dipilih bukan gambar.")); return;
    }
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const S=256;
        const c=document.createElement("canvas");
        c.width=S; c.height=S;
        const ctx=c.getContext("2d");
        const side=Math.max(1,Math.min(img.naturalWidth,img.naturalHeight));
        const sx=(img.naturalWidth-side)/2, sy=(img.naturalHeight-side)/2;
        ctx.drawImage(img,sx,sy,side,side,0,0,S,S);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg",0.85));
      }catch(err){
        URL.revokeObjectURL(url);
        reject(new Error("Gagal memproses gambar."));
      }
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("Gagal membaca gambar. Coba berkas lain."));
    };
    img.src=url;
  });
}

const $  = (s, r=document)=>r.querySelector(s);
const $$ = (s, r=document)=>[...r.querySelectorAll(s)];

const pad = n=>String(n).padStart(2,"0");
const isObj = v=>v!==null && typeof v==="object" && !Array.isArray(v);
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
}
/* Escape semua data user sebelum masuk ke HTML (cegah XSS) */
function esc(s){
  return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const isoDate = (d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parseISO(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); }
const fmtTime = t=>String(t||"").replace(":", ".");
function snippet(s,n=90){ s=String(s||"").trim(); return s.length>n ? s.slice(0,n).trim()+"…" : s; }
function greeting(){
  const h=new Date().getHours();
  if(h>=4 && h<11) return "Selamat pagi";
  if(h>=11 && h<15) return "Selamat siang";
  if(h>=15 && h<18) return "Selamat sore";
  return "Selamat malam";
}
function displayDate(iso){
  if(!iso) return "Tanpa tanggal";
  const d=parseISO(iso), s=state.settings.dateFormat;
  if(s==="sedang") return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  if(s==="angka")  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function shortDate(iso){
  if(!iso) return "";
  const d=parseISO(iso), y=d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"";
  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}${y}`;
}
function daysUntil(iso){
  return Math.round((parseISO(iso).getTime()-parseISO(isoDate()).getTime())/864e5);
}
function lastNDates(n){
  const out=[]; const d=new Date();
  for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); out.push(isoDate(x)); }
  return out;
}

/* ---------------- Penyimpanan (LocalStorage) ---------------- */
const state = {};
function loadAll(){
  for(const key of Object.keys(DEFAULTS)){
    let v=null;
    try{ v=JSON.parse(localStorage.getItem(STORE_PREFIX+key)); }catch(e){ v=null; }
    if(key==="settings"||key==="profile"){
      state[key]={...DEFAULTS[key], ...(isObj(v)?v:{})};
    }else if(key==="xp"){
      state[key]=(typeof v==="number"&&isFinite(v)&&v>=0)?Math.floor(v):null;
    }else{
      state[key]=Array.isArray(v)?v.filter(isObj):[];
    }
  }
  /* v5: pengguna lama langsung mendapat poin dari riwayat aktivitasnya */
  if(state.xp===null||state.xp===undefined){ state.xp=xpFromHistory(); persist("xp"); }
  /* v5: lencana yang sudah diraih sebelum v5 di-seed diam-diam (anti-banjir);
     lencana yang diraih SETELAH ini akan dirayakan dengan popup + poin */
  if(localStorage.getItem(STORE_PREFIX+"badgeLog")===null){
    state.badgeLog=computeBadges().filter(b=>b.ok).map(b=>({t:b.t, ts:Date.now()}));
    persist("badgeLog");
  }
}
function persist(key){
  try{
    localStorage.setItem(STORE_PREFIX+key, JSON.stringify(state[key]));
  }catch(e){
    toast("Gagal menyimpan — penyimpanan browser mungkin penuh.","error");
  }
}
function commit(...keys){ keys.forEach(persist); renderApp(); }

/* ================= PUSAT NOTIFIKASI (v4 → v5: popup Beranda) =================
   Sistem notifikasi BARU yang sepenuhnya berjalan DI DALAM aplikasi.
   Notifikasi browser lama (v3) dihapus total — beserta seluruh syaratnya
   (izin, HTTPS, service worker) yang kerap membuat notifikasi tidak
   pernah muncul di banyak perangkat. Pusat Notifikasi:
     • Selalu aktif — di semua perangkat & semua alamat (https, http, file://)
     • Tidak butuh izin browser sama sekali
     • Tampil sebagai: lencana merah pada tombol lonceng, panel daftar
       notifikasi, toast pop-up, dan spanduk peringatan di Beranda
   Notifikasi dibuat saat aplikasi sedang dibuka: saat pertama dibuka,
   tiap 60 detik, dan setiap kali kembali ke tab GreenDay. */
const NC = {
  max: 40,               /* simpan maksimal 40 notifikasi terakhir */
  _just: [],             /* v5: notifikasi yang baru dibuat pada pemeriksaan terakhir */
  _flags: null,          /* penanda "sudah diberitahu" (anti-duplikat) */
  flags(){
    if(!this._flags){
      try{ const v=JSON.parse(localStorage.getItem(STORE_PREFIX+"ncflags")); this._flags=isObj(v)?v:{}; }
      catch(e){ this._flags={}; }
    }
    return this._flags;
  },
  saveFlags(){ try{ localStorage.setItem(STORE_PREFIX+"ncflags", JSON.stringify(this._flags)); }catch(e){} },
  /* Tambah notifikasi. dedupKey mencegah notifikasi yang sama tercatat
     dua kali (mis. tugas yang sama pada jadwal tanggal+jam yang sama). */
  add({type="info", title, body="", icon="bell", page=null, dedupKey=null, silent=false}={}){
    if(dedupKey){
      const f=this.flags();
      if(f[dedupKey]) return false;
      f[dedupKey]=Date.now(); this.saveFlags();
    }
    const n={ id:uid(), type, title:String(title||"").slice(0,140), body:String(body||"").slice(0,300),
              icon, page, ts:Date.now(), read:false };
    state.notifs.unshift(n);
    if(state.notifs.length>this.max) state.notifs.length=this.max;
    persist("notifs"); updateBellBadge();
    this._just.push(n);
    if(this._just.length>20) this._just.shift();
    if(!silent) notifPopup(n);   /* v5: kartu POPUP langsung muncul di layar */
    return n;
  },
  unread(){ return state.notifs.filter(n=>!n.read).length; },
  markRead(id){ const n=state.notifs.find(x=>x.id===id); if(n&&!n.read){ n.read=true; persist("notifs"); updateBellBadge(); } },
  markAllRead(){
    if(state.notifs.some(n=>!n.read)){
      state.notifs.forEach(n=>n.read=true);
      persist("notifs"); updateBellBadge();
    }
  },
  clear(){ state.notifs=[]; persist("notifs"); updateBellBadge(); },
  /* ---- Pemeriksa otomatis ---- */
  check(silent=false){
    this._just=[];
    const added=this.checkOverdue(silent);
    this.checkDaily(silent);
    updateBellBadge();
    return added;
  },
  /* Tugas terlewat: tanggal+jam sudah lewat (1 menit s.d. 12 jam) & belum selesai */
  checkOverdue(silent=false){
    if(state.settings.notifTask===false) return 0;
    const now=new Date(), today=isoDate(now);
    let added=0;
    for(const t of state.tasks){
      if(t.done || !t.date || !t.time) continue;
      if(t.date>today) continue;
      const due=parseISO(t.date);
      due.setHours(parseInt(String(t.time).slice(0,2),10)||0, parseInt(String(t.time).slice(3,5),10)||0, 0, 0);
      const overdueMin=Math.round((now.getTime()-due.getTime())/60000);
      if(overdueMin<1 || overdueMin>720) continue;
      const kapan = t.date===today ? `pukul ${fmtTime(t.time)}` : `sejak ${shortDate(t.date)}`;
      const ok=this.add({ type:"overdue", title:"Tugas terlewat: "+t.title,
        body:`Dijadwalkan ${kapan} dan belum selesai. Ketuk untuk membuka daftar tugas.`,
        icon:"alert", page:"tasks", silent,
        dedupKey:"ov|"+t.id+"|"+t.date+"|"+t.time });
      if(ok) added++;
    }
    return added;
  },
  /* Ringkasan harian pada jam pilihan (sekali per hari) */
  checkDaily(silent=false){
    if(!state.settings.dailyReminder) return;
    const now=new Date(), today=isoDate(now), f=this.flags();
    if(f["daily|"+today]) return;
    const rt=String(state.settings.reminderTime||"07:00");
    const h=parseInt(rt.slice(0,2),10)||0, m=parseInt(rt.slice(3,5),10)||0;
    if(now.getHours()*60+now.getMinutes() < h*60+m) return;
    const tToday=state.tasks.filter(t=>t.date===today && !t.done);
    const evs=state.events.filter(e=>e.date===today);
    let body;
    if(tToday.length) body=`${tToday.length} tugas menunggu hari ini`;
    else body="Tidak ada tugas terjadwal — nikmati harimu";
    body += evs.length ? ` dan ${evs.length} agenda.` : ".";
    f["daily|"+today]=Date.now(); this.saveFlags();
    this.add({ type:"daily", title:"Ringkasan hari ini", body, icon:"sun", page:"home", silent });
  },
  /* Pencapaian streak kebiasaan: 3 / 7 / 14 / 30 / 60 / 100 hari */
  checkStreak(h){
    const s=habitStreak(h);
    if([3,7,14,30,60,100].includes(s)){
      this.add({ type:"streak", title:`Streak ${s} hari!`,
        body:`Kebiasaan "${h.name}" sudah ${s} hari beruntun. Pertahankan!`,
        icon:"flame", page:"habits", dedupKey:"st|"+h.id+"|"+s });
    }
  }
};

/* ---- Poin (XP) & level: aktivitas nyata -> poin -> gelar ---- */
const LEVELS = [["Pemula",0],["Pengerja Keras",120],["Konsisten",300],["Produktif",600],["Ahli",1000],["Master",1600],["Legenda",2600]];
function xpLevel(xp){ let li=0; for(let i=0;i<LEVELS.length;i++) if(xp>=LEVELS[i][1]) li=i; return li; }
function xpInfo(){
  const xp=Math.max(0,Math.round(state.xp||0)), li=xpLevel(xp), next=LEVELS[li+1]||null, base=LEVELS[li][1];
  const pct = next ? Math.min(100,Math.round((xp-base)/(next[1]-base)*100)) : 100;
  return {xp, li, title:LEVELS[li][0], next, base, pct};
}
function xpFromHistory(src){
  const s = src || state;
  let xp = 0;
  xp += (s.tasks||[]).filter(t=>t.done).length * 10;
  xp += (s.journals||[]).length * 5;
  xp += (s.focus||[]).reduce((a,f)=>a+Math.min(f.minutes||0,30), 0);
  xp += (s.habits||[]).reduce((a,h)=>a+((h.dates||[]).length*2), 0);
  return xp;
}
function awardXP(amount, opts={}){
  amount = Math.round(amount);
  if(!amount) return;
  const before = xpLevel(state.xp||0);
  state.xp = Math.max(0, Math.round((state.xp||0) + amount));
  persist("xp");
  const after = xpLevel(state.xp);
  if(after > before){
    const info = xpInfo();
    NC.add({ type:"level", title:"Naik level: "+info.title,
      body:`Semangatmu membawamu ke Level ${after+1} — ${info.title}. Total ${info.xp} poin. Pertahankan!`,
      icon:"sparkle", page:"profile" });
    confetti(); fanfare();
  }else if(amount>0 && !opts.quiet){
    toast(`+${amount} poin · total ${state.xp} (${xpInfo().title}).`,"success");
  }
}

function gamifyBadges(){
  const have = new Set((state.badgeLog||[]).map(b=>b.t));
  const fresh = computeBadges().filter(b=>b.ok && !have.has(b.t));

/* ---- Confetti: perayaan kecil tanpa pustaka luar ---- */
let _confP = [], _confRun = false;
function confetti(){
  if(state.settings.animations===false) return;
  const cv = el("confettiCanvas"); if(!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.floor(innerWidth*dpr); cv.height = Math.floor(innerHeight*dpr);
  cv.hidden = false;
  const ctx = cv.getContext("2d"); if(!ctx) return;
  const colors = ["#0d7148","#33c17f","#f4b942","#e2603c","#8fd4b0","#f7e08a"];
  for(let i=0;i<110;i++){
    _confP.push({ x:(0.2+Math.random()*0.6)*cv.width, y:(0.25+Math.random()*0.2)*cv.height,
      vx:(Math.random()-0.5)*7*dpr, vy:-(3+Math.random()*6.5)*dpr,
      w:(3+Math.random()*4)*dpr, h:(5+Math.random()*6)*dpr,
      r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      c:colors[(Math.random()*colors.length)|0], life:90+Math.random()*40 });
  }
  if(_confRun) return;
  _confRun = true;
  (function step(){
    ctx.clearRect(0,0,cv.width,cv.height);
    _confP = _confP.filter(p=>p.life>0 && p.y<cv.height+40);
    for(const p of _confP){
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.22*dpr; p.vx*=0.99; p.r+=p.vr; p.life--;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life/30));
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if(_confP.length){ requestAnimationFrame(step); }
    else{ _confRun=false; cv.hidden=true; ctx.clearRect(0,0,cv.width,cv.height); }
  })();
}

/* ---- Efek suara lembut (WebAudio, tanpa berkas eksternal) ---- */
function _tone(freqs, gap, dur, type, vol){
  if(state.settings.sound===false) return;
  gap=gap||0.12; dur=dur||0.16; type=type||"sine"; vol=vol||0.16;
  try{
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx = new AC();
    freqs.forEach((f,i)=>{
      const t0 = ctx.currentTime + i*gap;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+dur+0.05);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, (freqs.length*gap+dur+0.3)*1000);
  }catch(e){}
}
function ding(){ _tone([660,880], 0.09, 0.14); }
function fanfare(){ _tone([523,659,784,1047], 0.11, 0.2, "triangle", 0.18); }
function ting(){ _tone([880,1318], 0.06, 0.11, "sine", 0.1); }   /* v6: bunyi halus kartu popup */
