  return `<section class="card pad ann-card">
    <div class="sec-head"><h3>${ic("sparkle",17)} Pengumuman</h3></div>
    ${list.map(a=>{
      const baru = a.date && daysUntil(a.date) >= -3;
      return `<div class="ann-item">
        <div class="ann-t"><span>${esc(a.title)}</span>${baru?`<span class="ann-new">BARU</span>`:""}</div>
        ${a.body?`<p class="ann-b">${esc(a.body)}</p>`:""}
        ${a.date?`<span class="ann-d">${esc(displayDate(a.date))}</span>`:""}
      </div>`;
    }).join("")}
  </section>`;
}

/* Beri tahu pengguna untuk pengumuman yang belum pernah dilihat (per profil). */
function annNotify(items){
  if(!state.settings.notifications || state.settings.notifAnn===false || !Notif.granted()) return;
  const seenKey = STORE_PREFIX + "annSeen";
  let seen = null;
  try{ seen = JSON.parse(localStorage.getItem(seenKey)); }catch(e){ seen = null; }
  if(!Array.isArray(seen)){
    /* pertama kali: tandai semua yang ada agar tidak membanjiri notifikasi lama */
    try{ localStorage.setItem(seenKey, JSON.stringify(items.filter(a=>a.active!==false).map(a=>a.id))); }catch(e){}
    return;
  }
  const fresh = items.filter(a=>a.active!==false && !seen.includes(a.id));
  if(!fresh.length) return;
  fresh.slice(0,3).forEach(a=>{
    Notif.send("📢 Pengumuman baru: "+a.title,
      a.body ? snippet(a.body, 120) : "Buka GreenDay untuk membaca pengumuman lengkapnya.",
      "ann-"+a.id);
    seen.push(a.id);
  });
  try{ localStorage.setItem(seenKey, JSON.stringify(seen)); }catch(e){}
}

function annFetch() {
  fetch("pengumuman.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("tidak ada"); return r.json(); })
    .then(obj => {
      if (!isObj(obj) || !Array.isArray(obj.items)) return;
      const items = obj.items.filter(isObj).map(x => ({
        id: (typeof x.id === "string" && x.id) ? x.id : uid(),
        title: String(x.title || "").slice(0, 120),
        body: String(x.body || "").slice(0, 1000),
        date: (typeof x.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x.date)) ? x.date : "",
        active: x.active !== false
      }));
      if (JSON.stringify(items) !== JSON.stringify(annItems)) {
        annItems = items;
        try { localStorage.setItem(ANN_KEY, JSON.stringify(items)); } catch (e) {}
        annNotify(items);
        renderApp();
      }
    })
    .catch(() => { /* offline / berkas belum ada: pengumuman terakhir tetap tampil */ });
}

/* Sisipkan kartu pengumuman ke Beranda setiap kali halaman dirender.
   Cara ini membungkus renderApp tanpa mengubah kode aslinya sama sekali. */

<!-- Tombol instal aplikasi (muncul otomatis setelah di-hosting HTTPS) -->
<button id="gdInstallFab" class="gd-fab" hidden>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
  Instal GreenDay
</button>

<script>
/* ===== PWA: registrasi service worker & tombol instal ===== */
(function(){
  var fab = document.getElementById("gdInstallFab");
  var deferredPrompt = null;

  if (window.matchMedia && matchMedia("(display-mode: standalone)").matches && fab) fab.hidden = true;

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){
        console.log("Service worker tidak aktif — buka lewat HTTPS agar mode offline siap.");
      });
    });
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPrompt = e;
    if (fab) fab.hidden = false;
  });

  if (fab) fab.addEventListener("click", function(){
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){
      deferredPrompt = null;
      fab.hidden = true;
    });
  });

  window.addEventListener("appinstalled", function(){
    if (fab) fab.hidden = true;
  });
})();
</script>
</body>
</html>
